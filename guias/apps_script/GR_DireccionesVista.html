<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font-family: "Google Sans", Roboto, Arial, sans-serif; font-size: 13px; color: #263238; margin: 0; padding: 12px 16px; background: #f4f6f8; }
  .barra { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=text] { padding: 8px 10px; border: 1px solid #cfd8dc; border-radius: 8px; font: inherit; }
  input[type=text]:focus { outline: none; border-color: #1e88e5; box-shadow: 0 0 0 2px #bbdefb; }
  #ruc { width: 150px; } #nombre { flex: 1; min-width: 200px; }
  .btn { border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; cursor: pointer; }
  .pri { background: #1565c0; color: #fff; font-weight: 600; } .pri:disabled { background: #90caf9; }
  .sec { background: #eceff1; color: #37474f; }
  .item { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 9px 12px; margin-bottom: 7px; display: flex; gap: 10px; align-items: center; }
  .item.si { border-color: #a5d6a7; }
  .item .txt { flex: 1; min-width: 0; }
  .dir { font-weight: 600; } .ubi { color: #00796b; font-size: 12px; margin-top: 2px; }
  .ya { font-size: 11px; background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  select { padding: 6px; border: 1px solid #cfd8dc; border-radius: 6px; font: inherit; }
  .usar { font-size: 12px; color: #1565c0; white-space: nowrap; }
  input[type=checkbox] { width: 18px; height: 18px; }
  .aviso { background: #fff8e1; color: #6d4c00; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; }
  .pie { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; }
  .pie .msg { margin-right: auto; font-size: 12px; }
  .err { color: #c62828; } .ok { color: #2e7d32; }
  #lista { max-height: 380px; overflow: auto; }
  .vacio { color: #90a4ae; text-align: center; padding: 30px; }
</style>
</head>
<body>
<div class="barra">
  <input type="text" id="ruc" placeholder="RUC (11 dígitos)" maxlength="11">
  <input type="text" id="nombre" placeholder="Nombre (empresa o cliente) — opcional">
  <button class="btn pri" id="buscar" onclick="buscar()">🔎 Buscar en SUNAT</button>
</div>
<div id="info"></div>
<div id="lista"><div class="vacio">Escriba el RUC y toque 🔎 Buscar. Se muestran todos los locales que ese RUC tiene registrados en SUNAT (almacenes, tiendas, sucursales).</div></div>
<div class="pie"><span class="msg" id="msg"></span>
  <button class="btn sec" onclick="google.script.host.close()">Cerrar</button>
  <button class="btn pri" id="guardar" onclick="guardar()" disabled>Agregar a 📍 Direcciones</button>
</div>
<script>
var C = JSON.parse(<?= ctxJson ?>), D = null;
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
document.getElementById('ruc').value = C.ruc || '';
document.getElementById('nombre').value = C.nombre || '';
document.getElementById('ruc').addEventListener('keydown', function (e) { if (e.key === 'Enter') buscar(); });
if (C.ruc && C.ruc.length === 11) buscar();
function buscar() {
  var ruc = document.getElementById('ruc').value.replace(/\D/g, ''), b = document.getElementById('buscar');
  b.disabled = true; b.textContent = '⏳ Buscando…';
  document.getElementById('lista').innerHTML = '<div class="vacio">Consultando el padrón de locales de SUNAT… (la primera vez tarda 20–40 segundos)</div>';
  google.script.run.withSuccessHandler(function (d) { b.disabled = false; b.textContent = '🔎 Buscar en SUNAT'; D = d; pintar(); })
    .withFailureHandler(function (e) { b.disabled = false; b.textContent = '🔎 Buscar en SUNAT';
      document.getElementById('lista').innerHTML = '<div class="aviso">⚠️ ' + esc(e.message) + '</div>'; })
    .GR_buscarDirecciones(ruc);
}
function pintar() {
  if (!document.getElementById('nombre').value && D.nombre) document.getElementById('nombre').value = D.nombre;
  var h = '', usoDef = C.para === 'p' ? 'Partida' : 'Llegada';
  document.getElementById('info').innerHTML = C.id ? '<div class="aviso">Marque <b>«usar en la guía»</b> (guía ' + esc(C.id) + ') en el local que va como ' + (C.para === 'p' ? 'PARTIDA' : 'LLEGADA') + '.</div>' : '';
  if (!D.anexos.length) h = '<div class="vacio">SUNAT no tiene locales anexos para el RUC ' + esc(D.ruc) + ' (solo su domicilio fiscal, que viene en la factura).</div>';
  D.anexos.forEach(function (a, i) {
    h += '<div class="item' + (a.yaEsta ? '' : '') + '" id="it' + i + '"><input type="checkbox" id="c' + i + '" ' + (a.yaEsta ? 'checked disabled' : '') + ' onchange="marcar()">' +
      '<div class="txt"><div class="dir">' + esc(a.direccion) + (a.yaEsta ? '<span class="ya">ya está en 📍</span>' : '') + '</div><div class="ubi">' + esc(a.etiqueta) + '</div></div>' +
      '<select id="u' + i + '"><option' + (usoDef === 'Llegada' ? ' selected' : '') + '>Llegada</option><option' + (usoDef === 'Partida' ? ' selected' : '') + '>Partida</option><option>Ambos</option></select>' +
      (C.id ? '<label class="usar"><input type="radio" name="usar" value="' + i + '" onchange="marcarUsar(' + i + ')"> usar en la guía</label>' : '') + '</div>';
  });
  document.getElementById('lista').innerHTML = h;
  marcar();
}
function marcarUsar(i) { var c = document.getElementById('c' + i); if (!c.disabled) c.checked = true; marcar(); }
function marcar() {
  var n = D.anexos.filter(function (a, i) { return document.getElementById('c' + i).checked && !a.yaEsta; }).length;
  var usar = document.querySelector('input[name=usar]:checked');
  document.getElementById('guardar').disabled = !n && !usar;
  document.getElementById('guardar').textContent = n ? 'Agregar ' + n + ' a 📍 Direcciones' + (usar ? ' y usar en la guía' : '') : (usar ? 'Usar en la guía' : 'Agregar a 📍 Direcciones');
  D.anexos.forEach(function (a, i) { document.getElementById('it' + i).className = 'item' + (document.getElementById('c' + i).checked ? ' si' : ''); });
}
function guardar() {
  var items = [], usar = document.querySelector('input[name=usar]:checked'), idxUsar = -1, m = document.getElementById('msg');
  D.anexos.forEach(function (a, i) {
    var elegido = document.getElementById('c' + i).checked || (usar && Number(usar.value) === i);
    if (!elegido) return;
    if (usar && Number(usar.value) === i) idxUsar = items.length;
    items.push({ direccion: a.direccion, ubigeo: a.etiqueta, uso: document.getElementById('u' + i).value });
  });
  var b = document.getElementById('guardar'); b.disabled = true; m.className = 'msg'; m.textContent = 'Guardando…';
  google.script.run.withSuccessHandler(function (r) {
      m.className = 'msg ok'; m.textContent = '✅ ' + r.agregadas + ' agregada(s) a 📍 Direcciones' + (r.guia ? ' · puesta en la guía ' + r.guia : '') + '.';
      setTimeout(function () { google.script.host.close(); }, 1200); })
    .withFailureHandler(function (e) { b.disabled = false; m.className = 'msg err'; m.textContent = '⚠️ ' + e.message; })
    .GR_agregarDirecciones({ ruc: D.ruc, nombre: document.getElementById('nombre').value, items: items, id: C.id, usar: idxUsar, para: C.para });
}
</script>
</body>
</html>
