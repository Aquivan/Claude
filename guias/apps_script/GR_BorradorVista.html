<!DOCTYPE html>
<html>
<head>
<base target="_blank">
<meta charset="utf-8">
<style id="estilo">
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #222; margin: 0; padding: 10px 14px; background: #eef1f4; }
  .doc { background: #fff; max-width: 880px; margin: 0 auto; padding: 22px 26px; border: 1px solid #d0d7de; }
  .cab { display: table; width: 100%; border-bottom: 2px solid #1565c0; padding-bottom: 10px; }
  .cab .izq, .cab .der { display: table-cell; vertical-align: top; }
  .cab .der { width: 280px; border: 2px solid #1565c0; border-radius: 8px; text-align: center; padding: 8px; }
  .rem { font-size: 16px; font-weight: bold; } .gris { color: #607d8b; font-size: 11px; }
  .tipo { font-weight: bold; color: #1565c0; font-size: 13px; } .num { font-size: 15px; font-weight: bold; margin-top: 4px; }
  .marca { display: inline-block; margin-top: 6px; font-size: 10px; background: #fff3e0; color: #e65100; padding: 2px 8px; border-radius: 10px; }
  h3 { font-size: 11px; letter-spacing: .5px; color: #fff; background: #37474f; margin: 14px 0 0; padding: 4px 8px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border: 1px solid #cfd8dc; padding: 5px 7px; vertical-align: top; text-align: left; }
  th { background: #eceff1; font-size: 11px; }
  .k { width: 150px; color: #546e7a; background: #f7f9fa; font-size: 11px; }
  .n { text-align: right; white-space: nowrap; }
  .falta { background: #ffebee; color: #c62828; font-weight: bold; }
  .lote { color: #00796b; font-size: 10px; }
  .pie { margin-top: 14px; font-size: 10px; color: #78909c; text-align: center; }
  .avisos { max-width: 880px; margin: 0 auto 8px; }
  .av { padding: 7px 10px; border-radius: 8px; font-size: 12px; margin-bottom: 6px; }
  .av.f { background: #ffebee; color: #b71c1c; } .av.a { background: #fff8e1; color: #6d4c00; } .av.ok { background: #e8f5e9; color: #1b5e20; }
  .barra { max-width: 880px; margin: 8px auto 0; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .btn { border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; cursor: pointer; }
  .pri { background: #1565c0; color: #fff; font-weight: bold; } .pri:disabled { background: #90caf9; } .sec { background: #fff; border: 1px solid #cfd8dc; }
  #msg { margin-right: auto; font-size: 12px; }
  .ed { max-width: 880px; margin: 0 auto; background: #fff; border: 1px solid #d0d7de; padding: 14px 18px; }
  .ed h4 { margin: 14px 0 6px; font-size: 12px; color: #37474f; border-bottom: 1px solid #eceff1; padding-bottom: 3px; }
  .ed .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px 14px; }
  .ed label { display: block; font-size: 11px; color: #546e7a; margin-bottom: 2px; }
  .ed input, .ed select, .ed textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cfd8dc; border-radius: 6px; font: inherit; }
  .ed .cambio { border-color: #fb8c00; background: #fff8e1; }
  .conf td { font-size: 12px; } .conf .viejo { color: #9e9e9e; text-decoration: line-through; } .conf .nuevo { color: #1b5e20; font-weight: bold; }
</style>
</head>
<body>
<div id="app">Armando la guía…</div>
<script>
var ID = <?= idGuia ?>, D = null;
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function v(x, falta) { return x ? esc(x) : /^(opcional|—)/.test(falta || '') ? '<span class="gris">' + esc(falta) + '</span>' : '<span class="falta">' + (falta || 'FALTA') + '</span>'; }
function fila(k, x, falta) { return '<tr><td class="k">' + k + '</td><td>' + (falta === false ? esc(x || '—') : v(x, falta)) + '</td></tr>'; }
function fmt(n) { var x = Number(String(n).replace(/,/g, '')); return isNaN(x) ? esc(n) : x.toLocaleString('en-US', { maximumFractionDigits: 3 }); }
function pintar(d) {
  D = d;
  var h = '<div class="avisos">';
  if (d.faltas.length) h += '<div class="av f">✏️ <b>Falta completar:</b> ' + esc(d.faltas.join(', ')) + '</div>';
  if (d.avisos.length) h += '<div class="av a">⚠️ <b>Revise:</b> ' + esc(d.avisos.join(' · ')) + '</div>';
  if (!d.faltas.length) h += '<div class="av ok">✅ Con estos datos la guía está completa. Se emitirá en <b>' + esc(d.donde) + '</b> (👁 Vista previa → ✅ Emitir).</div>';
  h += '</div><div class="doc" id="doc">';
  h += '<div class="cab"><div class="izq"><div class="rem">' + v(d.remitente.nombre, 'FALTA LA EMPRESA') + '</div><div class="gris">RUC ' + esc(d.remitente.ruc) + ' · Remitente</div>' +
       '<div class="gris" style="margin-top:6px">Emisión: ' + esc(d.emision) + ' · Inicio de traslado: ' + v(d.traslado) + '</div></div>' +
       '<div class="der"><div class="tipo">GUÍA DE REMISIÓN<br>REMITENTE ELECTRÓNICA</div><div class="num">' + (d.numero ? esc(d.numero) : esc(d.remitente.serie || 'T???') + ' - (al emitir)') + '</div>' +
       (d.numero ? '' : '<div class="marca">BORRADOR · sin valor oficial</div>') + '</div></div>';
  h += '<h3>DESTINATARIO Y DOCUMENTO</h3><table>' + fila('Destinatario', d.destinatario.nombre) + fila(esc(d.destinatario.tipo.split(' - ')[1] || 'Documento'), d.destinatario.doc) +
       fila('Doc. relacionado', d.documento, 'FALTA LA FACTURA') + '</table>';
  h += '<h3>DATOS DEL TRASLADO</h3><table>' + fila('Motivo', d.motivo + (d.motivoTxt ? ' · ' + d.motivoTxt : '')) + fila('Modalidad', d.modalidad) +
       fila('Peso bruto total', d.peso ? fmt(d.peso) + ' ' + d.upeso : '') + fila('N° de bultos', d.bultos, d.donde === 'Quesito' ? 'FALTA' : '—') +
       fila('Entrega al transportista', d.entrega, false) + '</table>';
  h += '<h3>PUNTO DE PARTIDA Y DE LLEGADA</h3><table><tr><th style="width:50%">Partida</th><th>Llegada</th></tr><tr><td>' + v(d.partida.dir) + '<div class="gris">' + v(d.partida.ubi, 'FALTA EL DISTRITO') +
       (d.partida.cod ? ' · Cód. ' + esc(d.partida.cod) : '') + '</div></td><td>' + v(d.llegada.dir) + '<div class="gris">' + v(d.llegada.ubi, 'FALTA EL DISTRITO') + (d.llegada.cod ? ' · Cód. ' + esc(d.llegada.cod) : '') + '</div></td></tr></table>';
  h += '<h3>TRANSPORTE</h3><table>';
  if (d.transportista) h += fila('Transportista', d.transportista.nombre) + fila('RUC', d.transportista.ruc) + fila('N° registro MTC', d.transportista.mtc, false);
  if (d.m1) h += fila('Vehículo', 'M1 o L (sin placa ni conductor)', false);
  else {
    var opc = !d.privado;
    if (d.vehiculos.length) d.vehiculos.forEach(function (x) { h += fila('Vehículo ' + x.rol.toLowerCase(), x.placa + (x.cert ? ' · Cert. MTC ' + x.cert : ''), false); });
    else h += fila('Vehículo', '', opc ? 'opcional (público)' : 'FALTA LA PLACA');
    if (d.conductor) h += fila('Conductor', d.conductor.nombre + ' · DNI ' + (d.conductor.dni || '?') + ' · Lic. ' + (d.conductor.licencia || '?'), false);
    else h += fila('Conductor', '', opc ? 'opcional (público)' : 'FALTA EL CONDUCTOR');
  }
  h += '</table>';
  h += '<h3>BIENES A TRASLADAR <span style="font-weight:normal">(' + esc(d.bienesOrigen) + ')</span></h3><table><tr><th style="width:36px">N°</th><th>Descripción</th><th style="width:70px">Unidad</th><th style="width:110px" class="n">Cantidad</th></tr>';
  if (d.bienes.length) d.bienes.forEach(function (b, i) { h += '<tr><td>' + (i + 1) + '</td><td>' + esc(b.desc) + (b.lote ? '<div class="lote">' + esc(b.lote) + '</div>' : '') + '</td><td>' + esc(b.unidad || 'NIU') + '</td><td class="n">' + fmt(b.cant) + '</td></tr>'; });
  else h += '<tr><td colspan="4" style="text-align:center;color:#78909c">' + esc(d.bienesOrigen) + '</td></tr>';
  h += '</table>';
  h += '<h3>OBSERVACIONES</h3><table><tr><td>' + (d.observaciones ? esc(d.observaciones) : '<span class="gris">(ninguna)</span>') + '</td></tr></table>';
  h += '<div class="pie">Borrador generado desde la hoja «Guías de Remisión · Grupo» (guía ' + esc(d.id) + '). La guía oficial la crea ' + esc(d.donde) + ' al emitir.</div></div>';
  h += '<div class="barra"><span id="msg"></span><button class="btn sec" onclick="google.script.host.close()">Cerrar</button>' +
       (d.fijo ? '' : '<button class="btn sec" onclick="editar()">✏️ Corregir datos</button>') +
       '<button class="btn sec" id="img" onclick="imagen()">🖼 Copiar como imagen</button>' +
       '<button class="btn pri" id="pdf" onclick="pdf()">📄 Guardar PDF en Drive</button></div>';
  document.getElementById('app').innerHTML = h;
}
/** La guía como imagen: se copia al portapapeles (para pegar en WhatsApp/Telegram/correo con Ctrl+V);
 *  si el navegador no deja copiar, se muestra la imagen para clic derecho → «Copiar imagen» o descargarla. */
function imagen() {
  var b = document.getElementById('img'), m = document.getElementById('msg');
  b.disabled = true; m.textContent = 'Armando la imagen…';
  cargarH2c(function () {
    html2canvas(document.getElementById('doc'), { scale: 2, backgroundColor: '#ffffff' }).then(function (cv) {
      cv.toBlob(function (blob) {
        var url = URL.createObjectURL(blob);
        var listo = function () { b.disabled = false; m.innerHTML = '✅ Imagen copiada. Péguela con <b>Ctrl+V</b> en WhatsApp, Telegram o el correo.'; };
        var mostrar = function () {
          b.disabled = false; m.textContent = '';
          var o = document.createElement('div');
          o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9;overflow:auto;padding:14px;text-align:center';
          o.innerHTML = '<div style="color:#fff;margin-bottom:8px">Haga <b>clic derecho sobre la imagen → «Copiar imagen»</b> (o <a style="color:#90caf9" download="Guia ' + esc(ID) + '.png" href="' + url + '">descárguela</a>). ' +
            '<button class="btn sec" style="margin-left:8px;padding:5px 12px">Cerrar</button></div><img style="max-width:100%;background:#fff" src="' + url + '">';
          o.querySelector('button').onclick = function () { o.remove(); };
          document.body.appendChild(o);
        };
        try { navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(listo, mostrar); } catch (e) { mostrar(); }
      }, 'image/png');
    }, function (e) { b.disabled = false; m.textContent = '⚠️ ' + e; });
  });
}
function cargarH2c(fn) {
  if (window.html2canvas) return fn();
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload = fn; s.onerror = function () { document.getElementById('img').disabled = false; document.getElementById('msg').textContent = '⚠️ No se pudo cargar el generador de imagen.'; };
  document.head.appendChild(s);
}
/* ✏️ Corregir desde el borrador: se edita, se revisa la lista «antes → ahora» y solo con ✅ Confirmar se guarda en la fila. */
function editar() {
  var h = '<div class="ed"><b>✏️ Corregir la guía ' + esc(ID) + '</b> <span class="gris">— cambie lo que necesite; lo que cambie se marca en naranja. Nada se guarda hasta que confirme.</span>';
  D.editar.forEach(function (g) {
    h += '<h4>' + esc(g.titulo) + '</h4><div class="g">';
    g.campos.forEach(function (c) {
      var id = 'f_' + c.k, ctl;
      if (c.op) {
        var ops = c.op.slice(); if (c.v && ops.indexOf(c.v) < 0) ops.unshift(c.v);
        ctl = '<select id="' + id + '" data-k="' + c.k + '"><option value=""></option>' + ops.map(function (o) { return '<option' + (o === c.v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
      } else if (c.k === 'obs' || c.k === 'pedido') ctl = '<textarea id="' + id + '" data-k="' + c.k + '" rows="2">' + esc(c.v) + '</textarea>';
      else ctl = '<input id="' + id + '" data-k="' + c.k + '" value="' + esc(c.v) + '"' + (c.fecha ? ' placeholder="dd/mm/aaaa"' : '') + '>';
      h += '<div' + (c.k === 'obs' || c.k === 'pedido' ? ' style="grid-column:1/-1"' : '') + '><label title="' + esc(c.n) + '">' + esc(c.t) + '</label>' + ctl + '</div>';
    });
    h += '</div>';
  });
  h += '</div><div class="barra"><span id="msg"></span><button class="btn sec" onclick="pintar(D)">Cancelar</button>' +
       '<button class="btn pri" onclick="revisar()">Revisar cambios →</button></div>';
  document.getElementById('app').innerHTML = h;
  document.querySelectorAll('.ed [data-k]').forEach(function (e) { e.addEventListener('input', function () { e.classList.toggle('cambio', e.value.trim() !== original(e.dataset.k)); }); e.addEventListener('change', function () { e.classList.toggle('cambio', e.value.trim() !== original(e.dataset.k)); }); });
}
function original(k) { var v = ''; D.editar.forEach(function (g) { g.campos.forEach(function (c) { if (c.k === k) v = String(c.v || '').trim(); }); }); return v; }
function titulo(k) { var v = k; D.editar.forEach(function (g) { g.campos.forEach(function (c) { if (c.k === k) v = c.t; }); }); return v; }
var CAMBIOS = null, PANTALLA = '';
function revisar() {
  CAMBIOS = {}; var n = 0;
  document.querySelectorAll('.ed [data-k]').forEach(function (e) { var v = e.value.trim(); if (v !== original(e.dataset.k)) { CAMBIOS[e.dataset.k] = v; n++; } });
  if (!n) { document.getElementById('msg').textContent = 'No cambió nada.'; return; }
  PANTALLA = document.getElementById('app').innerHTML;
  var vals = {}; document.querySelectorAll('.ed [data-k]').forEach(function (e) { vals[e.dataset.k] = e.value; });
  var h = '<div class="ed"><b>¿Guardar estos ' + n + ' cambio(s) en la guía ' + esc(ID) + '?</b><table class="conf" style="margin-top:10px"><tr><th>Campo</th><th>Antes</th><th>Ahora</th></tr>';
  Object.keys(CAMBIOS).forEach(function (k) { h += '<tr><td>' + esc(titulo(k)) + '</td><td class="viejo">' + (esc(original(k)) || '(vacío)') + '</td><td class="nuevo">' + (esc(CAMBIOS[k]) || '(vacío)') + '</td></tr>'; });
  h += '</table><p class="gris">Se guarda en la fila de la hoja (como si lo escribiera allí: se completan solos los datos que dependan de esto). ' +
       'Si ya pidió la vista previa en Quesito o SUNAT, vuelva a pedirla para que el robot use los cambios.</p></div>' +
       '<div class="barra"><span id="msg"></span><button class="btn sec" onclick="volver()">← Volver a corregir</button>' +
       '<button class="btn pri" id="ok" onclick="guardar()">✅ Confirmar y guardar</button></div>';
  document.getElementById('app').innerHTML = h;
  window._vals = vals;
}
function volver() {
  document.getElementById('app').innerHTML = PANTALLA;
  document.querySelectorAll('.ed [data-k]').forEach(function (e) { if (window._vals && e.dataset.k in window._vals) e.value = window._vals[e.dataset.k]; e.classList.toggle('cambio', e.value.trim() !== original(e.dataset.k));
    e.addEventListener('input', function () { e.classList.toggle('cambio', e.value.trim() !== original(e.dataset.k)); }); e.addEventListener('change', function () { e.classList.toggle('cambio', e.value.trim() !== original(e.dataset.k)); }); });
}
function guardar() {
  var b = document.getElementById('ok'), m = document.getElementById('msg');
  b.disabled = true; m.textContent = 'Guardando y revisando la guía…';
  google.script.run.withSuccessHandler(function (d) {
      pintar(d);
      document.getElementById('msg').innerHTML = '✅ Guardado (' + Object.keys(CAMBIOS).length + ' cambio(s)). Así queda ahora.' + (/Vista previa/.test(d.estado) ? '' : '');
    })
    .withFailureHandler(function (e) { b.disabled = false; m.textContent = '⚠️ ' + e.message; })
    .GR_guardarBorrador(ID, CAMBIOS);
}
function pdf() {
  var b = document.getElementById('pdf'), m = document.getElementById('msg');
  b.disabled = true; m.textContent = 'Generando PDF…';
  var html = '<style>' + document.getElementById('estilo').innerHTML + '</style>' + document.getElementById('doc').outerHTML;
  google.script.run.withSuccessHandler(function (url) { b.disabled = false; m.innerHTML = '✅ Guardado: <a href="' + esc(url) + '">abrir el PDF ↗</a>'; })
    .withFailureHandler(function (e) { b.disabled = false; m.textContent = '⚠️ ' + e.message; })
    .GR_borradorPdf(ID, html);
}
google.script.run.withSuccessHandler(pintar)
  .withFailureHandler(function (e) { document.getElementById('app').textContent = '⚠️ ' + e.message; })
  .GR_datosBorrador(ID);
</script>
</body>
</html>
