<!DOCTYPE html>
<html>
<head>
<base target="_blank">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #263238; margin: 0; padding: 8px; background: #f4f6f8; }
  .barra { display: flex; gap: 4px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .barra b { flex: 1; font-size: 12px; min-width: 90px; }
  button { border: 1px solid #cfd8dc; background: #fff; border-radius: 6px; padding: 5px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #e3f2fd; }
  #marco { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; overflow: auto; text-align: center; max-height: 70vh; }
  #marco img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  #marco.zoom img { width: 220%; max-width: none; cursor: zoom-out; }
  .vacio { padding: 40px 10px; color: #78909c; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; background: #fff; }
  td { border-bottom: 1px solid #eceff1; padding: 4px 6px; vertical-align: top; }
  td.k { color: #607d8b; width: 38%; }
  .gris { color: #90a4ae; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="barra">
  <button onclick="mover(-1)" title="Fila anterior">◀</button>
  <button onclick="mover(1)" title="Fila siguiente">▶</button>
  <b id="donde">Haga clic en una fila…</b>
  <button onclick="pdf()" title="Abrir el archivo original en Drive">📄 Original</button>
  <button onclick="google.script.run.VV_abrirGrande()" title="Abrir en ventana grande (se puede mover)">⤢</button>
</div>
<div id="marco"><div class="vacio">Haga clic en cualquier celda de una fila de vouchers y aquí aparece su imagen en grande.</div></div>
<table id="datos"></table>
<div class="gris">Clic en la imagen = agrandar / achicar. Se actualiza solo al cambiar de fila. Para apagarlo, cierre este panel.</div>
<script>
var actual = { hoja: '', fila: 0 }, cargando = false, D = null;
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function mirar() {
  if (document.hidden || cargando) return setTimeout(mirar, 1200);
  google.script.run.withSuccessHandler(function (s) {
    if (s && (s.hoja !== actual.hoja || s.fila !== actual.fila)) cargar(s.hoja, s.fila);
    setTimeout(mirar, 1000);
  }).withFailureHandler(function () { setTimeout(mirar, 3000); }).VV_seleccion();
}
function cargar(hoja, fila) {
  actual = { hoja: hoja, fila: fila }; cargando = true;
  document.getElementById('donde').textContent = hoja + ' · fila ' + fila + '…';
  google.script.run.withSuccessHandler(pintar).withFailureHandler(function (e) { cargando = false; document.getElementById('donde').textContent = '⚠️ ' + e.message; }).VV_datos(hoja, fila);
}
function pintar(d) {
  cargando = false; D = d;
  if (d.hoja !== actual.hoja || d.fila !== actual.fila) return;   // ya cambió de fila
  document.getElementById('donde').textContent = d.hoja + ' · fila ' + d.fila + (d.pagina ? ' · pág. ' + d.pagina : '');
  var m = document.getElementById('marco'); m.className = '';
  if (d.vacio) m.innerHTML = '<div class="vacio">Esa fila no tiene voucher.</div>';
  else if (d.img) { m.innerHTML = '<img id="img" alt="voucher">'; var i = document.getElementById('img'); i.src = d.img; i.onclick = function () { m.className = m.className ? '' : 'zoom'; }; }
  else m.innerHTML = '<div class="vacio">' + (d.texto ? esc(d.texto) + '<br>' : 'Sin imagen en la celda.<br>') + (d.archivo ? 'Use 📄 Original para ver el archivo.' : '') + '</div>';
  document.getElementById('datos').innerHTML = (d.campos || []).map(function (c) { return '<tr><td class="k">' + esc(c[0]) + '</td><td>' + esc(c[1]) + '</td></tr>'; }).join('') +
    (d.archivo ? '<tr><td class="k">Archivo</td><td>' + esc(d.archivo) + '</td></tr>' : '');
}
function mover(paso) {
  if (!actual.hoja) return;
  google.script.run.withSuccessHandler(function (f) { if (f) cargar(actual.hoja, f); }).VV_ir(actual.hoja, actual.fila + paso);
}
function pdf() {
  if (!D || !D.archivo) return;
  var w = window.open('', '_blank');
  google.script.run.withSuccessHandler(function (u) { if (u && w) w.location = u; else { if (w) w.close(); alert('No encontré el archivo «' + D.archivo + '» en Drive.'); } }).VV_urlArchivo(D.archivo);
}
mirar();
</script>
</body>
</html>
