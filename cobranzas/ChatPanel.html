<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --azul:#1F4E79; --oscuro:#0F172A; --suave:#64748B; --borde:#E2E8F0; --fondo:#F8FAFC; --ia:#FFFFFF; --yo:#E0F2FE; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 Arial, sans-serif; color:#0F172A; background:var(--fondo); display:flex; flex-direction:column; height:100vh; }
  header { background:var(--oscuro); color:#F8FAFC; padding:8px 10px; display:flex; gap:6px; align-items:center; }
  header b { flex:1; font-size:13px; }
  header button { background:#334155; color:#F8FAFC; border:0; border-radius:6px; padding:4px 7px; font-size:11px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:10px; }
  .msg { margin:0 0 10px; padding:8px 10px; border-radius:10px; border:1px solid var(--borde); word-wrap:break-word; }
  .yo { background:var(--yo); margin-left:24px; }
  .ia { background:var(--ia); margin-right:8px; }
  .err { background:#FEE2E2; border-color:#FCA5A5; }
  .det { color:var(--suave); font-size:10px; margin-top:6px; }
  .chip { display:inline-block; background:#E2E8F0; border-radius:10px; padding:1px 8px; margin:2px 4px 0 0; font-size:11px; }
  .chip i { cursor:pointer; font-style:normal; margin-left:4px; color:#B91C1C; }
  .tabla { overflow-x:auto; margin-top:8px; border:1px solid var(--borde); border-radius:6px; }
  .tabla div.t { font-weight:bold; padding:4px 6px; background:#EEF3F8; font-size:12px; }
  table { border-collapse:collapse; font-size:11px; width:100%; }
  th { background:var(--azul); color:#fff; padding:3px 5px; text-align:left; white-space:nowrap; }
  td { border-top:1px solid var(--borde); padding:3px 5px; white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .cambios { margin-top:8px; border:1px solid #FDBA74; background:#FFF7ED; border-radius:6px; padding:6px; }
  .cambios label { display:block; font-size:11px; margin:4px 0; }
  .cambios .av { color:#9A3412; font-size:10px; }
  .btn { background:var(--azul); color:#fff; border:0; border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px; }
  .btn2 { background:#fff; color:var(--azul); border:1px solid var(--azul); border-radius:6px; padding:4px 8px; cursor:pointer; font-size:11px; margin-top:6px; }
  footer { border-top:1px solid var(--borde); padding:8px; background:#fff; }
  textarea { width:100%; min-height:62px; max-height:160px; resize:vertical; border:1px solid var(--borde); border-radius:8px; padding:6px; font:13px Arial, sans-serif; }
  .fila { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .fila .esp { flex:1; color:var(--suave); font-size:10px; }
  #espera { display:none; color:var(--azul); font-size:12px; margin:0 10px 8px; }
  .ej { font-size:11px; color:var(--suave); }
  .ej a { color:var(--azul); cursor:pointer; display:block; margin:3px 0; }
</style>
</head>
<body>
<header><b>💬 Chat con la IA</b>
  <button onclick="nueva()" title="Empezar otra conversación">🆕 Nueva</button>
  <button onclick="deshacer()" title="Deshacer los últimos datos escritos por la IA">↩️ Deshacer</button>
  <button onclick="google.script.run.CHAT_verResultado()" title="Ver las tablas completas">📊</button>
</header>
<div id="chat"></div>
<div id="espera">⏳ La IA está analizando… (1 a 4 minutos)</div>
<footer>
  <div id="chips"></div>
  <textarea id="txt" placeholder="Escriba como a un contador. Puede adjuntar fotos, PDF, Excel o CSV (📎) o pegar una captura (Ctrl+V). Ctrl+Enter envía."></textarea>
  <div class="fila">
    <input type="file" id="arch" multiple accept="image/*,.pdf,.xlsx,.csv,.txt" style="display:none" onchange="agregar(this.files)">
    <button class="btn2" style="margin:0" onclick="document.getElementById('arch').click()">📎 Adjuntar</button>
    <span class="esp" id="info"></span>
    <button class="btn" id="enviar" onclick="enviar()">Enviar ➤</button>
  </div>
</footer>
<script>
var estado = { historial: [], adjuntos: [] };   // historial: [{p, r}] · adjuntos ya subidos: [{id, nombre, mime}]
var pendientes = [];                             // archivos por subir con el próximo mensaje
try { var g = JSON.parse(localStorage.getItem('chatIA') || 'null'); if (g && g.historial) estado = g; } catch (e) {}
function guardar() { try { localStorage.setItem('chatIA', JSON.stringify({ historial: estado.historial.slice(-20), adjuntos: estado.adjuntos })); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function formato(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
function abajo() { var c = document.getElementById('chat'); c.scrollTop = c.scrollHeight; }
function burbuja(html, clase) { var d = document.createElement('div'); d.className = 'msg ' + clase; d.innerHTML = html; document.getElementById('chat').appendChild(d); abajo(); return d; }

function bienvenida() {
  var d = burbuja('<b>¿En qué le ayudo?</b> Pregunte libre o adjunte un voucher, factura, PDF o Excel. Ejemplos:' +
    '<div class="ej"><a>¿Este voucher ya está registrado? ¿A qué factura corresponde?</a>' +
    '<a>Revisa todas las compras de GRANIX a ALIF: facturas, N/C, retenciones y vouchers</a>' +
    '<a>Verifica este Excel de pagos: cuáles están en vouchers, cuáles ya se usaron y cuáles faltan</a>' +
    '<a>¿Qué vouchers de setiembre no están usados en ninguna factura?</a></div>', 'ia');
  Array.prototype.forEach.call(d.querySelectorAll('.ej a'), function (a) { a.onclick = function () { document.getElementById('txt').value = a.textContent; }; });
}
function pintarHistorial() {
  document.getElementById('chat').innerHTML = '';
  bienvenida();
  estado.historial.forEach(function (h) { burbuja(formato(h.p), 'yo'); burbuja(formato(h.r), 'ia'); });
  info();
}
function info() {
  document.getElementById('info').textContent = estado.adjuntos.length ? estado.adjuntos.length + ' archivo(s) en la conversación' : '';
  document.getElementById('chips').innerHTML = pendientes.map(function (a, i) {
    return '<span class="chip">📎 ' + esc(a.nombre) + ' (' + Math.round(a.base64.length * 0.75 / 1024) + ' KB)<i onclick="quitar(' + i + ')">✕</i></span>';
  }).join('');
}
function quitar(i) { pendientes.splice(i, 1); info(); }

/* ---------- adjuntar: fotos se achican (máx. 2000 px) para que suban rápido ---------- */
function agregar(files) {
  Array.prototype.forEach.call(files, function (f) {
    var r = new FileReader();
    r.onload = function () {
      var b64 = String(r.result).split(',')[1];
      if (/^image\/(jpeg|png|webp)$/.test(f.type) && f.size > 600 * 1024) achicar(r.result, function (nuevo) { pendientes.push({ nombre: f.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', base64: nuevo }); info(); });
      else { pendientes.push({ nombre: f.name, mime: f.type || 'application/octet-stream', base64: b64 }); info(); }
    };
    r.readAsDataURL(f);
  });
  document.getElementById('arch').value = '';
}
function achicar(dataUrl, fin) {
  var img = new Image();
  img.onload = function () {
    var k = Math.min(1, 2000 / Math.max(img.width, img.height));
    var cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    fin(cv.toDataURL('image/jpeg', 0.88).split(',')[1]);
  };
  img.src = dataUrl;
}
document.getElementById('txt').addEventListener('paste', function (e) {
  var items = (e.clipboardData || {}).items || [];
  var fs = [];
  for (var i = 0; i < items.length; i++) if (items[i].kind === 'file') { var f = items[i].getAsFile(); if (f) fs.push(new File([f], 'captura ' + (pendientes.length + fs.length + 1) + '.png', { type: f.type })); }
  if (fs.length) { e.preventDefault(); agregar(fs); }
});
document.getElementById('txt').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) enviar(); });

/* ---------- enviar ---------- */
function ocupado(si) { document.getElementById('espera').style.display = si ? 'block' : 'none'; document.getElementById('enviar').disabled = si; }
function enviar() {
  var t = document.getElementById('txt').value.trim();
  if (!t && !pendientes.length) return;
  var peso = pendientes.reduce(function (s, a) { return s + a.base64.length; }, 0) * 0.75;
  if (peso > 30 * 1024 * 1024) { burbuja('Los archivos pesan más de 30 MB: adjunte menos a la vez.', 'err'); return; }
  burbuja(formato(t || '(analizar los archivos)') + pendientes.map(function (a) { return ' <span class="chip">📎 ' + esc(a.nombre) + '</span>'; }).join(''), 'yo');
  var msg = { texto: t, nuevos: pendientes, anteriores: estado.adjuntos, historial: estado.historial.slice(-4) };
  document.getElementById('txt').value = ''; pendientes = []; info(); ocupado(true);
  google.script.run.withSuccessHandler(function (r) {
    ocupado(false);
    if (r.adjuntos) estado.adjuntos = r.adjuntos;
    if (r.error) { burbuja(formato(r.error), 'err'); guardar(); info(); return; }
    mostrar(r);
    estado.historial.push({ p: t || '(archivos adjuntos)', r: r.respuesta });
    guardar(); info();
  }).withFailureHandler(function (e) {
    ocupado(false);
    var m = String(e && e.message || e);
    if (/PERMISSION|autoriz|authoriz|ScriptError/i.test(m)) {
      m = 'Google bloqueó la conexión (pasa cuando el navegador tiene varias cuentas de Google abiertas). Abra la hoja en una ventana de incógnito o en un perfil con una sola cuenta. ' +
        'O copie el archivo a la carpeta temporal de importaciones en Drive y escriba en 💬 Preguntar a la IA: "abre el archivo NOMBRE y…".\n\n(' + m + ')';
    }
    burbuja(formato(m), 'err');
  }).CHAT_enviar(msg);
}

function mostrar(r) {
  var html = formato(r.respuesta);
  (r.tablas || []).forEach(function (t) {
    html += '<div class="tabla"><div class="t">📊 ' + esc(t.titulo) + ' (' + t.total + ')</div><table><tr>' + t.columnas.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>' +
      t.filas.map(function (f) { return '<tr>' + f.map(function (v) { return '<td title="' + esc(v) + '">' + esc(v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>' +
      (t.total > t.filas.length ? '<div class="det">… ' + (t.total - t.filas.length) + ' filas más en la pestaña 💬 Resultado IA</div>' : '');
  });
  var d = burbuja(html + '<div class="det">' + esc(r.detalle || '') + '</div>', 'ia');
  if (r.tablas && r.tablas.length) { var b = document.createElement('button'); b.className = 'btn2'; b.textContent = '📊 Ver tablas completas'; b.onclick = function () { google.script.run.CHAT_verResultado(); }; d.appendChild(b); }
  if (r.cambios && r.cambios.length) {
    var c = document.createElement('div'); c.className = 'cambios';
    c.innerHTML = '<b>✏️ La IA propone completar la hoja de vouchers:</b>' + r.cambios.map(function (x) {
      return '<label><input type="checkbox" value="' + esc(x.id) + '" ' + (/vacía/.test(x.aviso) ? 'checked' : '') + '> <b>' + esc(x.fila) + '</b> · ' + esc(x.columna) + ' = <b>' + esc(x.nuevo) + '</b>' +
        (x.url ? ' <a href="' + esc(x.url) + '" target="_blank" title="Abrir la hoja de vouchers en esa celda">🔗</a>' : '') +
        (x.motivo ? '<br><span class="det">' + esc(x.motivo) + '</span>' : '') + '<br><span class="av">' + esc(x.aviso) + '</span></label>';
    }).join('') + '<label><input type="checkbox" class="reemp"> Reemplazar si la celda ya tiene un dato</label>';
    var ap = document.createElement('button'); ap.className = 'btn'; ap.textContent = '✅ Escribir los marcados';
    ap.onclick = function () {
      var ids = Array.prototype.map.call(c.querySelectorAll('input[type=checkbox]:checked:not(.reemp)'), function (i) { return i.value; });
      if (!ids.length) return;
      ap.disabled = true; ap.textContent = '⏳ Escribiendo…';
      google.script.run.withSuccessHandler(function (x) {
          ap.textContent = '✔ Listo';
          var links = (x.enlaces || []).map(function (e) {
            return '<a class="btn2" style="display:inline-block;text-decoration:none" href="' + esc(e.url) + '" target="_blank">🔗 Ver ' + esc(e.fila) + ' (' + esc(e.rango) + ')</a>';
          }).join(' ');
          burbuja(formato(x.error || x.mensaje) + (links ? '<div style="margin-top:6px">' + links + '</div>' : ''), x.error ? 'err' : 'ia');
        })
        .withFailureHandler(function (e) { ap.disabled = false; ap.textContent = '✅ Escribir los marcados'; burbuja(formato(String(e.message || e)), 'err'); })
        .CHAT_aplicar(ids, c.querySelector('.reemp').checked);
    };
    c.appendChild(ap); d.appendChild(c);
  }
  abajo();
}
function nueva() { estado = { historial: [], adjuntos: [] }; pendientes = []; guardar(); pintarHistorial(); }
function deshacer() {
  if (!confirm('¿Deshacer los últimos datos que la IA escribió en la hoja de vouchers?')) return;
  google.script.run.withSuccessHandler(function (x) { burbuja(formato(x.error || x.mensaje), x.error ? 'err' : 'ia'); }).CHAT_deshacer();
}
pintarHistorial();
</script>
</body>
</html>
