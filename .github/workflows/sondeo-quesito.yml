# Sondeo temporal (solo páginas públicas de quesito.pe, sin claves ni datos del grupo): ¿tiene API para guías/facturas?
name: Sondeo Quesito
on:
  push:
    branches: [claude/tender-wozniak-vnf3iq]
    paths: ['.github/workflows/sondeo-quesito.yml']
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Centro de ayuda y tienda
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          txt() { sed 's/<[^>]*>/ /g' | tr -s ' \n\t' ' '; }
          for u in https://ayuda.quesito.pe https://www.quesito.pe/precios https://www.quesito.pe/tienda https://www.quesito.pe/version-nube \
                   "https://ayuda.quesito.pe/search?q=api" "https://ayuda.quesito.pe/search?q=token" "https://ayuda.quesito.pe/search?q=integraci%C3%B3n" \
                   "https://ayuda.quesito.pe/search?q=gu%C3%ADa+de+remisi%C3%B3n" "https://ayuda.quesito.pe/search?q=importar+excel" \
                   https://blog.quesito.pe/facturacion-electronica/guia-de-remision-electronica-remitente-que-es-y-cuando-debes-emitirla; do
            echo "=================== $u"
            curl -sSL -m 30 -A "$UA" "$u" -o /tmp/p.html -w "HTTP %{http_code} %{size_download}B %{url_effective}\n"
            grep -oiE 'href="[^"#]*(api|token|integra|guia|remision|import|excel|masiv)[^"]*"' /tmp/p.html | sort -u | head -25
            txt < /tmp/p.html | grep -oiE '.{0,140}(api|token|integraci|importar|excel|masiv|plan |S/ ?[0-9]+|gu[ií]a de remisi).{0,180}' | head -12
          done
