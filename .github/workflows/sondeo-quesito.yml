# Sondeo temporal (solo páginas públicas de quesito.pe, sin claves ni datos del grupo): ¿tiene API para guías/facturas?
name: Sondeo Quesito
on:
  push:
    branches: [claude/tender-wozniak-vnf3iq]
    paths: ['.github/workflows/sondeo-quesito.yml']
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Páginas públicas
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          B=https://www.quesito.pe
          curl -sSL -m 30 -A "$UA" "$B/" -o /tmp/home.html -w "home HTTP %{http_code} %{size_download}B\n"
          echo "=== enlaces"
          grep -oiE 'href="[^"#]+"' /tmp/home.html | sort -u | head -80
          echo "=== menciones"
          sed 's/<[^>]*>/ /g' /tmp/home.html | tr -s ' \n\t' ' ' | grep -oiE '.{0,120}(api|integraci|desarrollador|token|webhook|gu[ií]a de remisi|plan|precio|S/ ?[0-9]).{0,160}' | head -30
          for r in robots.txt sitemap.xml api api/docs docs desarrolladores developers integraciones api/v1 swagger ayuda; do
            c=$(curl -s -o /tmp/x -w '%{http_code}' -m 20 -A "$UA" "$B/$r"); echo "$r → $c $(head -c 300 /tmp/x | tr -s '\n\t ' ' ' | sed 's/<[^>]*>//g' | head -c 200)"
          done
          echo "=== sitemap"; curl -s -m 20 -A "$UA" "$B/sitemap.xml" | grep -oE '<loc>[^<]+' | head -60
          echo "=== scripts de la app (busca rutas de API)"
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/home.html | cut -d'"' -f2 | head -8); do
            u=$js; case $u in http*) ;; /*) u=$B$u;; *) u=$B/$u;; esac
            curl -s -m 20 -A "$UA" "$u" | grep -oE '"/(api|ws|rest)[^"]{0,60}"|https://[a-z0-9.-]*quesito[a-z0-9./-]*' | sort -u | head -15
          done
