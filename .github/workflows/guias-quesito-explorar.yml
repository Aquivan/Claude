# Proyecto "Guías de Remisión · Grupo" (carpeta guias/). Entra a Quesito.pe con
# la cuenta de UNA empresa, abre "Generar GUIA DE REMISIÓN REMITENTE" desde una
# factura y anota todos los campos del formulario. SOLO MIRA: no presiona
# "Crear Guía", bloquea todo envío de datos desde el formulario y rechaza las
# ventanas de confirmación. Fotos con campos y tablas tapados en "Artifacts"
# (se borran solas a los 3 días). Nunca imprime claves.
#
# Secretos en el Environment de la empresa (Settings → Environments → <RUC>):
#   QUESITO_CORREO  y  QUESITO_CLAVE, o mejor QUESITO_SESION (la sesión copiada del Chrome: sin captcha)

name: Guías - explorar Quesito (solo mirar)

on:
  workflow_dispatch:
    inputs:
      ruc:
        description: "RUC de la empresa (su Environment con QUESITO_CORREO y QUESITO_CLAVE)"
        required: true
        default: "20447623669"
      serie:
        description: "Serie de la factura"
        required: true
        default: "FQQ1"
      numero:
        description: "Número de la factura"
        required: true
        default: "3648"
      ingreso:
        description: "Cómo entrar: sesion (la copiada del Chrome) o clave (correo + contraseña: prueba si pide captcha)"
        required: false
        default: sesion
        type: choice
        options: [sesion, clave]

run-name: "Explorar Quesito · ${{ inputs.ruc }} · ${{ inputs.serie }}-${{ inputs.numero }}"

permissions:
  contents: write   # solo para dejar las fotos del captcha en la rama quesito-captcha

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.ruc }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            guias/scripts
            cobranzas/.clasp.json
          sparse-checkout-cone-mode: false

      # 🧩 Si Quesito pide captcha, el robot se lo manda a la persona por el bot de Telegram/WhatsApp
      # (proyecto Cobranzas). Su dirección se lee con clasp y no se imprime.
      - name: Dirección del bot (para el captcha)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          [ -n "$CLASPRC_JSON" ] || { echo "Sin CLASPRC_JSON: el captcha no se podrá pedir."; exit 0; }
          npm install -g @google/clasp@3.3.0 >/dev/null 2>&1
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"; chmod 600 "$HOME/.clasprc.json"
          cd cobranzas
          ID=$(clasp --json list-deployments 2>/dev/null | python3 -c "
          import json,sys
          t=sys.stdin.read()
          try: d=json.loads(t[t.index('['):])
          except Exception: d=[]
          b=[x for x in d if (x.get('description') or '').startswith('Asistente Telegram')]
          print(b[0]['deploymentId'] if b else '')")
          rm -f "$HOME/.clasprc.json"
          if [ -n "$ID" ]; then
            echo "::add-mask::$ID"
            echo "BOT_URL=https://script.google.com/macros/s/$ID/exec" >> "$GITHUB_ENV"
            echo "Bot encontrado."
          else
            echo "No encontré la aplicación web del bot: el captcha no se podrá pedir."
          fi

      - name: Rama temporal para las fotos del captcha
        run: |
          if ! git ls-remote --exit-code --heads origin quesito-captcha >/dev/null 2>&1; then
            mkdir -p /tmp/cap && cd /tmp/cap && git init -q -b quesito-captcha
            echo "Fotos temporales del captcha de Quesito (las pide el robot de guías)." > README.md
            git add README.md && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Rama del captcha"
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" quesito-captcha
          fi

      # Se usa el Chrome que ya trae GitHub (instalar el de Playwright a veces se queda colgado).
      - uses: actions/setup-python@v5   # Python fijo: el servidor ya trae 3.14 y playwright 1.47 no instala ahí
        with:
          python-version: "3.12"
      - name: Preparar navegador
        timeout-minutes: 5
        run: |
          pip install playwright==1.47.0
          CH=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -n "$CH" ]; then echo "CHROMIUM=$CH" >> "$GITHUB_ENV"; echo "Chrome: $($CH --version)"
          else timeout 240 python -m playwright install --with-deps chromium; fi

      - name: Recorrer Quesito (solo mirar)
        env:
          QUESITO_CORREO: ${{ secrets.QUESITO_CORREO }}
          QUESITO_CLAVE: ${{ secrets.QUESITO_CLAVE }}
          QUESITO_SESION: ${{ inputs.ingreso != 'clave' && secrets.QUESITO_SESION || '' }}   # 🍪 sesión copiada del Chrome (sin captcha); con ingreso=clave se prueba correo + contraseña
          SERIE: ${{ inputs.serie }}
          NUMERO: ${{ inputs.numero }}
          GITHUB_TOKEN: ${{ github.token }}
          EMPRESA: ${{ inputs.ruc == '20447623669' && 'M&D' || inputs.ruc == '20447968216' && 'DSM' || inputs.ruc }}
        run: python guias/scripts/quesito_explorar.py --serie "$SERIE" --numero "$NUMERO" --salida pantallas

      - name: Subir fotos y estructura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quesito-${{ inputs.ruc }}-${{ inputs.serie }}-${{ inputs.numero }}
          path: pantallas/
          retention-days: 3
