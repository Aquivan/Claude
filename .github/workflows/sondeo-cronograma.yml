# Sondeo temporal (páginas públicas, sin claves): cronogramas SUNAT 2026 — IGV/PDT 621 y registros electrónicos (SIRE).
name: Sondeo cronograma SUNAT
on:
  workflow_dispatch:
  push:
    branches: [claude/tender-wozniak-vnf3iq]
    paths: ['.github/workflows/sondeo-cronograma.yml']
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anexo II y páginas de cronogramas
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          txt() { iconv -f ISO-8859-1 -t UTF-8 | sed 's/<[^>]*>/ /g' | tr -s ' \t\r\n' ' '; }
          echo "=== resto de la R.S. 281-2022"
          curl -sSL -m 60 -A "$UA" -o /tmp/r.pdf https://www.sunat.gob.pe/legislacion/superin/2022/281-2022.pdf
          pdftotext -layout /tmp/r.pdf /tmp/r.txt; sed -n '150,400p' /tmp/r.txt
          echo "=== enlaces de la página de cronograma 2026"
          P=https://www.sunat.gob.pe/orientacion/cronogramas/2026/cObligacionMensual2026.html
          curl -sSL -m 30 -A "$UA" "$P" > /tmp/p.html
          grep -oiE '(href|src)="[^"]+"' /tmp/p.html | sort -u | head -80
          grep -oiE 'function indCronoPer[^}]*\}' /tmp/p.html | head -3
          echo "=== índice de cronogramas"
          curl -sSL -m 30 -A "$UA" https://www.sunat.gob.pe/orientacion/cronogramas/index.html | grep -oiE 'href="[^"]+"[^<]{0,120}' | grep -iE '2026|libro|registro|sire|atraso' | head -40
          for n in cLibrosElectronicos2026 cRegistrosElectronicos2026 cSire2026 cAtrasoRegistros2026 cLibros2026 cPLE2026; do
            c=$(curl -s -o /tmp/x.html -w '%{http_code}' -m 20 -A "$UA" https://www.sunat.gob.pe/orientacion/cronogramas/2026/$n.html)
            echo "$n → $c"; [ "$c" = 200 ] && txt < /tmp/x.html | grep -oiE '(Setiembre|Septiembre|Octubre|Agosto).{0,400}' | head -4
          done
          echo "=== tabla del periodo 202609 en la página mensual (texto)"
          txt < /tmp/p.html | grep -oiE '(Setiembre|Septiembre) 2026.{0,600}' | head -3
