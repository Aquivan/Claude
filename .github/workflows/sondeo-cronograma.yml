# Sondeo temporal (páginas públicas, sin claves): cronogramas SUNAT 2026 — IGV/PDT 621 y registros electrónicos (SIRE).
name: Sondeo cronograma SUNAT
on:
  workflow_dispatch:
  push:
    branches: [claude/tender-wozniak-vnf3iq]
    paths: ['.github/workflows/sondeo-cronograma.yml']
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anexos I y II de la R.S. 281-2022
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          for n in anexo1-281-2022 anexo2-281-2022 anexoII-281-2022 anexo-ii-281-2022 anexo3-281-2022; do
            u=https://www.sunat.gob.pe/legislacion/superin/2022/$n.pdf
            echo "=================== $n"
            c=$(curl -sSL -m 60 -A "$UA" -o /tmp/r.pdf -w '%{http_code}' "$u"); echo "HTTP $c"
            [ "$c" = 200 ] && pdftotext -layout /tmp/r.pdf - | head -150
          done
          echo "=== tabla de la página 2026 (texto, sin menú)"
          curl -sSL -m 30 -A "$UA" https://www.sunat.gob.pe/orientacion/cronogramas/2026/cObligacionMensual2026.html | iconv -f ISO-8859-1 -t UTF-8 \
            | sed 's/<\/tr>/\n/gI; s/<[^>]*>/ /g' | tr -s ' \t' ' ' | grep -iE 'enero|febrero|setiembre|octubre|noviembre|periodo|registro|vencimiento' | head -40
