# Sondeo temporal (páginas públicas, sin claves): cronogramas SUNAT 2026 — IGV/PDT 621 y registros electrónicos (SIRE).
name: Sondeo cronograma SUNAT
on:
  workflow_dispatch:
  push:
    branches: [claude/tender-wozniak-vnf3iq]
    paths: ['.github/workflows/sondeo-cronograma.yml']
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer cronogramas
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          B=https://www.sunat.gob.pe/orientacion/cronogramas
          for u in $B/2026/ $B/2026/index.html $B/index.html $B/2026/cObligacionMensual2026.html $B/2026/cLibrosRegistrosElectronicos2026.html $B/2026/cRegistrosElectronicos2026.html $B/2026/cPle2026.html $B/2026/cSire2026.html; do
            echo "=================== $u"
            curl -sSL -m 30 -A "$UA" -o /tmp/p -w "HTTP %{http_code} · %{size_download} bytes\n" "$u" || true
            iconv -f ISO-8859-1 -t UTF-8 /tmp/p 2>/dev/null | grep -oiE 'href="[^"]*"' | grep -iE 'cronog|2026|ple|sire|regist|libro' | sort -u | head -40
            iconv -f ISO-8859-1 -t UTF-8 /tmp/p 2>/dev/null | sed 's/<[^>]*>/ /g' | tr -s ' \t\r\n' ' ' | grep -oiE '.{0,300}(registro|sire|rvie|rce|libros|atraso).{0,500}' | head -6
          done
