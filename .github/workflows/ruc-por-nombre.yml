# 🔎 RUC por nombre (proyecto Cobranzas, cobranzas/RucPorNombre.js).
# Busca en el Padrón Reducido del RUC de SUNAT (descarga pública) los nombres de vouchers que no
# traen RUC. Lo lanza el bot de Cobranzas con un "lote": los nombres NO van en las entradas ni en el
# registro (pueden ser de personas); el robot se los pide al bot y le devuelve los candidatos.
# El padrón (~390 MB) se guarda en la caché de Actions una semana; no se sube al repositorio.

name: RUC por nombre (padrón SUNAT)

on:
  workflow_dispatch:
    inputs:
      lote:
        description: "Lote que dejó el bot de Cobranzas (o \"prueba\" para revisar el padrón con empresas conocidas, o \"actualizar\" para bajar el padrón nuevo)"
        required: true
  # El padrón nuevo se baja solo cada lunes de madrugada (Lima): así una búsqueda nunca espera la descarga (~10 min).
  schedule:
    - cron: '17 8 * * 1'

run-name: "RUC por nombre · lote ${{ inputs.lote || 'actualizar' }}"

permissions:
  contents: read

concurrency:
  group: ruc-por-nombre
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ruc_por_nombre.py
            cobranzas/.clasp.json
          sparse-checkout-cone-mode: false

      - name: Dirección del bot
        if: inputs.lote != 'prueba' && inputs.lote != 'actualizar' && github.event_name != 'schedule'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          [ -n "$CLASPRC_JSON" ] || { echo "::error::Falta el secret CLASPRC_JSON"; exit 1; }
          npm install -g @google/clasp@3.3.0 >/dev/null 2>&1
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"; chmod 600 "$HOME/.clasprc.json"
          cd cobranzas
          ID=$(clasp --json list-deployments 2>/dev/null | python3 -c "
          import json,sys
          t=sys.stdin.read()
          try: d=json.loads(t[t.index('['):])
          except Exception: d=[]
          b=[x for x in d if (x.get('description') or '').startswith('Asistente Telegram')]
          print(b[0]['deploymentId'] if b else '')")
          rm -f "$HOME/.clasprc.json"
          [ -n "$ID" ] || { echo "::error::No encontré la aplicación web del bot"; exit 1; }
          echo "::add-mask::$ID"
          echo "BOT_URL=https://script.google.com/macros/s/$ID/exec" >> "$GITHUB_ENV"

      - name: Semana (para la caché del padrón)
        id: semana
        run: echo "s=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # Búsqueda: usa el ÚLTIMO padrón guardado (aunque sea de la semana pasada) → empieza al instante.
      # Solo si no hay ninguno guardado se descarga aquí. Actualizar (lunes o a mano): siempre baja el nuevo.
      - name: Padrón en caché
        id: cache
        if: inputs.lote != 'actualizar' && github.event_name != 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: padron_reducido_ruc.zip
          key: padron-ruc-${{ steps.semana.outputs.s }}
          restore-keys: padron-ruc-

      - name: Avisar que se descarga el padrón
        if: steps.cache.outputs.cache-matched-key == '' && env.BOT_URL != ''
        continue-on-error: true
        env:
          LOTE: ${{ inputs.lote }}
        run: |
          curl -sSL --max-time 60 -H 'Content-Type: application/json' "$BOT_URL?canal=gh" \
            -d "{\"accion\":\"rpn_estado\",\"lote\":\"$LOTE\",\"run\":\"$GITHUB_RUN_ID\",\"estado\":\"📥 Descargando el padrón de SUNAT (395 MB, la página de SUNAT es lenta: 8–15 min). Después busco ahí.\"}" >/dev/null || true

      - name: Descargar el padrón de SUNAT
        id: bajar
        if: steps.cache.outputs.cache-matched-key == ''
        # Se espera la descarga (sin padrón la búsqueda queda incompleta). Si aun así no baja, el bot busca con IA en internet.
        timeout-minutes: 25
        run: |
          for url in https://www.sunat.gob.pe/descargaPRR/padron_reducido_ruc.zip https://www2.sunat.gob.pe/padron_reducido_ruc.zip; do
            for i in 1 2 3; do
              if curl -fsSL --retry 2 --max-time 900 -A "Mozilla/5.0" -o padron_reducido_ruc.zip "$url" && unzip -tq padron_reducido_ruc.zip >/dev/null; then
                echo "Padrón descargado: $(du -h padron_reducido_ruc.zip | cut -f1)"; exit 0
              fi
              echo "Intento $i con $url falló"; rm -f padron_reducido_ruc.zip; sleep $((i*20))
            done
          done
          echo "::error::No se pudo descargar el padrón de SUNAT"; exit 1

      - name: Guardar el padrón descargado
        if: steps.bajar.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: padron_reducido_ruc.zip
          key: padron-ruc-${{ steps.semana.outputs.s }}-${{ github.run_id }}

      - name: Buscar los nombres
        if: always() && inputs.lote != 'actualizar' && github.event_name != 'schedule'
        env:
          LOTE: ${{ inputs.lote }}
        run: |
          curl -sSL --max-time 60 -H 'Content-Type: application/json' "$BOT_URL?canal=gh" \
            -d "{\"accion\":\"rpn_estado\",\"lote\":\"$LOTE\",\"run\":\"$GITHUB_RUN_ID\",\"estado\":\"🏛 Buscando en el padrón de SUNAT (18 millones de RUC, 1–2 min)…\"}" >/dev/null || true
          python3 scripts/ruc_por_nombre.py --padron padron_reducido_ruc.zip --lote "$LOTE"
