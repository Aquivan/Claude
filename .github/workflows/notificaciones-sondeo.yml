# SONDEO (solo lectura) del proyecto "Notificaciones · Grupo" (carpeta notificaciones/).
# Muestra cómo SOL carga el Buzón Electrónico. No abre mensajes ni descarga adjuntos.
# Nunca imprime claves.
name: Notificaciones - sondeo SUNAT (solo lectura)

on:
  workflow_dispatch:
    inputs:
      ruc:
        description: "RUC de la empresa (su Environment con claves SOL)"
        required: true
        default: "20447969531"

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.ruc }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            notificaciones/scripts
            retenciones/scripts
      - name: Instalar navegador
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Sondeo con navegador (no abre mensajes)
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
        run: python notificaciones/scripts/ver_buzon.py pantallas
      - name: Subir fotos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buzon-${{ inputs.ruc }}
          path: pantallas/
          retention-days: 3
