# Sondeo temporal: columnas del Excel de Sujetos Sin Capacidad Operativa (SUNAT).
name: Sondeo SSCO
on:
  workflow_dispatch:
  push:
    branches: [claude/tender-wozniak-vnf3iq]
    paths: ['.github/workflows/sondeo-ssco.yml']
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer el Excel
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          curl -sSL -m 60 -A "$UA" -o /tmp/s.xlsx -w "HTTP %{http_code} · %{content_type} · %{size_download} bytes\n" https://www.sunat.gob.pe/padronesnotificaciones/ssco/sujesincapacidadOperativa.xlsx
          curl -sSL -m 30 -A "$UA" https://www.sunat.gob.pe/padronesnotificaciones/sujeSinCapacidadOperativa.html | grep -oE "(row|r)\[[0-9]+\]|columns.{0,600}|title: *'[^']*'|<th[^>]*>[^<]*" | head -40
          pip -q install openpyxl
          python3 - <<'PY'
          import openpyxl
          wb = openpyxl.load_workbook('/tmp/s.xlsx', read_only=True)
          for ws in wb.worksheets:
              filas = list(ws.iter_rows(values_only=True))
              print('== hoja', ws.title, '· filas', len(filas))
              for f in filas[:6]: print(repr(f))
              print('...'); print(repr(filas[-1]))
          PY
