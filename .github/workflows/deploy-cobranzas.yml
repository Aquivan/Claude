# Despliegue del sistema "Cuentas por Cobrar y Pagar · Grupo" (carpeta cobranzas/)
# ------------------------------------------------------------
# Mismo mecanismo que deploy-appsscript.yml (usa el secret CLASPRC_JSON).
#   - crear-proyecto : crea el proyecto Apps Script ligado a la Sheet (una sola vez)
#                      y muestra en el log el .clasp.json para guardarlo en el repo.
#   - comparar       : muestra diferencias entre el codigo de la Sheet y el repo.
#   - subir          : sube cobranzas/ a la Sheet.
#   - publicar-bot   : sube y vuelve a publicar la aplicación web del 🤖 asistente de Telegram.
# Al hacer push con cambios en cobranzas/ se sube solo (si ya existe cobranzas/.clasp.json).
# La aplicación web del bot (doPost de cobranzas/telegram/) se republica cuando cambia
# algo del bot o de la IA, o si la publicada tiene 3 días o más (Google permite 200
# versiones por proyecto: así no se gastan en cada push). Su ID queda en
# cobranzas/telegram/TG_Despliegue.js (lo escribe este workflow antes de subir).
# ------------------------------------------------------------

name: Desplegar Cobranzas

on:
  push:
    branches:
      # Solo esta rama: los cambios de trabajo llegan aquí por merge. Publicar también desde
      # la rama de trabajo gastaba 2 versiones de Apps Script por cada cambio (límite: 200).
      - claude/python-codes-izve18
    paths:
      - 'cobranzas/**'
  workflow_dispatch:
    inputs:
      accion:
        description: "crear-proyecto (una vez), comparar o subir"
        required: true
        default: "comparar"
        type: choice
        options:
          - comparar
          - subir
          - publicar-bot
          - crear-proyecto
      sheet_id:
        description: "Solo para crear-proyecto: ID de la Google Sheet"
        required: false
        default: ""

concurrency:
  group: appsscript-cobranzas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cobranzas
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: ¿Cambió algo del bot de Telegram?
        id: cambios
        env:
          ANTES: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "bot=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] || ! git fetch --no-tags --depth=1 origin "$ANTES" 2>/dev/null; then
            echo "bot=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$ANTES" HEAD | grep -qE '^cobranzas/(telegram/|AnalistaIA\.js|AnalistaAdjuntos\.js|ChatIA\.js|IACliente\.js|appsscript\.json)'; then
            echo "bot=si" >> "$GITHUB_OUTPUT"
          else
            echo "bot=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Escribir credenciales de clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta el secret CLASPRC_JSON"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user

      - name: Crear proyecto ligado a la Sheet
        if: github.event_name == 'workflow_dispatch' && inputs.accion == 'crear-proyecto'
        env:
          SHEET_ID: ${{ inputs.sheet_id }}
        run: |
          if [ -f .clasp.json ]; then echo "::error::Ya existe cobranzas/.clasp.json; no se crea otro proyecto."; exit 1; fi
          if [ -z "$SHEET_ID" ]; then echo "::error::Falta sheet_id"; exit 1; fi
          # Se crea fuera del repo: dentro, clasp encuentra el .clasp.json de la raiz y no crea nada.
          mkdir -p /tmp/nuevo && cd /tmp/nuevo
          clasp create-script --type sheets --title "Cobranzas Grupo" --parentId "$SHEET_ID" --rootDir .
          test -f .clasp.json || { echo "::error::clasp no creo el proyecto"; exit 1; }
          SID=$(python3 -c "import json;print(json.load(open('.clasp.json'))['scriptId'])")
          cd "$GITHUB_WORKSPACE/cobranzas"
          printf '{"scriptId":"%s","rootDir":".","parentId":["%s"]}' "$SID" "$SHEET_ID" > .clasp.json
          echo "======== guardar en el repo como cobranzas/.clasp.json ========"
          cat .clasp.json; echo
          clasp push --force
          echo "Codigo subido."

      - name: Comparar codigo de la Sheet vs repo
        if: hashFiles('cobranzas/.clasp.json') != '' && !(github.event_name == 'workflow_dispatch' && inputs.accion == 'crear-proyecto')
        run: |
          SID=$(python3 -c "import json;print(json.load(open('.clasp.json'))['scriptId'])")
          mkdir -p /tmp/actual
          printf '{"scriptId":"%s","rootDir":"/tmp/actual"}' "$SID" > /tmp/actual/.clasp.json
          (cd /tmp/actual && clasp pull) || echo "(proyecto vacio o sin acceso)"
          echo "================ RESUMEN Sheet vs repo ================"
          for f in *.js *.html appsscript.json telegram/*.js; do
            r="/tmp/actual/$f"; [ -f "$r" ] || r="/tmp/actual/${f%.js}.gs"
            if [ -f "$r" ]; then
              if diff -q --strip-trailing-cr "$r" "$f" >/dev/null; then echo "IGUAL      $f"; else echo "DIFERENTE  $f ($(diff --strip-trailing-cr "$r" "$f" | grep -c '^[<>]' || true) lineas)"; fi
            else echo "NUEVO      $f"; fi
          done
          for r in /tmp/actual/*.js /tmp/actual/*.gs /tmp/actual/*.html /tmp/actual/telegram/*.js; do
            [ -f "$r" ] || continue; n="${r#/tmp/actual/}"; b="${n%.*}"
            ls "$b".* >/dev/null 2>&1 || echo "SOLO EN LA SHEET (se borraria al subir): $n"
          done

      - name: ID de la aplicación web del bot
        id: bot
        if: hashFiles('cobranzas/.clasp.json') != '' && (github.event_name == 'push' || inputs.accion == 'subir' || inputs.accion == 'publicar-bot')
        run: |
          clasp --json list-deployments > /tmp/deps.json 2>/dev/null || echo '[]' > /tmp/deps.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime, re
          txt = open('/tmp/deps.json').read()
          try: deps = json.loads(txt[txt.index('['):])
          except Exception: deps = []
          bot = [d for d in deps if (d.get('description') or '').startswith('Asistente Telegram')]
          dep = bot[0] if bot else {}
          print('id=' + (dep.get('deploymentId') or ''))
          m = re.search(r'(\d{4}-\d{2}-\d{2})', dep.get('description') or '')
          dias = (datetime.date.today() - datetime.date.fromisoformat(m.group(1))).days if m else 999
          print('dias=%d' % dias)
          PY
          cat "$GITHUB_OUTPUT"
          ID=$(grep '^id=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          printf "/**\n * 🤖 Telegram — ID de la aplicación web (la dirección que usa Telegram para mandar los mensajes).\n * Este archivo lo REESCRIBE el workflow \"Desplegar Cobranzas\" en cada despliegue; en el repositorio queda vacío.\n */\nvar TG_DEPLOYMENT_ID_ = '%s';\n" "$ID" > telegram/TG_Despliegue.js

      - name: Subir el codigo a Apps Script
        if: hashFiles('cobranzas/.clasp.json') != '' && (github.event_name == 'push' || inputs.accion == 'subir' || inputs.accion == 'publicar-bot')
        run: |
          clasp push --force
          echo "Codigo subido a la Sheet."

      - name: Publicar la aplicación web del bot de Telegram
        if: hashFiles('cobranzas/.clasp.json') != '' && (github.event_name == 'push' || inputs.accion == 'subir' || inputs.accion == 'publicar-bot')
        env:
          ID: ${{ steps.bot.outputs.id }}
          DIAS: ${{ steps.bot.outputs.dias }}
          CAMBIO: ${{ steps.cambios.outputs.bot }}
        run: |
          DESC="Asistente Telegram $(date -u +%Y-%m-%d)"
          if [ -n "$ID" ] && [ "$CAMBIO" != "si" ] && [ "${DIAS:-999}" -lt 3 ] && [ "${{ inputs.accion }}" != "publicar-bot" ]; then
            echo "El bot no cambió y su versión publicada tiene ${DIAS} día(s): no se gasta otra versión."
            exit 0
          fi
          if [ -z "$ID" ]; then
            # Primera vez: se crea la aplicación web, se anota su ID en el código y se vuelve a subir.
            ID=$(clasp --json create-deployment -d "$DESC" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1)
            [ -n "$ID" ] || { echo "::error::No se pudo crear la aplicación web del bot"; exit 1; }
            printf "/**\n * 🤖 Telegram — ID de la aplicación web (la dirección que usa Telegram para mandar los mensajes).\n * Este archivo lo REESCRIBE el workflow \"Desplegar Cobranzas\" en cada despliegue; en el repositorio queda vacío.\n */\nvar TG_DEPLOYMENT_ID_ = '%s';\n" "$ID" > telegram/TG_Despliegue.js
            clasp push --force
          fi
          clasp create-deployment -i "$ID" -d "$DESC"
          echo "Aplicación web del bot: https://script.google.com/macros/s/$ID/exec"
          N=$(clasp --json list-versions 2>/dev/null | grep -c '"versionNumber"' || true)
          echo "Versiones del proyecto: $N de 200"
          if [ "${N:-0}" -ge 180 ]; then echo "::warning::El proyecto de Cobranzas tiene $N versiones (Google permite 200). Borre versiones viejas en Apps Script → Implementar → Gestionar implementaciones."; fi

      - name: Limpiar credenciales
        if: always()
        run: rm -rf "$HOME/.clasprc.json" /tmp/actual
