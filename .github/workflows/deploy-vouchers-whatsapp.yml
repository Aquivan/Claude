# Despliegue de "Vouchers por WhatsApp" (carpeta vouchers_whatsapp/apps_script/)
# ------------------------------------------------------------
# Proyecto APARTE del bot de Telegram (no toca la hoja de Vouchers ni su código).
#   - crear-proyecto : crea la hoja "Vouchers WhatsApp" con su Apps Script (una sola vez),
#                      guarda vouchers_whatsapp/apps_script/.clasp.json en el repo y publica.
#   - subir          : sube el código y vuelve a publicar la aplicación web.
# Al hacer push con cambios en vouchers_whatsapp/apps_script/ se sube y publica solo.
# El ID de la aplicación web y de la hoja quedan en WA_Despliegue.js (lo escribe este
# workflow antes de subir; en el repositorio queda vacío).
# ------------------------------------------------------------

name: Desplegar Vouchers WhatsApp

on:
  push:
    branches:
      - claude/python-codes-izve18
      - claude/tender-wozniak-vnf3iq
    paths:
      - 'vouchers_whatsapp/apps_script/**'
  workflow_dispatch:
    inputs:
      accion:
        description: "crear-proyecto (una vez) o subir"
        required: true
        default: "subir"
        type: choice
        options:
          - subir
          - crear-proyecto

permissions:
  contents: write

concurrency:
  group: appsscript-vouchers-whatsapp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vouchers_whatsapp/apps_script
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Escribir credenciales de clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta el secret CLASPRC_JSON"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user

      - name: Crear la hoja "Vouchers WhatsApp" con su proyecto
        if: github.event_name == 'workflow_dispatch' && inputs.accion == 'crear-proyecto'
        run: |
          if [ -f .clasp.json ]; then echo "::error::Ya existe vouchers_whatsapp/apps_script/.clasp.json; no se crea otro proyecto."; exit 1; fi
          # Se crea fuera del repo: dentro, clasp encuentra el .clasp.json de la raiz y no crea nada.
          mkdir -p /tmp/nuevo && cd /tmp/nuevo
          clasp create-script --type sheets --title "Vouchers WhatsApp" --rootDir .
          test -f .clasp.json || { echo "::error::clasp no creo el proyecto"; exit 1; }
          python3 - <<'PY' > "$GITHUB_WORKSPACE/vouchers_whatsapp/apps_script/.clasp.json"
          import json
          c = json.load(open('.clasp.json'))
          p = c.get('parentId') or []
          if isinstance(p, str): p = [p]
          print(json.dumps({"scriptId": c["scriptId"], "rootDir": ".", "parentId": p}))
          PY
          cd "$GITHUB_WORKSPACE/vouchers_whatsapp/apps_script"
          cat .clasp.json; echo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .clasp.json
          git commit -m "Vouchers WhatsApp: proyecto Apps Script creado [skip ci]"
          for i in 1 2 3 4; do git push && break; git pull --rebase; sleep $((i*3)); done

      - name: ID de la aplicación web
        id: app
        if: hashFiles('vouchers_whatsapp/apps_script/.clasp.json') != '' || inputs.accion == 'crear-proyecto'
        run: |
          clasp --json list-deployments > /tmp/deps.json 2>/dev/null || echo '[]' > /tmp/deps.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          txt = open('/tmp/deps.json').read()
          try: deps = json.loads(txt[txt.index('['):])
          except Exception: deps = []
          app = [d for d in deps if (d.get('description') or '').startswith('Vouchers WhatsApp')]
          print('id=' + ((app[0].get('deploymentId') if app else '') or ''))
          c = json.load(open('.clasp.json'))
          p = c.get('parentId') or ['']
          print('hoja=' + (p[0] if isinstance(p, list) else p))
          PY
          cat "$GITHUB_OUTPUT"

      - name: Subir y publicar
        if: steps.app.outcome == 'success'
        env:
          ID: ${{ steps.app.outputs.id }}
          HOJA: ${{ steps.app.outputs.hoja }}
        run: |
          escribir() {
            printf "/**\n * 📲 WhatsApp — ID de la aplicación web y de la hoja.\n * Este archivo lo REESCRIBE el workflow \"Desplegar Vouchers WhatsApp\" en cada despliegue; en el repositorio queda vacío.\n */\nvar WA_DEPLOYMENT_ID_ = '%s';\nvar WA_HOJA_ID_ = '%s';\n" "$1" "$HOJA" > WA_Despliegue.js
          }
          DESC="Vouchers WhatsApp $(date -u +%Y-%m-%d)"
          escribir "$ID"
          clasp push --force
          if [ -z "$ID" ]; then
            ID=$(clasp --json create-deployment -d "$DESC" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1)
            [ -n "$ID" ] || { echo "::error::No se pudo crear la aplicación web"; exit 1; }
            escribir "$ID"
            clasp push --force
          fi
          clasp create-deployment -i "$ID" -d "$DESC"
          echo "================================================================"
          echo "Hoja:            https://docs.google.com/spreadsheets/d/$HOJA/edit"
          echo "Aplicación web:  https://script.google.com/macros/s/$ID/exec  (va en GAS_URL de Cloudflare)"
          echo "================================================================"

      - name: Limpiar credenciales
        if: always()
        run: rm -rf "$HOME/.clasprc.json" /tmp/nuevo
