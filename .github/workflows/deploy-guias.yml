# Despliegue de "Guías de Remisión · Grupo" (carpeta guias/apps_script/)
# ------------------------------------------------------------
#   - crear-proyecto : crea la hoja "Guías de Remisión · Grupo" con su Apps Script (una sola vez)
#                      y guarda guias/apps_script/.clasp.json en el repo. Al abrir la hoja se arma sola.
#   - comparar       : diferencias entre el código de la hoja y el repo.
#   - subir          : sube guias/apps_script/ a la hoja.
# Al hacer push con cambios en guias/apps_script/ se sube solo (si ya existe su .clasp.json).
# ------------------------------------------------------------

name: Desplegar Guías de Remisión (hoja)

on:
  push:
    branches:
      # Solo esta rama (los cambios llegan aquí por merge): publicar desde dos ramas gastaba 2 versiones por cambio.
      - claude/python-codes-izve18
    paths:
      - 'guias/apps_script/**'
      - '.github/workflows/deploy-guias.yml'
  workflow_dispatch:
    inputs:
      accion:
        description: "crear-proyecto (una vez), comparar o subir"
        required: true
        default: "comparar"
        type: choice
        options:
          - comparar
          - subir
          - crear-proyecto

permissions:
  contents: write

concurrency:
  group: appsscript-guias-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: guias/apps_script
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Escribir credenciales de clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta el secret CLASPRC_JSON"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user

      - name: Crear la hoja con su proyecto
        if: github.event_name == 'workflow_dispatch' && inputs.accion == 'crear-proyecto'
        run: |
          if [ -f .clasp.json ]; then echo "::error::Ya existe guias/apps_script/.clasp.json; no se crea otra hoja."; exit 1; fi
          # Se crea fuera del repo: dentro, clasp encuentra el .clasp.json de la raiz y no crea nada.
          mkdir -p /tmp/nuevo && cd /tmp/nuevo
          clasp create-script --type sheets --title "Guías de Remisión · Grupo" --rootDir .
          test -f .clasp.json || { echo "::error::clasp no creo el proyecto"; exit 1; }
          python3 - <<'PY' > "$GITHUB_WORKSPACE/guias/apps_script/.clasp.json"
          import json
          c = json.load(open('.clasp.json'))
          p = c.get('parentId') or []
          if isinstance(p, str): p = [p]
          print(json.dumps({"scriptId": c["scriptId"], "rootDir": ".", "parentId": p}))
          PY
          cd "$GITHUB_WORKSPACE/guias/apps_script"
          cat .clasp.json; echo
          clasp push --force
          HOJA=$(python3 -c "import json;print((json.load(open('.clasp.json')).get('parentId') or [''])[0])")
          echo "::notice title=Hoja creada::https://docs.google.com/spreadsheets/d/$HOJA/edit"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .clasp.json
          git commit -m "Guías de Remisión: hoja y proyecto Apps Script creados [skip ci]"
          for i in 1 2 3 4; do git push && break; git pull --rebase; sleep $((i*3)); done

      - name: Comparar codigo de la hoja vs repo
        if: hashFiles('guias/apps_script/.clasp.json') != '' && !(github.event_name == 'workflow_dispatch' && inputs.accion == 'crear-proyecto')
        run: |
          SID=$(python3 -c "import json;print(json.load(open('.clasp.json'))['scriptId'])")
          mkdir -p /tmp/actual
          printf '{"scriptId":"%s","rootDir":"/tmp/actual"}' "$SID" > /tmp/actual/.clasp.json
          (cd /tmp/actual && clasp pull) || echo "(proyecto vacio o sin acceso)"
          for f in *.js *.html appsscript.json; do
            r="/tmp/actual/$f"; [ -f "$r" ] || r="/tmp/actual/${f%.js}.gs"
            if [ -f "$r" ]; then
              if diff -q --strip-trailing-cr "$r" "$f" >/dev/null; then echo "IGUAL      $f"; else echo "DIFERENTE  $f"; fi
            else echo "NUEVO      $f"; fi
          done

      # 🚚 La hoja pide 👁/✅ al bot de Cobranzas: su dirección se pone al subir (no queda en el repositorio).
      - name: Dirección del bot de Cobranzas
        if: hashFiles('guias/apps_script/.clasp.json') != '' && (github.event_name == 'push' || inputs.accion == 'subir')
        run: |
          ID=$(cd ../../cobranzas && clasp --json list-deployments 2>/dev/null | python3 -c "
          import json,sys
          t=sys.stdin.read()
          try: d=json.loads(t[t.index('['):])
          except Exception: d=[]
          b=[x for x in d if (x.get('description') or '').startswith('Asistente Telegram')]
          print(b[0]['deploymentId'] if b else '')")
          if [ -z "$ID" ]; then echo "::warning::No encontré la aplicación web del bot: 👁/✅ desde la hoja no funcionarán."; exit 0; fi
          echo "::add-mask::$ID"
          sed -i "s#__COBRANZAS_URL__#https://script.google.com/macros/s/$ID/exec#" GR_Emitir.js
          grep -q "__COBRANZAS_URL__" GR_Emitir.js && { echo "::error::No se puso la dirección"; exit 1; } || echo "Dirección del bot puesta."

      - name: ID del 🌐 portal web
        id: portal
        if: hashFiles('guias/apps_script/.clasp.json') != '' && (github.event_name == 'push' || inputs.accion == 'subir')
        run: |
          ID=$(clasp --json list-deployments 2>/dev/null | python3 -c "
          import json,sys
          t=sys.stdin.read()
          try: d=json.loads(t[t.index('['):])
          except Exception: d=[]
          b=[x for x in d if (x.get('description') or '').startswith('Portal Guias')]
          print(b[0]['deploymentId'] if b else '')")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          printf "/**\n * 🌐 Portal — ID de la aplicación web (la dirección del portal).\n * Este archivo lo REESCRIBE el workflow \"Desplegar Guías de Remisión (hoja)\" en cada despliegue; aquí queda vacío.\n */\nvar PT_URL_ = '%s';\n" "$ID" > GR_PortalDespliegue.js

      - name: Subir el codigo a la hoja
        if: hashFiles('guias/apps_script/.clasp.json') != '' && (github.event_name == 'push' || inputs.accion == 'subir')
        run: |
          clasp push --force
          HOJA=$(python3 -c "import json;print((json.load(open('.clasp.json')).get('parentId') or [''])[0])")
          echo "Código subido: https://docs.google.com/spreadsheets/d/$HOJA/edit"

      - name: Publicar el 🌐 portal web
        if: hashFiles('guias/apps_script/.clasp.json') != '' && (github.event_name == 'push' || inputs.accion == 'subir')
        env:
          ID: ${{ steps.portal.outputs.id }}
        run: |
          DESC="Portal Guias $(date -u +%Y-%m-%d)"
          if [ -z "$ID" ]; then
            # Primera vez: se crea la aplicación web, se anota su ID en el código y se vuelve a subir.
            ID=$(clasp --json create-deployment -d "$DESC" | grep -oE 'AKfy[A-Za-z0-9_-]+' | head -1)
            [ -n "$ID" ] || { echo "::error::No se pudo crear la aplicación web del portal"; exit 1; }
            printf "/**\n * 🌐 Portal — ID de la aplicación web (la dirección del portal).\n * Este archivo lo REESCRIBE el workflow \"Desplegar Guías de Remisión (hoja)\" en cada despliegue; aquí queda vacío.\n */\nvar PT_URL_ = '%s';\n" "$ID" > GR_PortalDespliegue.js
            clasp push --force
          fi
          clasp create-deployment -i "$ID" -d "$DESC"
          echo "Portal publicado (el enlace se ve en la hoja: 🚚 Guías → 🌐 Portal web)."
          N=$(clasp --json list-versions 2>/dev/null | grep -c '"versionNumber"' || true)
          echo "Versiones del proyecto de Guías: $N de 200"
          if [ "${N:-0}" -ge 180 ]; then echo "::warning::El proyecto de Guías tiene $N versiones (Google permite 200). Borre versiones viejas en Apps Script → Historial del proyecto."; fi

      - name: Limpiar credenciales
        if: always()
        run: rm -rf "$HOME/.clasprc.json" /tmp/nuevo /tmp/actual
