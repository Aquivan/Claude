# SONDEO (solo lectura) para el proyecto "Retenciones · Grupo" (carpeta retenciones/).
# Entra a SOL de UNA empresa y solo MUESTRA que opciones de comprobantes de
# retencion ofrece SUNAT (menu, formularios de consulta y parametros de la
# API de consultas). No descarga ni guarda nada. Nunca imprime claves ni tokens.

name: Retenciones - sondeo SUNAT (solo lectura)

on:
  workflow_dispatch:
    inputs:
      ruc:
        description: "RUC de la empresa (su Environment con claves SOL)"
        required: true

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.ruc }}
    steps:
      - name: Sondeo
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
        run: |
          set -e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          CID="4f3b88b3-d9d6-402a-b85d-6a0bc857746a"
          SEC="https://api-seguridad.sunat.gob.pe/v1/clientessol/$CID/oauth2"
          ORIG="https://e-menu.sunat.gob.pe/cl-ti-itmenu/AutenticaMenuInternet.htm"
          MENU="https://e-menu.sunat.gob.pe/cl-ti-itmenu/MenuInternet.htm"
          STATE='rO0ABXNyABFqYXZhLnV0aWwuSGFzaE1hcAUH2sHDFmDRAwACRgAKbG9hZEZhY3RvckkACXRocmVzaG9sZHhwP0AAAAAAAAx3CAAAABAAAAADdAADZXhlcHQABnBhcmFtc3QASyomKiYvY2wtdGktaXRtZW51L01lbnVJbnRlcm5ldC5odG0mYjY0ZDI2YThiNWFmMDkxOTIzYjIzYjY0MDdhMWMxZGI0MWU3MzNhNnQABGV4ZWNweA=='
          JAR=jar.txt
          curl -sS -c "$JAR" -b "$JAR" --max-time 20 -A "$UA" \
            "$SEC/loginMenuSol?lang=es-PE&showDni=true&showLanguages=false&originalUrl=$ORIG&state=$STATE" -o /dev/null
          curl -sS -c "$JAR" -b "$JAR" --max-time 25 -A "$UA" -L \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "tipo=2" --data-urlencode "dni=" \
            --data-urlencode "custom_ruc=$SUNAT_RUC" --data-urlencode "j_username=$SUNAT_USUARIO" \
            --data-urlencode "j_password=$SUNAT_CLAVE" --data-urlencode "captcha=" \
            --data-urlencode "originalUrl=$ORIG" --data-urlencode "state=$STATE" \
            "$SEC/j_security_check" -o login.html
          grep -q "Men" login.html || { echo "!! LOGIN FALLIDO"; exit 1; }
          echo "Login OK."
          set +e
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o prev.html
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" "$MENU" -o menu.html

          echo "================ A) e-factura: rutas de la API en el codigo publico de la pagina ================"
          curl -sS -m 30 -A "$UA" -L https://e-factura.sunat.gob.pe/ -o ef.html
          for js in $(grep -oE '(src|href)="[^"]+\.js"' ef.html | sed -E 's/.*="([^"]+)"/\1/' | head -20); do
            case "$js" in http*) u="$js";; /*) u="https://e-factura.sunat.gob.pe$js";; *) u="https://e-factura.sunat.gob.pe/$js";; esac
            curl -sS -m 30 -A "$UA" "$u" -o "ef_$(basename "$js")"
          done
          python3 - <<'PY'
          import re, glob
          vistos = set()
          for f in glob.glob('ef_*.js') + ['ef.html']:
              t = open(f, encoding='utf-8', errors='ignore').read()
              for pat in [r'.{0,200}consultacpe.{0,300}', r'.{0,120}(fecEmision|fecIni|fechaIni|fecDesde|indTipo|tipoConsulta|codCpe|numRuc)[A-Za-z]*.{0,200}']:
                  for m in re.finditer(pat, t):
                      s = re.sub(r'\s+', ' ', m.group(0))
                      k = s[:120]
                      if k not in vistos:
                          vistos.add(k); print('-', f, '::', s[:520])
          print('(archivos js:', len(glob.glob('ef_*.js')), ', coincidencias:', len(vistos), ')')
          PY

          echo "================ B) Formulario clasico de consulta de CRE (11.9.7.1.1) ================"
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o /dev/null
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" -L "$MENU?action=execute&code=11.9.7.1.1" -o cre.html
          python3 - <<'PY'
          import re, html
          t = open('cre.html', encoding='utf-8', errors='ignore').read()
          print('tamano', len(t))
          for m in re.finditer(r'<(input|select|form)[^>]*>', t, re.I):
              print(' ', re.sub(r'\s+', ' ', m.group(0))[:200])
          for sel in re.finditer(r'<select[^>]*name="?([\w]+)"?[^>]*>(.*?)</select>', t, re.S | re.I):
              ops = re.findall(r'<option[^>]*value="?([^">]*)"?[^>]*>(.*?)</option>', sel.group(2), re.S | re.I)
              print('SELECT', sel.group(1), ':', '; '.join(v + '=' + re.sub(r'\s+', ' ', html.unescape(x)).strip() for v, x in ops))
          for m in re.finditer(r'(url|action|\.do|\.htm|ajax|fetch|\$\.(get|post))[^\n]{0,200}', t):
              print('  JS:', re.sub(r'\s+', ' ', m.group(0))[:220])
          PY

          echo "================ C) Cuenta de control: retenciones que le efectuaron (12.8.2.1.2) ================"
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o /dev/null
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" -L "$MENU?action=execute&code=12.8.2.1.2" -o cta.html
          python3 - <<'PY'
          import re, html
          t = open('cta.html', encoding='utf-8', errors='ignore').read()
          print('tamano', len(t))
          for m in re.finditer(r'<(input|select|form|frame|iframe)[^>]*>', t, re.I):
              print(' ', re.sub(r'\s+', ' ', m.group(0))[:200])
          txt = re.sub(r'<[^>]+>', ' ', t); txt = re.sub(r'\s+', ' ', html.unescape(txt))
          print('TEXTO:', txt[:1200])
          PY

          rm -f "$JAR" *.html resp.json ef_*.js
