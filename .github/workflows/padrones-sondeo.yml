# SONDEO (solo lectura): muestra los enlaces de descarga de los padrones de SUNAT
# (agentes de retencion, buenos contribuyentes, agentes de percepcion). No guarda nada.
name: Padrones SUNAT - sondeo (solo lectura)

on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enlaces y tamanos
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          for p in https://www.sunat.gob.pe/padronesnotificaciones/index.html https://www.sunat.gob.pe/padronesnotificaciones/padrones.html https://www.sunat.gob.pe/descargaPRR/mrc138_padrones.html https://www.sunat.gob.pe/descargaPRR/mrc139_padrones.html https://www.sunat.gob.pe/descargaPRR/mrc137_padrones_contribuyentes.html; do
            echo "=== $p"; curl -sS -L -A "$UA" --max-time 30 "$p" | grep -oiE '(href|src)="[^"]*(zip|txt|padr|descarga|agente|buen|retenc|percep)[^"]*"' | sort -u | head -80 || true
          done
          for f in AgenRet_TXT.zip BueCont_TXT.zip AgenPerc_TXT.zip AgenPerVI_TXT.zip AgenPerComb_TXT.zip; do
            curl -sS -A "$UA" --max-time 30 -o /dev/null -I -w "%{http_code} len=%header{content-length} $f\n" "https://www.sunat.gob.pe/descargaPRR/$f" || true
            curl -sS -A "$UA" --max-time 30 -o /dev/null -I -w "%{http_code} len=%header{content-length} padron/$f\n" "https://www.sunat.gob.pe/padronesnotificaciones/$f" || true
          done
