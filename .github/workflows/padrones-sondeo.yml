# SONDEO (solo lectura): muestra los enlaces de descarga de los padrones de SUNAT
# (agentes de retencion, buenos contribuyentes, agentes de percepcion). No guarda nada.
name: Padrones SUNAT - sondeo (solo lectura)

on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enlaces y tamanos
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          for u in descarga/AgentRet/AgenRet_TXT.zip descarga/BueCont/BueCont_TXT.zip descarga/AgentRet/AgenPerc_TXT.zip descarga/AgentRet/AgenPercVI_TXT.zip; do
            curl -sS -L -A "$UA" --max-time 120 -o f.zip -w "%{http_code} %{content_type} %{size_download} $u\n" "https://www.sunat.gob.pe/$u" || true
            unzip -l f.zip | head -5 || true
            unzip -p f.zip | head -3 | iconv -f latin1 -t utf-8 || true
            echo "lineas: $(unzip -p f.zip | wc -l)"
          done
