# SONDEO (solo lectura): muestra los enlaces de descarga de los padrones de SUNAT
# (agentes de retencion, buenos contribuyentes, agentes de percepcion). No guarda nada.
name: Padrones SUNAT - sondeo (solo lectura)

on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enlaces y tamanos
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl -sS -L -A "$UA" --max-time 30 https://www.sunat.gob.pe/padronesnotificaciones/js/indPadron.js -o ind.js || true
          echo "=== funciones"; grep -n -iE "function |window.open|location|\.zip|\.txt|\.htm" ind.js | grep -v writeln | head -80
          echo "=== textos"; grep -oiE "onclick=..[a-zA-Z0-9]+\(\);..>|eText.{0,6}>[^<]{0,90}" ind.js | head -0
          grep -oiE '(onclick=\\"[a-zA-Z0-9]+\(\);\\")|(<\/span> <\/span>[^<]{0,90})' ind.js | head -60
          echo "=== AgenRet0 scripts"; curl -sS -L -A "$UA" --max-time 30 https://www.sunat.gob.pe/descarga/AgentRet/AgenRet0.html | grep -iE "zip|txt|function|href=\"[^j]" | head -30
