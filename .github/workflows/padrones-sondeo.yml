# SONDEO (solo lectura): muestra los enlaces de descarga de los padrones de SUNAT
# (agentes de retencion, buenos contribuyentes, agentes de percepcion). No guarda nada.
name: Padrones SUNAT - sondeo (solo lectura)

on:
  workflow_dispatch:

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enlaces y tamanos
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          for u in descarga/AgentRet/AgenRet0.html descarga/BueCont/BueCont0.html descarga/AgentRet/AgenPerc0.html descarga/AgentRet/AgenPercVI0.html; do
            echo "=== $u"; curl -sS -L -A "$UA" --max-time 60 "https://www.sunat.gob.pe/$u" | tr -d '\000' | grep -aoiE '(href|src|action)=["'"'"'][^"'"'"']+["'"'"']|[A-Za-z0-9_/.-]+\.(zip|txt)' | grep -viE "opcSeleccion|\.css|\.gif|\.jpg|\.png" | sort -u | head -30
          done
