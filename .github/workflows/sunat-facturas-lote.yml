name: Descargar facturas SUNAT (lote desde CSV)

on:
  workflow_dispatch: {}
  push:
    branches: [claude/python-codes-izve18]
    paths:
      - "facturas.csv"

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npx --yes playwright install --with-deps chromium

      - name: Crear script de decodificacion (PDF/XML de la API moderna)
        run: |
          cat > /tmp/decode_api.py << 'PYEOF'
          import sys, json, base64, zipfile, io
          d = json.load(open(sys.argv[1]))
          raw = base64.b64decode(d['valArchivo'])
          zf = zipfile.ZipFile(io.BytesIO(raw))
          names = zf.namelist()
          if names:
              open(sys.argv[2], 'wb').write(zf.read(names[0]))
              print('ok')
          PYEOF

      - name: Login + procesar lista de facturas
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          CID="4f3b88b3-d9d6-402a-b85d-6a0bc857746a"
          SEC="https://api-seguridad.sunat.gob.pe/v1/clientessol/$CID/oauth2"
          ORIG="https://e-menu.sunat.gob.pe/cl-ti-itmenu/AutenticaMenuInternet.htm"
          MENU="https://e-menu.sunat.gob.pe/cl-ti-itmenu/MenuInternet.htm"
          CD="https://ww1.sunat.gob.pe/ol-ti-itconscpegem/consultar.do"
          API="https://api-cpe.sunat.gob.pe/v1/contribuyente/consultacpe/comprobantes"
          STATE='rO0ABXNyABFqYXZhLnV0aWwuSGFzaE1hcAUH2sHDFmDRAwACRgAKbG9hZEZhY3RvckkACXRocmVzaG9sZHhwP0AAAAAAAAx3CAAAABAAAAADdAADZXhlcHQABnBhcmFtc3QASyomKiYvY2wtdGktaXRtZW51L01lbnVJbnRlcm5ldC5odG0mYjY0ZDI2YThiNWFmMDkxOTIzYjIzYjY0MDdhMWMxZGI0MWU3MzNhNnQABGV4ZWNweA=='
          JAR=jar.txt
          set -e

          echo "=== LOGIN ==="
          curl -sS -c "$JAR" -b "$JAR" --max-time 20 -A "$UA" \
            "$SEC/loginMenuSol?lang=es-PE&showDni=true&showLanguages=false&originalUrl=$ORIG&state=$STATE" -o /dev/null
          curl -sS -c "$JAR" -b "$JAR" --max-time 25 -A "$UA" -L \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "tipo=2" --data-urlencode "dni=" \
            --data-urlencode "custom_ruc=$SUNAT_RUC" --data-urlencode "j_username=$SUNAT_USUARIO" \
            --data-urlencode "j_password=$SUNAT_CLAVE" --data-urlencode "captcha=" \
            --data-urlencode "originalUrl=$ORIG" --data-urlencode "state=$STATE" \
            "$SEC/j_security_check" -o login.html
          if ! grep -q "Men" login.html; then
            echo "!! LOGIN FALLIDO"; exit 1
          fi
          echo "Login OK."

          # ---- Obtiene el token JWT de la API moderna (api-cpe.sunat.gob.pe) ----
          # Se pide una sola vez: dura ~1 hora, de sobra para todo el lote.
          echo "=== Obteniendo token de la API moderna (XML/PDF oficiales) ==="
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o /dev/null
          EXEC_LOC=$(curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D - -o /dev/null \
            "$MENU?action=execute&code=11.38.1.1.1" | grep -i "^location:" | sed 's/[Ll]ocation: //' | tr -d '\r')
          API_TOKEN=$(echo "$EXEC_LOC" | grep -oE 'token=[^&]*' | cut -d= -f2)
          if [ -z "$API_TOKEN" ]; then
            echo "AVISO: no se pudo obtener el token de la API moderna. Solo se usara el metodo clasico (representacion PDF)."
          else
            echo "Token moderno obtenido (${#API_TOKEN} caracteres)."
          fi

          set +e  # de aqui en adelante, que una factura fallida no mate el job
          mkdir -p facturas_descargadas
          CHROMIUM=$(find ~/.cache/ms-playwright -name "chrome" -path "*chrome-linux*" | head -1)
          echo "factura,estado_pdf,estado_xml" > resumen.txt

          # Mapea el "tipo" del CSV (convencion de la app clasica) al codCpe oficial
          # de SUNAT + direccion (1=Emitido, 2=Recibido) que exige la API moderna.
          mapear_codcpe() {
            case "$1" in
              10) echo "01 1" ;;  # FE Emitidas
              11) echo "01 2" ;;  # FE Recibidas
              13) echo "07 1" ;;  # NC Emitidas
              14) echo "07 2" ;;  # NC Recibidas
              15) echo "08 1" ;;  # ND Emitidas
              16) echo "08 2" ;;  # ND Recibidas
              *) echo "" ;;       # no soportado aun por la API moderna
            esac
          }

          # Intenta bajar PDF u XML de la API moderna, con reintentos (el servicio
          # es intermitente: falla con 500 con frecuencia, pero responde bien al
          # reintentar). Devuelve 0 si logro guardar el archivo.
          descargar_api_moderna() {
            id="$1"; accion="$2"; destino="$3"
            for intento in 1 2 3 4 5; do
              curl -sS -H "Authorization: Bearer $API_TOKEN" \
                -H "Accept: application/json, text/plain, */*" \
                -H "Origin: https://e-factura.sunat.gob.pe" \
                -H "Referer: https://e-factura.sunat.gob.pe/" \
                -A "$UA" "$API/$id/$accion?formato=x" -o /tmp/api_resp.json
              if grep -q '"valArchivo"' /tmp/api_resp.json; then
                if python3 /tmp/decode_api.py /tmp/api_resp.json "$destino" && [ -f "$destino" ]; then
                  return 0
                fi
              fi
              sleep 4
            done
            return 1
          }

          tail -n +2 facturas.csv | while IFS=',' read -r tipo ruc_emisor serie numero fec_desde fec_hasta; do
            tipo=$(echo "$tipo" | tr -d '\r' | xargs)
            ruc_emisor=$(echo "$ruc_emisor" | tr -d '\r' | xargs)
            serie=$(echo "$serie" | tr -d '\r' | xargs)
            numero=$(echo "$numero" | tr -d '\r' | xargs)
            fec_desde=$(echo "$fec_desde" | tr -d '\r' | xargs)
            fec_hasta=$(echo "$fec_hasta" | tr -d '\r' | xargs)
            [ -z "$tipo" ] && continue

            base="${serie}-${numero}"
            echo ""
            echo "=== Procesando $base (tipo=$tipo, emisor=$ruc_emisor) ==="

            estado_pdf="pendiente"
            estado_xml="no-disponible"

            # ---- 1) Intentar la API moderna (PDF oficial + XML oficial) ----
            if [ -n "$API_TOKEN" ]; then
              read -r codcpe direccion <<< "$(mapear_codcpe "$tipo")"
              if [ -n "$codcpe" ]; then
                id="${ruc_emisor}-${codcpe}-${serie}-${numero}-${direccion}"

                if descargar_api_moderna "$id" "02" "facturas_descargadas/${base}.xml"; then
                  echo "  XML oficial OK -> facturas_descargadas/${base}.xml"
                  estado_xml="OK"
                else
                  echo "  XML oficial: no se pudo obtener tras varios intentos"
                fi

                if descargar_api_moderna "$id" "01" "facturas_descargadas/${base}.pdf"; then
                  echo "  PDF oficial OK -> facturas_descargadas/${base}.pdf"
                  estado_pdf="OK-oficial"
                fi
              else
                echo "  Tipo $tipo aun no soportado por la API moderna (se usara solo el metodo clasico para el PDF)."
              fi
            fi

            # ---- 2) Si no se logro el PDF oficial, usar el metodo clasico (representacion impresa) ----
            if [ "$estado_pdf" != "OK-oficial" ]; then
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o /dev/null
              LOC=$(curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D - -o /dev/null \
                "$MENU?action=execute&code=11.9.5.1.1" | grep -i "^location:" | sed 's/[Ll]ocation: //' | tr -d '\r')
              if [ -n "$LOC" ]; then
                curl -sS -A "$UA" -c "$JAR" -b "$JAR" "$LOC" -o /dev/null
                curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                  --data "action=realizarConsulta" --data "buscarPor=porDoc" --data "tipoConsulta=$tipo" \
                  --data "rucEmisor=$ruc_emisor" --data "serie=$serie" --data "numero=$numero" --data "numDocideRecep=" \
                  --data-urlencode "fecDesde=$fec_desde" --data-urlencode "fecHasta=$fec_hasta" \
                  "$CD" -o query.txt
                curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                  "$CD?action=mostrarListado&tipoConsulta=$tipo" -o /dev/null
                curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                  "$CD?action=verImprimirFactura&rowIndex=0" -o "factura_${base}.html"

                if grep -qi "COMPROBANTE" "factura_${base}.html"; then
                  sed -i '/no tiene la validez de una/d' "factura_${base}.html"
                  "$CHROMIUM" --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
                    --print-to-pdf="facturas_descargadas/${base}.pdf" "file://$(realpath "factura_${base}.html")" 2>/dev/null
                  if [ -f "facturas_descargadas/${base}.pdf" ]; then
                    echo "  PDF (representacion clasica) OK -> facturas_descargadas/${base}.pdf"
                    estado_pdf="OK-representacion"
                  fi
                fi
              fi
            fi

            [ "$estado_pdf" == "pendiente" ] && estado_pdf="FALLO"
            echo "$base,$estado_pdf,$estado_xml" >> resumen.txt
          done

          echo ""
          echo "=== RESUMEN ==="
          cat resumen.txt
          cp resumen.txt facturas_descargadas/resumen.txt

      - name: Guardar los PDF/XML en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add facturas_descargadas/
          git diff --cached --quiet || git commit -m "Facturas descargadas $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Subir tambien como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: facturas-sunat-lote
          path: facturas_descargadas/
          retention-days: 7
