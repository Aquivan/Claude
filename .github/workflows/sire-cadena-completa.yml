              curl -sS -A "$UA" -c "$JAR" -b "$JAR" --connect-timeout 10 --max-time 20 --data "action=prevApp" "$MENU" -o /dev/null || true
              EXEC_LOC=$(curl -sS -A "$UA" -c "$JAR" -b "$JAR" --connect-timeout 10 --max-time 20 -D - -o /dev/null \
                "$MENU?action=execute&code=11.38.1.1.1" 2>/dev/null | grep -i "^location:" | sed 's/[Ll]ocation: //' | tr -d '\r')
              API_TOKEN=$(echo "$EXEC_LOC" | grep -oE 'token=[^&]*' | cut -d= -f2)
              if [ -z "$API_TOKEN" ]; then
