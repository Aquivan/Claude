name: SIRE completo (API oficial -> facturas -> links, sin tocar el Sheet)

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Periodo AAAAMM (ej. 202608). Vacio = mes actual"
        required: false
        default: ""
      tipo:
        description: "compra, venta o ambos"
        required: true
        default: "ambos"
        type: choice
        options:
          - ambos
          - compra
          - venta
  schedule:
    # Todos los dias a las 08:00 hora Peru (13:00 UTC, Peru es UTC-5 todo el
    # ano, sin horario de verano). Ajustable despues si se quiere otra hora.
    - cron: '0 13 * * *'

permissions:
  contents: write

jobs:
  sire_y_facturas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular periodo (mes actual si no se especifico)
        id: periodo
        run: |
          if [ -n "${{ inputs.periodo }}" ]; then
            echo "valor=${{ inputs.periodo }}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular tipos a descargar (compra, venta o ambos)
        id: tipos
        run: |
          if [ -n "${{ inputs.tipo }}" ]; then
            echo "valor=${{ inputs.tipo }}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=ambos" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Chromium (para el respaldo clasico de PDF)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npx --yes playwright install --with-deps chromium

      - name: Descargar de la API SIRE (compra y/o venta) y armar facturas.csv
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
          SIRE_CLIENT_ID: ${{ secrets.SIRE_CLIENT_ID }}
          SIRE_CLIENT_SECRET: ${{ secrets.SIRE_CLIENT_SECRET }}
        run: |
          cat > /tmp/convertir_sire.py << 'PYEOF'
          import csv, glob, sys, os, calendar

          # argv: tipo_reporte("compra"|"venta")  ruta_csv_salida  ruta_facturas_csv
          tipo_reporte, ruta_csv_salida, ruta_facturas_csv = sys.argv[1:4]

          candidatos = glob.glob(f'sire/extraido_{tipo_reporte}/**/*.txt', recursive=True)
          if not candidatos:
              print(f"ERROR: no se encontro ningun .txt para {tipo_reporte}.")
              sys.exit(1)

          # SUNAT a veces devuelve VARIOS .txt dentro del mismo zip (distintos
          # sub-libros, ej. Registro de Compras vs Compras No Domiciliado) y solo
          # uno trae filas reales; el resto vienen vacios (solo cabecera o ni
          # eso). Elegir por fecha de modificacion no es confiable (todos se
          # extraen casi al mismo instante) - se leen TODOS los candidatos y se
          # usa el que tenga mas filas de datos.
          mejor_origen = mejor_filas = None
          for candidato in candidatos:
              with open(candidato, encoding="utf-8", errors="replace") as f:
                  filas_c = [l.rstrip("\n").rstrip("\r").split("|") for l in f if l.strip() != ""]
              print(f"  {candidato}: {max(len(filas_c) - 1, 0)} fila(s) de datos")
              if mejor_filas is None or len(filas_c) > len(mejor_filas):
                  mejor_origen, mejor_filas = candidato, filas_c

          origen, filas = mejor_origen, mejor_filas
          print(f"Usando archivo ({tipo_reporte}, el que tiene mas datos):", origen)
          print(f"DEBUG primera fila cruda ({len(filas[0]) if filas else 0} campos): {filas[0] if filas else []}")

          # No asumir si el .txt trae cabecera o no: SUNAT a veces la trae y
          # a veces no segun el endpoint (propuesta vs descarga oficial), y
          # eso puede variar entre compras y ventas o incluso entre
          # ejecuciones. Se detecta dinamicamente: la primera columna
          # siempre es el RUC propio (11 digitos) en una fila de DATOS; si la
          # primera fila NO es un RUC de 11 digitos, ya es una fila de
          # cabecera real de SUNAT y se usa tal cual (sin inventar nombres).
          primer_campo = (filas[0][0].strip() if filas and filas[0] else "")
          ya_tiene_header = not (primer_campo.isdigit() and len(primer_campo) == 11)
          print(f"DEBUG primer campo: {primer_campo!r} -> ya_tiene_header={ya_tiene_header}")

          # Ventas (RVIE): confirmado el 2026-08-18 con datos reales (RUC
          # propio como primer campo) que el .txt de ventas NUNCA trae
          # cabecera, a diferencia de compras. Se usa la cabecera sintetica
          # por posicion, confirmada algebraicamente contra los datos reales
          # (BI Gravada + IGV [+ Monto Exonerado] = Total CP), solo cuando
          # el numero de campos coincide exactamente (39); si SUNAT cambia
          # el formato, se omite en vez de adivinar mal.
          VENTAS_HEADERS = [
              "RUC", "Apellidos y Nombres o Razón social", "Periodo", "CAR SUNAT",
              "Fecha de emisión", "Fecha Vcto/Pago", "Tipo CP/Doc.", "Serie del CDP",
              "Nro CP o Doc. Nro Inicial (Rango)", "Nro Final (Rango)",
              "Tipo Doc Identidad", "Nro Doc Identidad", "Apellidos Nombres/ Razón  Social",
              "Campo 14 (SUNAT)", "BI Gravada", "Campo 16 (SUNAT)", "IGV / IPM",
              "Campo 18 (SUNAT)", "Monto Exonerado", "Campo 20 (SUNAT)", "Campo 21 (SUNAT)",
              "Campo 22 (SUNAT)", "Campo 23 (SUNAT)", "Campo 24 (SUNAT)", "Campo 25 (SUNAT)",
              "Total CP", "Moneda", "Tipo de Cambio",
              "Fecha Emisión Doc Modificado", "Tipo CP Modificado", "Serie CP Modificado",
              "Nro CP Modificado", "Campo 33 (SUNAT)", "Campo 34 (SUNAT)", "Campo 35 (SUNAT)",
              "Campo 36 (SUNAT)", "Campo 37 (SUNAT)", "Campo 38 (SUNAT)", "Campo 39 (SUNAT)",
          ]

          if not ya_tiene_header:
              if tipo_reporte == "venta" and filas and len(filas[0]) == len(VENTAS_HEADERS):
                  filas = [VENTAS_HEADERS] + filas
              else:
                  print(f"AVISO: el .txt de {tipo_reporte} no trae fila de cabecera y no se pudo "
                        "etiquetar con seguridad (numero de campos inesperado). Se omite para no "
                        "adivinar nombres de columna sin confirmar.")
                  open(ruta_csv_salida, "w").close()
                  sys.exit(0)

          os.makedirs(os.path.dirname(ruta_csv_salida) or ".", exist_ok=True)
          if len(filas) < 2:
              print(f"AVISO: {tipo_reporte} no tiene comprobantes en este periodo.")
              open(ruta_csv_salida, "w").close()
              sys.exit(0)

          with open(ruta_csv_salida, "w", newline="", encoding="utf-8") as out:
              csv.writer(out).writerows(filas)
          print(f"OK: {len(filas)-1} fila(s) de {tipo_reporte} en {ruta_csv_salida}")

          # ---- Agrega filas a facturas.csv (lo que necesita la descarga de PDF/XML) ----
          headers = [h.strip() for h in filas[0]]
          idx_periodo = headers.index("Periodo")
          idx_tipo_cp = headers.index("Tipo CP/Doc.")
          idx_serie = headers.index("Serie del CDP")
          idx_numero = headers.index("Nro CP o Doc. Nro Inicial (Rango)")
          idx_ruc_propio = headers.index("RUC")
          idx_ruc_contraparte = headers.index("Nro Doc Identidad")

          # SIRE (Catalogo 01) -> codigo legacy que entiende la descarga de
          # PDF/XML (Emitidas=ventas, Recibidas=compras - ver mapear_codcpe).
          if tipo_reporte == "venta":
              TIPO_LEGACY = {"01": "10", "07": "13", "08": "15"}
          else:
              TIPO_LEGACY = {"01": "11", "07": "14", "08": "16"}

          existe_header = os.path.exists(ruta_facturas_csv) and os.path.getsize(ruta_facturas_csv) > 0
          with open(ruta_facturas_csv, "a", newline="", encoding="utf-8") as out:
              w = csv.writer(out)
              if not existe_header:
                  w.writerow(["tipo", "ruc_emisor", "serie", "numero", "fecha_desde", "fecha_hasta"])
              agregadas = no_soportadas = 0
              for fila in filas[1:]:
                  if len(fila) <= max(idx_periodo, idx_tipo_cp, idx_serie, idx_numero,
                                       idx_ruc_propio, idx_ruc_contraparte):
                      continue
                  tipo_cp = fila[idx_tipo_cp].strip()
                  serie = fila[idx_serie].strip()
                  numero = fila[idx_numero].strip()
                  periodo = fila[idx_periodo].strip()
                  # El "emisor" real del comprobante para la API de SUNAT: en
                  # compras es el proveedor (Nro Doc Identidad); en ventas
                  # somos nosotros mismos (columna RUC, constante).
                  if tipo_reporte == "venta":
                      ruc_emisor_real = fila[idx_ruc_propio].strip()
                  else:
                      ruc_emisor_real = fila[idx_ruc_contraparte].strip()
                  if not (serie and numero and ruc_emisor_real):
                      continue
                  tipo_legacy = TIPO_LEGACY.get(tipo_cp)
                  if not tipo_legacy:
                      no_soportadas += 1
                      continue
                  fecha_desde = fecha_hasta = ""
                  if len(periodo) == 6 and periodo.isdigit():
                      anio, mes = int(periodo[:4]), int(periodo[4:6])
                      ultimo_dia = calendar.monthrange(anio, mes)[1]
                      fecha_desde = f"01/{mes:02d}/{anio}"
                      fecha_hasta = f"{ultimo_dia:02d}/{mes:02d}/{anio}"
                  w.writerow([tipo_legacy, ruc_emisor_real, serie, numero, fecha_desde, fecha_hasta])
                  agregadas += 1
          print(f"OK: {agregadas} factura(s) de {tipo_reporte} agregadas a {ruta_facturas_csv} "
                f"({no_soportadas} no soportada(s) todavia)")
          PYEOF

          SELECCION="${{ steps.tipos.outputs.valor }}"
          if [ "$SELECCION" = "ambos" ]; then
            TIPOS=(compra venta)
          else
            TIPOS=("$SELECCION")
          fi
          echo "Tipos a descargar: ${TIPOS[*]}"

          rm -f facturas.csv

          for T in "${TIPOS[@]}"; do
            echo ""
            echo "########## Descargando SIRE - $T (periodo ${{ steps.periodo.outputs.valor }}) ##########"
            rm -rf "sire/$T" "sire/extraido_$T"
            mkdir -p "sire/$T" "sire/extraido_$T"

            python3 scripts/sire_client.py \
              --ruc "$SUNAT_RUC" \
              --usuario-sol "$SUNAT_USUARIO" \
              --clave-sol "$SUNAT_CLAVE" \
              --client-id "$SIRE_CLIENT_ID" \
              --client-secret "$SIRE_CLIENT_SECRET" \
              --periodo "${{ steps.periodo.outputs.valor }}" \
              --tipo "$T" \
              --formato txt \
              --out-dir "sire/$T"

            echo "Contenido descargado ($T):"
            find "sire/$T" -maxdepth 1 -type f

            ZIP=$(find "sire/$T" -maxdepth 1 -type f -iname "*.zip" | head -1)
            if [ -n "$ZIP" ]; then
              unzip -o "$ZIP" -d "sire/extraido_$T/"
            else
              cp "sire/$T"/*.txt "sire/extraido_$T/" 2>/dev/null || true
            fi
            echo "Extraido ($T):"
            find "sire/extraido_$T" -type f

            if [ "$T" = "compra" ]; then
              RUTA_CSV="sire/reporte_parseado.csv"
            else
              RUTA_CSV="sire/reporte_parseado_ventas.csv"
            fi
            python3 /tmp/convertir_sire.py "$T" "$RUTA_CSV" facturas.csv
          done

          echo ""
          echo "=== facturas.csv combinado (compra + venta) ==="
          cat facturas.csv 2>/dev/null || echo "(vacio)"

      - name: Crear script de decodificacion (PDF/XML de la API moderna)
        run: |
          cat > /tmp/decode_api.py << 'PYEOF'
          import sys, json, base64, zipfile, io, os, re
          d = json.load(open(sys.argv[1]))
          destdir = sys.argv[2]
          modo = sys.argv[3]  # "raw" (deja el .zip tal cual) o "extract" (saca el archivo de adentro)
          raw = base64.b64decode(d['valArchivo'])
          nom_zip = d.get('nomArchivo', 'archivo.zip')

          if modo == 'raw':
              nombre = nom_zip
              open(os.path.join(destdir, nombre), 'wb').write(raw)
              print(nombre)
          else:
              zf = zipfile.ZipFile(io.BytesIO(raw))
              names = zf.namelist()
              if names:
                  interno = names[0]
                  ext = os.path.splitext(interno)[1]
                  base = re.sub(r'-(PDF|XML)\.zip$', '', nom_zip, flags=re.IGNORECASE)
                  nombre = base + ext
                  open(os.path.join(destdir, nombre), 'wb').write(zf.read(interno))
                  print(nombre)
          PYEOF

      - name: Login + procesar lista de facturas (generadas del SIRE)
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          CID="4f3b88b3-d9d6-402a-b85d-6a0bc857746a"
          SEC="https://api-seguridad.sunat.gob.pe/v1/clientessol/$CID/oauth2"
          ORIG="https://e-menu.sunat.gob.pe/cl-ti-itmenu/AutenticaMenuInternet.htm"
          MENU="https://e-menu.sunat.gob.pe/cl-ti-itmenu/MenuInternet.htm"
          CD="https://ww1.sunat.gob.pe/ol-ti-itconscpegem/consultar.do"
          API="https://api-cpe.sunat.gob.pe/v1/contribuyente/consultacpe/comprobantes"
          STATE='rO0ABXNyABFqYXZhLnV0aWwuSGFzaE1hcAUH2sHDFmDRAwACRgAKbG9hZEZhY3RvckkACXRocmVzaG9sZHhwP0AAAAAAAAx3CAAAABAAAAADdAADZXhlcHQABnBhcmFtc3QASyomKiYvY2wtdGktaXRtZW51L01lbnVJbnRlcm5ldC5odG0mYjY0ZDI2YThiNWFmMDkxOTIzYjIzYjY0MDdhMWMxZGI0MWU3MzNhNnQABGV4ZWNweA=='
          JAR=jar.txt
          set -e

          echo "=== LOGIN ==="
          curl -sS -c "$JAR" -b "$JAR" --max-time 20 -A "$UA" \
            "$SEC/loginMenuSol?lang=es-PE&showDni=true&showLanguages=false&originalUrl=$ORIG&state=$STATE" -o /dev/null
          curl -sS -c "$JAR" -b "$JAR" --max-time 25 -A "$UA" -L \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "tipo=2" --data-urlencode "dni=" \
            --data-urlencode "custom_ruc=$SUNAT_RUC" --data-urlencode "j_username=$SUNAT_USUARIO" \
            --data-urlencode "j_password=$SUNAT_CLAVE" --data-urlencode "captcha=" \
            --data-urlencode "originalUrl=$ORIG" --data-urlencode "state=$STATE" \
            "$SEC/j_security_check" -o login.html
          if ! grep -q "Men" login.html; then
            echo "!! LOGIN FALLIDO"; exit 1
          fi
          echo "Login OK."

          echo "=== Obteniendo token de la API moderna (XML/PDF oficiales) ==="
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o /dev/null
          EXEC_LOC=$(curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D - -o /dev/null \
            "$MENU?action=execute&code=11.38.1.1.1" | grep -i "^location:" | sed 's/[Ll]ocation: //' | tr -d '\r')
          API_TOKEN=$(echo "$EXEC_LOC" | grep -oE 'token=[^&]*' | cut -d= -f2)
          if [ -z "$API_TOKEN" ]; then
            echo "AVISO: no se pudo obtener el token de la API moderna. Solo se usara el metodo clasico."
          else
            echo "Token moderno obtenido (${#API_TOKEN} caracteres)."
          fi

          if [ ! -s facturas.csv ] || [ $(wc -l < facturas.csv) -le 1 ]; then
            echo "facturas.csv esta vacio (nada soportado en este periodo). Nada que descargar."
            exit 0
          fi

          set +e
          mkdir -p facturas_descargadas/oficial facturas_descargadas/representacion
          rm -rf /tmp/estado; mkdir -p /tmp/estado
          CHROMIUM=$(find ~/.cache/ms-playwright -name "chrome" -path "*chrome-linux*" | head -1)

          mapear_codcpe() {
            case "$1" in
              10) echo "01 1" ;;
              11) echo "01 2" ;;
              13) echo "F7 1" ;;
              14) echo "F7 2" ;;
              15) echo "F8 1" ;;
              16) echo "F8 2" ;;
              *) echo "" ;;
            esac
          }
          export -f mapear_codcpe

          descargar_api_moderna() {
            id="$1"; accion="$2"; destdir="$3"; modo="$4"; resp_file="$5"
            for intento in 1 2 3 4 5; do
              curl -sS -H "Authorization: Bearer $API_TOKEN" \
                -H "Accept: application/json, text/plain, */*" \
                -H "Origin: https://e-factura.sunat.gob.pe" \
                -H "Referer: https://e-factura.sunat.gob.pe/" \
                -A "$UA" "$API/$id/$accion?formato=x" -o "$resp_file"
              if grep -q '"valArchivo"' "$resp_file"; then
                nombre=$(python3 /tmp/decode_api.py "$resp_file" "$destdir" "$modo" 2>/dev/null)
                if [ -n "$nombre" ] && [ -f "$destdir/$nombre" ]; then
                  echo "$nombre"
                  return 0
                fi
              fi
              sleep 4
            done
            return 1
          }
          export -f descargar_api_moderna
          export API_TOKEN UA API

          procesar_linea() {
            linea="$1"
            IFS=',' read -r tipo ruc_emisor serie numero fec_desde fec_hasta <<< "$linea"
            tipo=$(echo "$tipo" | tr -d '\r' | xargs)
            ruc_emisor=$(echo "$ruc_emisor" | tr -d '\r' | xargs)
            serie=$(echo "$serie" | tr -d '\r' | xargs)
            numero=$(echo "$numero" | tr -d '\r' | xargs)
            fec_desde=$(echo "$fec_desde" | tr -d '\r' | xargs)
            fec_hasta=$(echo "$fec_hasta" | tr -d '\r' | xargs)
            [ -z "$tipo" ] && return

            base="${serie}-${numero}"
            base_safe=$(echo "$base" | tr '/' '_')
            estado_file="/tmp/estado/${base_safe}.csv"
            echo "=== Procesando $base (tipo=$tipo, emisor=$ruc_emisor) ==="

            estado_pdf="pendiente"
            estado_xml="no-disponible"
            archivo_pdf=""
            archivo_xml=""

            read -r codcpe direccion <<< "$(mapear_codcpe "$tipo")"

            if [ -n "$codcpe" ]; then
              id="${ruc_emisor}-${codcpe}-${serie}-${numero}"

              if [ -f "facturas_descargadas/oficial/${id}.pdf" ]; then
                estado_pdf="YA-DESCARGADO"; archivo_pdf="oficial/${id}.pdf"
              elif [ -f "facturas_descargadas/representacion/${base}.pdf" ]; then
                estado_pdf="YA-DESCARGADO"; archivo_pdf="representacion/${base}.pdf"
              fi
              if [ -f "facturas_descargadas/oficial/${id}-XML.zip" ]; then
                estado_xml="YA-DESCARGADO"; archivo_xml="oficial/${id}-XML.zip"
              fi

              id_api="${id}-${direccion}"

              if [ -z "$archivo_xml" ] && [ -n "$API_TOKEN" ]; then
                nombre_xml=$(descargar_api_moderna "$id_api" "02" "facturas_descargadas/oficial" "raw" "/tmp/api_resp_${base_safe}_xml.json")
                if [ -n "$nombre_xml" ]; then
                  estado_xml="OK"; archivo_xml="oficial/$nombre_xml"
                fi
              fi

              if [ -z "$archivo_pdf" ] && [ -n "$API_TOKEN" ]; then
                nombre_pdf=$(descargar_api_moderna "$id_api" "01" "facturas_descargadas/oficial" "extract" "/tmp/api_resp_${base_safe}_pdf.json")
                if [ -n "$nombre_pdf" ]; then
                  estado_pdf="OK-oficial"; archivo_pdf="oficial/$nombre_pdf"
                fi
              fi
            else
              if [ -f "facturas_descargadas/representacion/${base}.pdf" ]; then
                estado_pdf="YA-DESCARGADO"; archivo_pdf="representacion/${base}.pdf"
              fi
            fi

            if [ -n "$archivo_pdf" ]; then necesita_fallback=0; else necesita_fallback=1; fi
            echo "$estado_pdf,$estado_xml,$archivo_pdf,$archivo_xml,$necesita_fallback" > "$estado_file"
          }
          export -f procesar_linea

          tail -n +2 facturas.csv | xargs -P 5 -I {} bash -c 'procesar_linea "$1"' _ {}

          echo ""
          echo "=== Fallback clasico (representacion impresa) para lo que quedo pendiente ==="
          tail -n +2 facturas.csv | while IFS=',' read -r tipo ruc_emisor serie numero fec_desde fec_hasta; do
            tipo=$(echo "$tipo" | tr -d '\r' | xargs)
            ruc_emisor=$(echo "$ruc_emisor" | tr -d '\r' | xargs)
            serie=$(echo "$serie" | tr -d '\r' | xargs)
            numero=$(echo "$numero" | tr -d '\r' | xargs)
            fec_desde=$(echo "$fec_desde" | tr -d '\r' | xargs)
            fec_hasta=$(echo "$fec_hasta" | tr -d '\r' | xargs)
            [ -z "$tipo" ] && continue
            base="${serie}-${numero}"
            base_safe=$(echo "$base" | tr '/' '_')
            estado_file="/tmp/estado/${base_safe}.csv"
            [ -f "$estado_file" ] || continue
            IFS=',' read -r estado_pdf estado_xml archivo_pdf archivo_xml necesita_fallback < "$estado_file"
            [ "$necesita_fallback" != "1" ] && continue

            echo "  Fallback clasico para $base..."
            curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o /dev/null
            LOC=$(curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D - -o /dev/null \
              "$MENU?action=execute&code=11.9.5.1.1" | grep -i "^location:" | sed 's/[Ll]ocation: //' | tr -d '\r')
            if [ -n "$LOC" ]; then
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" "$LOC" -o /dev/null
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                --data "action=realizarConsulta" --data "buscarPor=porDoc" --data "tipoConsulta=$tipo" \
                --data "rucEmisor=$ruc_emisor" --data "serie=$serie" --data "numero=$numero" --data "numDocideRecep=" \
                --data-urlencode "fecDesde=$fec_desde" --data-urlencode "fecHasta=$fec_hasta" \
                "$CD" -o query.txt
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                "$CD?action=mostrarListado&tipoConsulta=$tipo" -o /dev/null
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                "$CD?action=verImprimirFactura&rowIndex=0" -o "factura_${base_safe}.html"

              if grep -qi "COMPROBANTE" "factura_${base_safe}.html"; then
                sed -i '/no tiene la validez de una/d' "factura_${base_safe}.html"
                "$CHROMIUM" --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
                  --print-to-pdf="facturas_descargadas/representacion/${base}.pdf" "file://$(realpath "factura_${base_safe}.html")" 2>/dev/null
                if [ -f "facturas_descargadas/representacion/${base}.pdf" ]; then
                  estado_pdf="OK-representacion"; archivo_pdf="representacion/${base}.pdf"
                fi
              fi
            fi
            [ "$estado_pdf" == "pendiente" ] && estado_pdf="FALLO"
            echo "$estado_pdf,$estado_xml,$archivo_pdf,$archivo_xml,0" > "$estado_file"
          done

          echo "factura,estado_pdf,estado_xml,archivo_pdf,archivo_xml" > resumen.txt
          tail -n +2 facturas.csv | while IFS=',' read -r tipo ruc_emisor serie numero fec_desde fec_hasta; do
            tipo=$(echo "$tipo" | tr -d '\r' | xargs)
            serie=$(echo "$serie" | tr -d '\r' | xargs)
            numero=$(echo "$numero" | tr -d '\r' | xargs)
            [ -z "$tipo" ] && continue
            base="${serie}-${numero}"
            base_safe=$(echo "$base" | tr '/' '_')
            estado_file="/tmp/estado/${base_safe}.csv"
            [ -f "$estado_file" ] || continue
            IFS=',' read -r estado_pdf estado_xml archivo_pdf archivo_xml necesita_fallback < "$estado_file"
            [ "$estado_pdf" == "pendiente" ] && estado_pdf="FALLO"
            echo "$base,$estado_pdf,$estado_xml,$archivo_pdf,$archivo_xml" >> resumen.txt
          done

          echo ""
          echo "=== RESUMEN ==="
          cat resumen.txt
          cp resumen.txt facturas_descargadas/resumen.txt

      - name: Generar tablas completas (markdown) de compras y ventas
        if: always()
        run: |
          cat > /tmp/generar_md.py << 'PYEOF'
          import csv, os, textwrap

          RAMA = os.environ.get("GITHUB_REF_NAME", "claude/python-codes-izve18")
          BASE_GH = f"https://github.com/Aquivan/Claude/blob/{RAMA}/facturas_descargadas/"
          RUTA_RESUMEN = "resumen.txt"

          # Compras (RCE): el .txt de SUNAT SI trae cabecera con nombres
          # reales. Se omiten las columnas que siempre llegan vacias (Año,
          # Nro Final Rango, COD. DAM O DSI, Clasif de Bss y Sss,
          # ID Proyecto Operadores, PorcPart, CAR Orig/Ind E o I, CLU1..CLU39).
          COLUMNAS_COMPRAS = [
              "RUC", "Apellidos y Nombres o Razón social", "Periodo", "CAR SUNAT",
              "Fecha de emisión", "Fecha Vcto/Pago", "Tipo CP/Doc.", "Serie del CDP",
              "Nro CP o Doc. Nro Inicial (Rango)", "Tipo Doc Identidad", "Nro Doc Identidad",
              "Apellidos Nombres/ Razón  Social", "BI Gravado DG", "IGV / IPM DG",
              "BI Gravado DGNG", "IGV / IPM DGNG", "BI Gravado DNG", "IGV / IPM DNG",
              "Valor Adq. NG", "ISC", "ICBPER", "Otros Trib/ Cargos", "Total CP", "Moneda",
              "Tipo de Cambio", "Fecha Emisión Doc Modificado", "Tipo CP Modificado",
              "Serie CP Modificado", "Nro CP Modificado", "IMB", "Detracción",
              "Tipo de Nota", "Est. Comp.", "Incal",
          ]

          # Ventas (RVIE): el .txt de SUNAT NO trae cabecera (verificado
          # 2026-08-18) - se le puso una cabecera sintetica por posicion en
          # convertir_sire.py. Los campos "Campo N (SUNAT)" son posiciones
          # cuyo nombre oficial no se pudo confirmar (siempre 0 en los datos
          # vistos); se muestran igual para no ocultar montos por si algun
          # periodo si los usa. Se omite solo "Nro Final (Rango)", confirmado
          # siempre vacio igual que en compras.
          COLUMNAS_VENTAS = [
              "RUC", "Apellidos y Nombres o Razón social", "Periodo", "CAR SUNAT",
              "Fecha de emisión", "Fecha Vcto/Pago", "Tipo CP/Doc.", "Serie del CDP",
              "Nro CP o Doc. Nro Inicial (Rango)", "Tipo Doc Identidad", "Nro Doc Identidad",
              "Apellidos Nombres/ Razón  Social",
              "Campo 14 (SUNAT)", "BI Gravada", "Campo 16 (SUNAT)", "IGV / IPM",
              "Campo 18 (SUNAT)", "Monto Exonerado", "Campo 20 (SUNAT)", "Campo 21 (SUNAT)",
              "Campo 22 (SUNAT)", "Campo 23 (SUNAT)", "Campo 24 (SUNAT)",
              "Total CP", "Moneda", "Tipo de Cambio",
              "Fecha Emisión Doc Modificado", "Tipo CP Modificado",
              "Serie CP Modificado", "Nro CP Modificado",
          ]

          def esc(v):
              return (v or "").replace("|", "\\|").replace("\n", " ").strip()

          def significados(contraparte):
              base = "Campo de SUNAT del reporte de ventas cuyo nombre oficial no se pudo confirmar contra el manual (siempre 0 en los datos vistos hasta ahora; se muestra tal cual, sin interpretar, por si algun periodo lo usa)."
              d = {
                  "RUC": "RUC de la empresa que descarga el reporte",
                  "Apellidos y Nombres o Razón social": "Razón social de la empresa que descarga el reporte",
                  "Periodo": "Periodo tributario AAAAMM",
                  "CAR SUNAT": "Código Único de Registro del comprobante en el libro electrónico",
                  "Fecha de emisión": "Fecha de emisión del comprobante",
                  "Fecha Vcto/Pago": "Fecha de vencimiento o pago pactada (si aplica)",
                  "Tipo CP/Doc.": "Código de tipo de comprobante (Catálogo 01 SUNAT: `01`=Factura, `07`=Nota de Crédito, `08`=Nota de Débito)",
                  "Serie del CDP": "Serie del comprobante",
                  "Nro CP o Doc. Nro Inicial (Rango)": "Número del comprobante",
                  "Tipo Doc Identidad": f"Tipo de documento del {contraparte} (`6`=RUC)",
                  "Nro Doc Identidad": f"RUC del {contraparte}",
                  "Apellidos Nombres/ Razón  Social": f"Razón social o nombre del {contraparte}",
                  "Total CP": "Importe total del comprobante",
                  "Moneda": "Código de moneda (`PEN`=soles)",
                  "Tipo de Cambio": "Tipo de cambio aplicado",
                  "Fecha Emisión Doc Modificado": "Fecha de emisión del comprobante que la nota modifica (solo notas)",
                  "Tipo CP Modificado": "Tipo del comprobante modificado (solo notas)",
                  "Serie CP Modificado": "Serie del comprobante modificado (solo notas)",
                  "Nro CP Modificado": "Número del comprobante modificado (solo notas)",
                  # Compras (RCE)
                  "BI Gravado DG": "Base imponible gravada — Destino Gravado",
                  "IGV / IPM DG": "IGV de la base gravada DG",
                  "BI Gravado DGNG": "Base imponible — Destino Gravado y No Gravado (uso mixto)",
                  "IGV / IPM DGNG": "IGV de la base DGNG",
                  "BI Gravado DNG": "Base imponible — Destino No Gravado",
                  "IGV / IPM DNG": "IGV de la base DNG",
                  "Valor Adq. NG": "Valor de adquisición No Gravado (exonerado/inafecto)",
                  "ISC": "Impuesto Selectivo al Consumo",
                  "ICBPER": "Impuesto a las bolsas plásticas",
                  "Otros Trib/ Cargos": "Otros tributos o cargos del comprobante",
                  "IMB": "Campo de uso interno de SUNAT (siempre `0.00` en los reportes observados)",
                  "Detracción": "`D` = comprobante con detracción, vacío = sin detracción",
                  "Tipo de Nota": "Motivo de la nota de crédito/débito (Catálogo 09 SUNAT), solo en notas",
                  "Est. Comp.": "Estado del comprobante en el libro (`1` = vigente)",
                  "Incal": "Indicador de comprobante observado por SUNAT (`0` = sin observación)",
                  # Ventas (RVIE) - posiciones confirmadas algebraicamente
                  # (BI Gravada + IGV [+ Monto Exonerado] = Total CP)
                  "BI Gravada": "Base imponible gravada con IGV",
                  "IGV / IPM": "IGV/IPM de la base gravada",
                  "Monto Exonerado": "Monto de venta exonerada de IGV (confirmado: cuando BI/IGV estan en 0, este campo es igual al Total CP)",
                  # Resultado de la descarga
                  "Estado": "Resultado de la descarga automática del PDF/XML (`OK-oficial`, `OK-representacion`, `YA-DESCARGADO`, `FALLO`, `SIN-PROCESAR`)",
                  "Link PDF": "Link al PDF del comprobante, guardado en el repositorio de GitHub",
                  "Link XML": "Link al XML (ZIP) del comprobante, guardado en el repositorio de GitHub",
              }
              return d, base

          def generar_tabla(ruta_csv, ruta_md, titulo, contraparte, columnas, nota_omitidas):
              if not os.path.exists(ruta_csv) or os.path.getsize(ruta_csv) == 0:
                  print(f"No hay {ruta_csv} (o esta vacio), se omite {ruta_md}.")
                  return
              with open(ruta_csv, encoding="utf-8") as f:
                  filas = list(csv.reader(f))
              if len(filas) < 2:
                  print(f"{ruta_csv} no tiene filas de datos, se omite {ruta_md}.")
                  return
              headers = [h.strip() for h in filas[0]]
              datos = filas[1:]
              idx = {h: headers.index(h) for h in columnas if h in headers}

              resumen = {}
              if os.path.exists(RUTA_RESUMEN):
                  with open(RUTA_RESUMEN, encoding="utf-8") as f:
                      for r in csv.DictReader(f):
                          resumen[r["factura"]] = r

              filas_md = []
              for fila in datos:
                  def val(col):
                      i = idx.get(col)
                      return esc(fila[i]) if i is not None and i < len(fila) else ""

                  serie = val("Serie del CDP")
                  numero = val("Nro CP o Doc. Nro Inicial (Rango)")
                  r = resumen.get(f"{serie}-{numero}", {})
                  estado = (r.get("estado_pdf") or "SIN-PROCESAR").strip() or "SIN-PROCESAR"
                  archivo_pdf = (r.get("archivo_pdf") or "").strip()
                  archivo_xml = (r.get("archivo_xml") or "").strip()
                  link_pdf = f"[{archivo_pdf}]({BASE_GH}{archivo_pdf})" if archivo_pdf else "-"
                  link_xml = f"[{archivo_xml}]({BASE_GH}{archivo_xml})" if archivo_xml else "-"

                  celdas = [val(c) for c in columnas] + [estado, link_pdf, link_xml]
                  filas_md.append("| " + " | ".join(celdas) + " |")

              encabezado = "| " + " | ".join(columnas + ["Estado", "Link PDF", "Link XML"]) + " |"
              separador = "|" + "|".join(["---"] * (len(columnas) + 3)) + "|"
              periodo = datos[0][idx["Periodo"]].strip() if datos and "Periodo" in idx else "?"

              significado_map, significado_generico = significados(contraparte)
              filas_explicacion = "\n".join(
                  f"| `{c}` | {significado_map.get(c, significado_generico)} |"
                  for c in columnas + ["Estado", "Link PDF", "Link XML"]
              )
              explicacion = "## Qué significa cada columna\n\n| Columna | Significado |\n|---|---|\n" + filas_explicacion + "\n"

              os.makedirs(os.path.dirname(ruta_md) or ".", exist_ok=True)
              with open(ruta_md, "w", encoding="utf-8") as out:
                  out.write(f"# {titulo}\n\n")
                  out.write(
                      "Tabla generada automaticamente en cada ejecucion del workflow "
                      "`sire-cadena-completa.yml`, con TODOS los comprobantes del ultimo "
                      f"reporte descargado (periodo **{periodo}**, {len(datos)} "
                      "comprobante(s)). Se actualiza sola cada vez que se agregan mas "
                      f"comprobantes. {nota_omitidas}\n\n"
                  )
                  out.write(encabezado + "\n")
                  out.write(separador + "\n")
                  out.write("\n".join(filas_md) + "\n\n")
                  out.write(explicacion)
                  out.write(
                      "\n---\n\n*Generado automaticamente por el workflow "
                      f"`sire-cadena-completa.yml` a partir de `{ruta_csv}` "
                      "y `resumen.txt` en cada ejecucion.*\n"
                  )
              print(f"OK: {ruta_md} generado con {len(datos)} comprobante(s).")

          generar_tabla(
              "sire/reporte_parseado.csv", "docs/SIRE-columnas-reporte-compras.md",
              "Registro de Compras SIRE — todos los comprobantes", "proveedor",
              COLUMNAS_COMPRAS,
              "Se omiten las columnas que SUNAT siempre trae vacias (`Año`, "
              "`Nro Final (Rango)`, `COD. DAM O DSI`, `Clasif de Bss y Sss`, "
              "`ID Proyecto Operadores`, `PorcPart`, `CAR Orig/ Ind E o I`, y "
              "`CLU1`...`CLU39`)."
          )
          generar_tabla(
              "sire/reporte_parseado_ventas.csv", "docs/SIRE-columnas-reporte-ventas.md",
              "Registro de Ventas SIRE — todos los comprobantes", "cliente",
              COLUMNAS_VENTAS,
              "El .txt de ventas de SUNAT no trae fila de cabecera (a diferencia "
              "de compras); se le puso una cabecera por posicion. Se omite solo "
              "`Nro Final (Rango)` (siempre vacio)."
          )
          PYEOF
          python3 /tmp/generar_md.py

      - name: Guardar todo en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sire/reporte_parseado.csv sire/reporte_parseado_ventas.csv \
                  facturas.csv facturas_descargadas/ \
                  docs/SIRE-columnas-reporte-compras.md docs/SIRE-columnas-reporte-ventas.md \
                  2>/dev/null || true
          git diff --cached --quiet || git commit -m "SIRE + facturas (${{ inputs.tipo || 'ambos' }}, ${{ steps.periodo.outputs.valor }}) $(date -u +'%Y-%m-%d %H:%M UTC')"
          logrado=0
          for intento in 1 2 3; do
            if git push; then logrado=1; break; fi
            echo "Push rechazado, reintentando con rebase (intento $intento)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep 3
          done
          if [ "$logrado" -ne 1 ]; then
            echo "ERROR: no se pudo subir los resultados despues de 3 intentos."
            exit 1
          fi

      - name: Subir tambien como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sire-y-facturas
          path: |
            sire/reporte_parseado.csv
            sire/reporte_parseado_ventas.csv
            facturas.csv
            facturas_descargadas/
          retention-days: 7

      - name: Avisar a Google Sheets (importa el SIRE de compras/ventas y despues los links)
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.SHEETS_WEBHOOK_SECRET }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "--- Paso 1: importar reporte SIRE (compras) a la hoja 'Reporte SIRE' ---"
            curl -sS -L "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"secreto\":\"$WEBHOOK_SECRET\",\"tipo\":\"sire\"}" \
              -o /tmp/webhook_sire.html -w "HTTP %{http_code}\n"
            head -c 400 /tmp/webhook_sire.html; echo ""

            echo "--- Paso 1b: importar reporte SIRE (ventas) a la hoja 'Reporte SIRE Ventas' ---"
            curl -sS -L "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"secreto\":\"$WEBHOOK_SECRET\",\"tipo\":\"sire_venta\"}" \
              -o /tmp/webhook_sire_venta.html -w "HTTP %{http_code}\n"
            head -c 400 /tmp/webhook_sire_venta.html; echo ""

            echo "--- Paso 2: subir PDF/XML a Drive y escribir los links (ambas hojas) ---"
            curl -sS -L "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"secreto\":\"$WEBHOOK_SECRET\"}" \
              -o /tmp/webhook_links.html -w "HTTP %{http_code}\n"
            head -c 400 /tmp/webhook_links.html; echo ""
          else
            echo "SHEETS_WEBHOOK_URL no esta configurado; se omite el aviso automatico."
          fi
