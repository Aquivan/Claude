name: SIRE completo (API oficial -> facturas -> links, sin tocar el Sheet)

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Periodo AAAAMM (ej. 202608). Vacio = mes actual"
        required: false
        default: ""
      tipo:
        description: "compra, venta o ambos"
        required: true
        default: "ambos"
        type: choice
        options:
          - ambos
          - compra
          - venta
      modo:
        description: "completo = todo el flujo normal. solo-reintentar-fallidas = NO vuelve a pedir el reporte SIRE a SUNAT, solo reintenta el PDF/XML de los comprobantes que quedaron en FALLO/pendiente en el ultimo run guardado (necesita haber corrido en modo completo antes)."
        required: true
        default: "completo"
        type: choice
        options:
          - completo
          - solo-reintentar-fallidas
      ruc:
        # OJO: esta lista es fija (GitHub Actions no permite armar el
        # desplegable dinamicamente desde empresas.json) -- si se agrega o
        # saca una empresa de empresas.json, hay que agregar/sacar SUS 2
        # lineas aca tambien (la "RUC - Nombre" para el desplegable manual,
        # y el RUC pelado solo, que es lo que GitHubSync.gs -- el menu
        # "Ejecutar UNA empresa" de la Sheet -- manda por API). Probado:
        # GitHub SI valida por API que el valor este en esta lista (rechaza
        # con 422 "not in the list of allowed values" si no esta), por eso
        # hacen falta las 2 formas y no alcanza con una sola.
        description: "Elegi UNA empresa para correr solo esa (o dejalo en 'Todas' para correr todas las activas de empresas.json). La empresa elegida igual debe estar 'activo: true' en empresas.json."
        required: true
        default: "Todas las empresas activas"
        type: choice
        options:
          - "Todas las empresas activas"
          - "20615366791 - CORPORACION EMPRESARIAL JENILE E.I.R.L."
          - "20447623669 - PROCESOSO ALIEMENTARIOS M&D E.I.R.L."
          - "20447968216 - DSM CORPORACION E.I.R.L."
          - "20615366791"
          - "20447623669"
          - "20447968216"
          - ""
  schedule:
    # Todos los dias a las 08:00 hora Peru (13:00 UTC, Peru es UTC-5 todo el
    # ano, sin horario de verano). Ajustable despues si se quiere otra hora.
    - cron: '0 06 * * *'

permissions:
  contents: write

jobs:
  # Lee empresas.json y arma la lista de empresas ACTIVAS para que el job de
  # abajo corra una vez por empresa (matrix), cada una con sus propias
  # credenciales SUNAT tomadas de su GitHub Environment (nombrado igual que
  # su RUC). Asi se agregan/quitan empresas editando solo empresas.json, sin
  # tocar este workflow.
  preparar_empresas:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.leer.outputs.matriz }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer empresas.json (solo las activas, expandir rango de periodos)
        id: leer
        env:
          RUC_INPUT: ${{ inputs.ruc }}
        run: |
          cat > /tmp/preparar_matriz.py << 'PYEOF'
          # Lee empresas.json (formato {"_ayuda": {...}, "empresas": [...]}) y
          # arma una "tarea" por cada combinacion (empresa activa x periodo).
          # Si una empresa tiene periodo_hasta, se expande a un periodo por
          # cada mes entre periodo y periodo_hasta (inclusive); si no, es un
          # solo periodo (o el mes actual si "periodo" viene vacio).
          #
          # Si se disparo con un RUC especifico (inputs.ruc, ej. desde el
          # menu "Ejecutar UNA empresa" de la hoja de Google), se corre SOLO
          # esa empresa en vez de todas las activas -- pero sigue exigiendo
          # que este "activo: true" en empresas.json, para no correr por
          # error una empresa que se desactivo a proposito.
          import json, os
          from datetime import datetime, timezone

          with open('empresas.json', encoding='utf-8') as f:
              data = json.load(f)
          empresas = data['empresas'] if isinstance(data, dict) else data

          # El desplegable manual manda "RUC - Nombre" (o "Todas las
          # empresas activas"). El menu "Ejecutar UNA empresa" de la Sheet,
          # en cambio, sigue mandando el RUC pelado por API (GitHubSync.gs).
          # Soportamos los dos formatos con el mismo campo.
          ruc_input = os.environ.get('RUC_INPUT', '').strip()
          ruc_filtro = ''
          if ruc_input and not ruc_input.lower().startswith('todas'):
              ruc_filtro = ruc_input.split(' - ')[0].strip()
          if ruc_filtro:
              empresas = [e for e in empresas if e.get('ruc') == ruc_filtro]

          def sumar_mes(periodo, delta):
              anio, mes = int(periodo[:4]), int(periodo[4:6])
              total = anio * 12 + (mes - 1) + delta
              anio2, mes2 = divmod(total, 12)
              return f"{anio2:04d}{mes2 + 1:02d}"

          def rango_periodos(desde, hasta):
              periodos, actual = [], desde
              while True:
                  periodos.append(actual)
                  if actual == hasta or len(periodos) >= 60:  # tope de seguridad: 5 anios
                      break
                  actual = sumar_mes(actual, 1)
              return periodos

          mes_actual = datetime.now(timezone.utc).strftime("%Y%m")

          tareas = []
          for e in empresas:
              if not e.get('activo'):
                  continue
              periodo = (e.get('periodo') or '').strip() or mes_actual
              periodo_hasta = (e.get('periodo_hasta') or '').strip()
              periodos = rango_periodos(periodo, periodo_hasta) if periodo_hasta else [periodo]
              for p in periodos:
                  tareas.append({
                      'ruc': e['ruc'],
                      'nombre': e.get('nombre', ''),
                      'tipo': e.get('tipo') or 'ambos',
                      'periodo': p,
                      'generar_markdown': e.get('generar_markdown', True),
                      'modalidad_descarga': (e.get('modalidad_descarga') or '').strip(),
                      'metodo_descarga_pdf': (e.get('metodo_descarga_pdf') or '').strip(),
                      'subir_pdf_r2': bool(e.get('subir_pdf_r2', False)),
                  })

          print(json.dumps(tareas))
          PYEOF
          MATRIZ=$(python3 /tmp/preparar_matriz.py)
          echo "Tareas (empresa x periodo) activas: $MATRIZ"
          echo "matriz=$MATRIZ" >> "$GITHUB_OUTPUT"

  sire_y_facturas:
    needs: preparar_empresas
    if: needs.preparar_empresas.outputs.matriz != '[]'
    runs-on: ubuntu-latest
    # Limite de seguridad: sin esto, si un paso se cuelga (ej. apt-get
    # esperando un mirror que no responde), GitHub lo deja correr hasta 6
    # horas por defecto -- y como las empresas corren de a una, eso bloquea
    # a todas las demas. Con este limite, se corta solo y sigue la siguiente.
    # 3 horas da margen de sobra para descargar muchos PDF/XML de un tiron
    # (una corrida normal, aun con hartos comprobantes, tarda minutos, no
    # horas), sin dejar que un cuelgue real se coma las 2000 min/mes gratis.
    timeout-minutes: 180
    # Hasta 3 empresas a la vez (no todas de un tiro, para no arriesgar de
    # mas con SUNAT si hay algun limite por IP/carga que no se puede ver de
    # antemano). El choque de "git push" entre jobs que terminan casi juntos
    # se resuelve con el reintento+rebase de mas abajo (ahora con mas
    # intentos y una espera con jitter, pensado para correr en paralelo de
    # verdad en vez de solo para colisiones raras).
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        empresa: ${{ fromJson(needs.preparar_empresas.outputs.matriz) }}
    # El nombre del Environment debe ser EXACTAMENTE el RUC de la empresa
    # (Settings > Environments > New environment, con ese nombre) y ahi
    # adentro van sus 5 secrets: SUNAT_RUC, SUNAT_USUARIO, SUNAT_CLAVE,
    # SIRE_CLIENT_ID, SIRE_CLIENT_SECRET.
    environment: ${{ matrix.empresa.ruc }}
    env:
      RUC: ${{ matrix.empresa.ruc }}
      FACTURAS_CSV: sire/${{ matrix.empresa.ruc }}/facturas.csv
      RUTA_COMPRAS_CSV: sire/${{ matrix.empresa.ruc }}/reporte_parseado.csv
      RUTA_VENTAS_CSV: sire/${{ matrix.empresa.ruc }}/reporte_parseado_ventas.csv
      DIR_HISTORICO: sire/${{ matrix.empresa.ruc }}/historico
      DIR_DESCARGAS: facturas_descargadas/${{ matrix.empresa.ruc }}
      DOC_COMPRAS_MD: docs/SIRE-columnas-reporte-compras-${{ matrix.empresa.ruc }}.md
      DOC_VENTAS_MD: docs/SIRE-columnas-reporte-ventas-${{ matrix.empresa.ruc }}.md
      METODO_PDF: ${{ matrix.empresa.metodo_descarga_pdf }}
      MODO: ${{ inputs.modo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcular periodo (mes actual si no se especifico)
        id: periodo
        run: |
          if [ -n "${{ inputs.periodo }}" ]; then
            echo "valor=${{ inputs.periodo }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ matrix.empresa.periodo }}" ]; then
            echo "valor=${{ matrix.empresa.periodo }}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular tipos a descargar (compra, venta o ambos)
        id: tipos
        run: |
          if [ -n "${{ inputs.tipo }}" ]; then
            echo "valor=${{ inputs.tipo }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ matrix.empresa.tipo }}" ]; then
            echo "valor=${{ matrix.empresa.tipo }}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=ambos" >> "$GITHUB_OUTPUT"
          fi

      - name: Ubicar Chromium para el respaldo clasico de PDF
        if: matrix.empresa.modalidad_descarga != 'sire'
        timeout-minutes: 20
        run: |
          # El runner ubuntu-latest de GitHub YA trae Google Chrome y
          # Chromium instalados de fabrica, con todas sus librerias de
          # sistema ya resueltas.
          #
          # Antes este paso hacia "playwright install --with-deps chromium",
          # que ademas de bajar OTRO Chromium corre apt-get por dentro. Y apt
          # en estos runners pega contra azure.archive.ubuntu.com, que es
          # lento/inestable de forma recurrente (problema conocido y todavia
          # abierto de GitHub: actions/runner-images#12949). Por eso este paso
          # tardaba al azar entre 24 segundos y 19 minutos, y a veces fallaba
          # del todo aun reintentando -- reintentar no ayuda si el mirror
          # sigue caido.
          #
          # Usando el navegador que ya esta en la maquina: 0 red, 0 apt, ~1s.
          set -u

          # No alcanza con que el binario exista: tiene que poder generar un
          # PDF headless, que es exactamente para lo que se usa mas abajo.
          probar_navegador() {
            bin="$1"
            [ -n "$bin" ] && [ -x "$bin" ] || return 1
            echo '<html><body>ok</body></html>' > /tmp/prueba_chromium.html
            rm -f /tmp/prueba_chromium.pdf
            "$bin" --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
              --print-to-pdf=/tmp/prueba_chromium.pdf \
              "file:///tmp/prueba_chromium.html" >/dev/null 2>&1 || return 1
            [ -s /tmp/prueba_chromium.pdf ]
          }

          buscar_navegador() {
            for bin in \
              "$(command -v google-chrome-stable 2>/dev/null || true)" \
              "$(command -v google-chrome 2>/dev/null || true)" \
              "$(command -v chromium-browser 2>/dev/null || true)" \
              "$(command -v chromium 2>/dev/null || true)" \
              "$(find "$HOME/.cache/ms-playwright" -name chrome -path '*chrome-linux*' 2>/dev/null | head -1)"; do
              if probar_navegador "$bin"; then
                echo "$bin"
                return 0
              fi
            done
            return 1
          }

          CHROMIUM_BIN="$(buscar_navegador || true)"

          # Plan B: si el runner alguna vez dejara de traer navegador (no
          # deberia pasar), recien ahi se descarga -- con la limpieza del
          # candado de apt, porque el apt-get de adentro corre como root via
          # sudo y "timeout" no llega a matarlo, dejando el candado tomado y
          # haciendo que los reintentos fallen con "Could not get lock".
          if [ -z "$CHROMIUM_BIN" ]; then
            echo "AVISO: el runner no trajo ningun navegador utilizable."
            echo "Se cae al metodo viejo (descargar Chromium con Playwright)."
            npm init -y >/dev/null 2>&1 || true
            for intento in 1 2 3; do
              sudo pkill -9 -f apt-get 2>/dev/null || true
              sudo pkill -9 -f dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock \
                         /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock 2>/dev/null || true
              sudo dpkg --configure -a 2>/dev/null || true
              echo "=== Intento $intento de 3 (descarga) ==="
              timeout 360 npx --yes playwright install --with-deps chromium && break
              echo "Fallo o se colgo el intento $intento, reintentando..."
              sleep 5
            done
            CHROMIUM_BIN="$(buscar_navegador || true)"
          fi

          if [ -z "$CHROMIUM_BIN" ]; then
            echo "ERROR: no se consiguio ningun Chromium capaz de generar PDF."
            exit 1
          fi

          echo "Chromium a usar: $CHROMIUM_BIN"
          "$CHROMIUM_BIN" --version || true
          echo "CHROMIUM_BIN=$CHROMIUM_BIN" >> "$GITHUB_ENV"

      - name: Descargar de la API SIRE (compra y/o venta) y armar facturas.csv
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
          SIRE_CLIENT_ID: ${{ secrets.SIRE_CLIENT_ID }}
          SIRE_CLIENT_SECRET: ${{ secrets.SIRE_CLIENT_SECRET }}
        run: |
          cat > /tmp/convertir_sire.py << 'PYEOF'
          import csv, glob, sys, os, calendar

          # argv: tipo_reporte("compra"|"venta")  ruta_csv_salida  ruta_facturas_csv
          tipo_reporte, ruta_csv_salida, ruta_facturas_csv, ruc = sys.argv[1:5]

          candidatos = glob.glob(f'sire/{ruc}/extraido_{tipo_reporte}/**/*.txt', recursive=True)
          if not candidatos:
              # sire_client.py ya no escribe ningun archivo cuando SUNAT
              # confirma que no hay comprobantes en el periodo (ver el AVISO
              # "no tiene comprobantes... periodo vacio" en su salida) --
              # eso es un resultado valido, no un error, asi que se sigue
              # igual que el caso de "0 filas" mas abajo en vez de cortar el job.
              print(f"AVISO: no se encontro ningun .txt para {tipo_reporte} -- "
                    "SUNAT no tiene comprobantes de este tipo en este periodo.")
              os.makedirs(os.path.dirname(ruta_csv_salida) or ".", exist_ok=True)
              open(ruta_csv_salida, "w").close()
              sys.exit(0)

          # SUNAT a veces devuelve VARIOS .txt dentro del mismo zip (distintos
          # sub-libros, ej. Registro de Compras vs Compras No Domiciliado) y solo
          # uno trae filas reales; el resto vienen vacios (solo cabecera o ni
          # eso). Elegir por fecha de modificacion no es confiable (todos se
          # extraen casi al mismo instante) - se leen TODOS los candidatos y se
          # usa el que tenga mas filas de datos.
          mejor_origen = mejor_filas = None
          for candidato in candidatos:
              with open(candidato, encoding="utf-8", errors="replace") as f:
                  filas_c = [l.rstrip("\n").rstrip("\r").split("|") for l in f if l.strip() != ""]
              print(f"  {candidato}: {max(len(filas_c) - 1, 0)} fila(s) de datos")
              if mejor_filas is None or len(filas_c) > len(mejor_filas):
                  mejor_origen, mejor_filas = candidato, filas_c

          origen, filas = mejor_origen, mejor_filas
          print(f"Usando archivo ({tipo_reporte}, el que tiene mas datos):", origen)
          print(f"DEBUG primera fila cruda ({len(filas[0]) if filas else 0} campos): {filas[0] if filas else []}")

          # No asumir si el .txt trae cabecera o no: SUNAT a veces la trae y
          # a veces no segun el endpoint (propuesta vs descarga oficial), y
          # eso puede variar entre compras y ventas o incluso entre
          # ejecuciones. Se detecta dinamicamente: la primera columna
          # siempre es el RUC propio (11 digitos) en una fila de DATOS; si la
          # primera fila NO es un RUC de 11 digitos, ya es una fila de
          # cabecera real de SUNAT y se usa tal cual (sin inventar nombres).
          primer_campo = (filas[0][0].strip() if filas and filas[0] else "")
          ya_tiene_header = not (primer_campo.isdigit() and len(primer_campo) == 11)
          print(f"DEBUG primer campo: {primer_campo!r} -> ya_tiene_header={ya_tiene_header}")

          # Ventas (RVIE): SUNAT SI trae cabecera real cuando el periodo
          # todavia no esta "presentado" (te devuelve la PROPUESTA, que
          # incluye una fila de encabezado -- ver el bug de BOM/case
          # corregido el 2026-08-19 en idx_de_ mas abajo). Pero cuando el
          # periodo YA esta presentado, te devuelve el registro oficial SIN
          # fila de encabezado (confirmado el 2026-08-18 con datos reales:
          # el primer campo es directamente el RUC numerico de 11 digitos).
          # Para ese caso sin encabezado se le pega esta cabecera sintetica
          # por posicion -- son los mismos 39 primeros nombres reales de la
          # propuesta (que trae 40 campos con "CLU" al final; el registro
          # oficial trae uno menos, sin ese ultimo campo), verificados el
          # 2026-08-19 contra la propuesta real de un periodo no presentado.
          # Solo se aplica cuando el numero de campos coincide exactamente
          # (39); si SUNAT cambia el formato, se omite en vez de adivinar mal.
          VENTAS_HEADERS = [
              "RUC", "Razon Social", "Periodo", "CAR SUNAT",
              "Fecha de emisión", "Fecha Vcto/Pago", "Tipo CP/Doc.", "Serie del CDP",
              "Nro CP o Doc. Nro Inicial (Rango)", "Nro Final (Rango)",
              "Tipo Doc Identidad", "Nro Doc Identidad", "Apellidos Nombres/ Razón Social",
              "Valor Facturado Exportación", "BI Gravada", "Dscto BI", "IGV / IPM",
              "Dscto IGV / IPM", "Mto Exonerado", "Mto Inafecto", "ISC",
              "BI Grav IVAP", "IVAP", "ICBPER", "Otros Tributos",
              "Total CP", "Moneda", "Tipo Cambio",
              "Fecha Emisión Doc Modificado", "Tipo CP Modificado", "Serie CP Modificado",
              "Nro CP Modificado", "ID Proyecto Operadores Atribución", "Tipo de Nota",
              "Est. Comp", "Valor FOB Embarcado", "Valor OP Gratuitas", "Tipo Operación",
              "DAM / CP",
          ]

          if not ya_tiene_header:
              if tipo_reporte == "venta" and filas and len(filas[0]) == len(VENTAS_HEADERS):
                  filas = [VENTAS_HEADERS] + filas
              else:
                  print(f"AVISO: el .txt de {tipo_reporte} no trae fila de cabecera y no se pudo "
                        "etiquetar con seguridad (numero de campos inesperado). Se omite para no "
                        "adivinar nombres de columna sin confirmar.")
                  open(ruta_csv_salida, "w").close()
                  sys.exit(0)

          os.makedirs(os.path.dirname(ruta_csv_salida) or ".", exist_ok=True)
          if len(filas) < 2:
              print(f"AVISO: {tipo_reporte} no tiene comprobantes en este periodo.")
              open(ruta_csv_salida, "w").close()
              sys.exit(0)

          with open(ruta_csv_salida, "w", newline="", encoding="utf-8") as out:
              csv.writer(out).writerows(filas)
          print(f"OK: {len(filas)-1} fila(s) de {tipo_reporte} en {ruta_csv_salida}")

          # ---- Agrega filas a facturas.csv (lo que necesita la descarga de PDF/XML) ----
          # Bug real encontrado el 2026-08-19: para el periodo del mes en curso
          # (todavia no "presentado"), SUNAT devuelve la PROPUESTA, que SI trae
          # cabecera real -- pero con un BOM pegado a la primera celda
          # ('﻿Ruc') y con otra capitalizacion ('Ruc' en vez de 'RUC') que
          # la del registro ya presentado. headers.index("RUC") tiraba
          # ValueError y tumbaba todo el job. Se busca por nombre normalizado
          # (sin BOM, sin espacios, sin importar mayus/minus) en vez de exigir
          # coincidencia exacta.
          def idx_de_(nombre):
              def normalizar(s):
                  return s.strip().lstrip("﻿").strip().lower()
              objetivo = normalizar(nombre)
              normados = [normalizar(h) for h in headers]
              if objetivo not in normados:
                  raise ValueError(f"Columna {nombre!r} no encontrada en la cabecera: {headers}")
              return normados.index(objetivo)

          headers = [h.strip().lstrip("﻿").strip() for h in filas[0]]
          idx_periodo = idx_de_("Periodo")
          idx_tipo_cp = idx_de_("Tipo CP/Doc.")
          idx_serie = idx_de_("Serie del CDP")
          idx_numero = idx_de_("Nro CP o Doc. Nro Inicial (Rango)")
          idx_ruc_propio = idx_de_("RUC")
          idx_ruc_contraparte = idx_de_("Nro Doc Identidad")

          # SIRE (Catalogo 01) -> codigo legacy que entiende la descarga de
          # PDF/XML (Emitidas=ventas, Recibidas=compras - ver mapear_codcpe).
          if tipo_reporte == "venta":
              TIPO_LEGACY = {"01": "10", "07": "13", "08": "15"}
          else:
              TIPO_LEGACY = {"01": "11", "07": "14", "08": "16"}

          existe_header = os.path.exists(ruta_facturas_csv) and os.path.getsize(ruta_facturas_csv) > 0
          with open(ruta_facturas_csv, "a", newline="", encoding="utf-8") as out:
              w = csv.writer(out)
              if not existe_header:
                  w.writerow(["tipo", "ruc_emisor", "serie", "numero", "fecha_desde", "fecha_hasta"])
              agregadas = no_soportadas = 0
              for fila in filas[1:]:
                  if len(fila) <= max(idx_periodo, idx_tipo_cp, idx_serie, idx_numero,
                                       idx_ruc_propio, idx_ruc_contraparte):
                      continue
                  tipo_cp = fila[idx_tipo_cp].strip()
                  serie = fila[idx_serie].strip()
                  numero = fila[idx_numero].strip()
                  periodo = fila[idx_periodo].strip()
                  # El "emisor" real del comprobante para la API de SUNAT: en
                  # compras es el proveedor (Nro Doc Identidad); en ventas
                  # somos nosotros mismos (columna RUC, constante).
                  if tipo_reporte == "venta":
                      ruc_emisor_real = fila[idx_ruc_propio].strip()
                  else:
                      ruc_emisor_real = fila[idx_ruc_contraparte].strip()
                  if not (serie and numero and ruc_emisor_real):
                      continue
                  tipo_legacy = TIPO_LEGACY.get(tipo_cp)
                  if not tipo_legacy:
                      no_soportadas += 1
                      continue
                  fecha_desde = fecha_hasta = ""
                  if len(periodo) == 6 and periodo.isdigit():
                      anio, mes = int(periodo[:4]), int(periodo[4:6])
                      ultimo_dia = calendar.monthrange(anio, mes)[1]
                      fecha_desde = f"01/{mes:02d}/{anio}"
                      fecha_hasta = f"{ultimo_dia:02d}/{mes:02d}/{anio}"
                  w.writerow([tipo_legacy, ruc_emisor_real, serie, numero, fecha_desde, fecha_hasta])
                  agregadas += 1
          print(f"OK: {agregadas} factura(s) de {tipo_reporte} agregadas a {ruta_facturas_csv} "
                f"({no_soportadas} no soportada(s) todavia)")
          PYEOF

          cat > /tmp/filtrar_pendientes.py << 'PYEOF'
          # Modo "solo reintentar fallidas": no vuelve a pedirle nada a SUNAT.
          # Cruza el facturas.csv completo del ultimo run guardado (ya viene
          # en el checkout, se sobreescribe con la version filtrada) contra
          # el resumen.txt de ese mismo run, y deja solo las filas cuyo
          # comprobante NO quedo en OK/YA-DESCARGADO la vez anterior.
          import csv, sys, os

          ruta_resumen, ruta_facturas = sys.argv[1:3]

          if not os.path.exists(ruta_facturas) or os.path.getsize(ruta_facturas) == 0:
              print(f"ERROR: no hay {ruta_facturas} de un run anterior. Corre primero en modo 'completo'.")
              sys.exit(1)

          resumen_ok = set()
          if os.path.exists(ruta_resumen):
              with open(ruta_resumen, encoding="utf-8") as f:
                  for r in csv.DictReader(f):
                      if (r.get("estado_pdf") or "").strip() in ("OK-oficial", "OK-representacion", "YA-DESCARGADO"):
                          resumen_ok.add(r["factura"])

          with open(ruta_facturas, encoding="utf-8") as f:
              filas = list(csv.reader(f))
          if len(filas) < 2:
              print("No hay facturas guardadas de un run anterior, nada que reintentar.")
              open(ruta_facturas, "w").close()
              sys.exit(0)

          headers = filas[0]
          idx_serie, idx_numero = headers.index("serie"), headers.index("numero")
          pendientes = [headers] + [
              fila for fila in filas[1:]
              if len(fila) > max(idx_serie, idx_numero)
              and f"{fila[idx_serie]}-{fila[idx_numero]}" not in resumen_ok
          ]

          with open(ruta_facturas, "w", newline="", encoding="utf-8") as out:
              csv.writer(out).writerows(pendientes)
          print(f"OK: {len(pendientes) - 1} factura(s) pendiente(s) de {len(filas) - 1} totales del ultimo run.")
          PYEOF

          if [ "$MODO" = "solo-reintentar-fallidas" ]; then
            echo "########## [$RUC] Modo solo-reintentar-fallidas: NO se vuelve a pedir el reporte SIRE a SUNAT ##########"
            if [ ! -s "$RUTA_COMPRAS_CSV" ] && [ ! -s "$RUTA_VENTAS_CSV" ]; then
              echo "ERROR: no hay un reporte SIRE guardado para $RUC todavia. Corre primero una vez en modo 'completo'."
              exit 1
            fi
            python3 /tmp/filtrar_pendientes.py "$DIR_DESCARGAS/resumen.txt" "$FACTURAS_CSV"
          else
            SELECCION="${{ steps.tipos.outputs.valor }}"
            if [ "$SELECCION" = "ambos" ]; then
              TIPOS=(compra venta)
            else
              TIPOS=("$SELECCION")
            fi
            echo "Tipos a descargar: ${TIPOS[*]}"

            rm -f "$FACTURAS_CSV"
            mkdir -p "$(dirname "$FACTURAS_CSV")"

            for T in "${TIPOS[@]}"; do
              echo ""
              echo "########## [$RUC] Descargando SIRE - $T (periodo ${{ steps.periodo.outputs.valor }}) ##########"
              rm -rf "sire/$RUC/$T" "sire/$RUC/extraido_$T"
              mkdir -p "sire/$RUC/$T" "sire/$RUC/extraido_$T"

              # Se redirige a un archivo (en vez de solo mostrarlo en pantalla)
              # para poder leer despues la linea "MODO_DESCARGA=..." que
              # imprime sire_client.py -- indica si lo que bajo fue la
              # PROPUESTA o el registro ya ACEPTADO/presentado, para poder
              # guardar el .zip crudo rotulado correctamente mas abajo. Se usa
              # un archivo en vez de un pipe a tee para no perder el exit code
              # real de sire_client.py (con un pipe, "set -e" solo mira el
              # exit code del ULTIMO comando del pipe, no de python3).
              #
              # OJO: "set +e"/"set -e" alrededor es necesario -- sin esto,
              # si sire_client.py fallaba, "set -e" cortaba el step EN ESA
              # MISMA linea, antes de llegar al "cat" de aca abajo, y el
              # log quedaba con "exit code 1" sin ningun detalle del error
              # real (paso de verdad, corrida del 2026-08-19 23:11 con la
              # empresa BKF, RUC 20609309793).
              set +e
              python3 scripts/sire_client.py \
                --ruc "$SUNAT_RUC" \
                --usuario-sol "$SUNAT_USUARIO" \
                --clave-sol "$SUNAT_CLAVE" \
                --client-id "$SIRE_CLIENT_ID" \
                --client-secret "$SIRE_CLIENT_SECRET" \
                --periodo "${{ steps.periodo.outputs.valor }}" \
                --tipo "$T" \
                --formato txt \
                --out-dir "sire/$RUC/$T" > "/tmp/salida_sire_$T.log" 2>&1
              EXIT_SIRE=$?
              set -e
              cat "/tmp/salida_sire_$T.log"
              if [ "$EXIT_SIRE" -ne 0 ]; then
                echo "ERROR: sire_client.py fallo (exit $EXIT_SIRE) para $RUC / $T. Ver el detalle arriba."
                exit "$EXIT_SIRE"
              fi
              MODO_DESCARGA=$(grep -oE 'MODO_DESCARGA=[a-zA-Z]+' "/tmp/salida_sire_$T.log" | tail -1 | cut -d= -f2)

              echo "Contenido descargado ($T, modo=$MODO_DESCARGA):"
              find "sire/$RUC/$T" -maxdepth 1 -type f

              ZIP=$(find "sire/$RUC/$T" -maxdepth 1 -type f -iname "*.zip" | head -1)
              if [ -n "$ZIP" ]; then
                unzip -o "$ZIP" -d "sire/$RUC/extraido_$T/"

                # Copia del .zip crudo (tal cual lo entrega SUNAT) en la
                # carpeta historica del periodo, rotulada segun el modo --
                # "Propuesta_<tipo>.zip" o "Aceptada_<tipo>.zip". Se
                # sobreescribe a si misma en cada corrida (no se acumulan
                # copias viejas de la MISMA version); las dos conviven porque
                # tienen nombre distinto.
                case "$MODO_DESCARGA" in
                  oficial) NOMBRE_ZIP_HIST="Aceptada_$T.zip" ;;
                  propuesta) NOMBRE_ZIP_HIST="Propuesta_$T.zip" ;;
                  *) NOMBRE_ZIP_HIST="" ;;
                esac
                if [ -n "$NOMBRE_ZIP_HIST" ]; then
                  mkdir -p "$DIR_HISTORICO/${{ steps.periodo.outputs.valor }}"
                  cp "$ZIP" "$DIR_HISTORICO/${{ steps.periodo.outputs.valor }}/$NOMBRE_ZIP_HIST"
                fi
              else
                cp "sire/$RUC/$T"/*.txt "sire/$RUC/extraido_$T/" 2>/dev/null || true
              fi
              echo "Extraido ($T):"
              find "sire/$RUC/extraido_$T" -type f

              if [ "$T" = "compra" ]; then
                RUTA_CSV="$RUTA_COMPRAS_CSV"
              else
                RUTA_CSV="$RUTA_VENTAS_CSV"
              fi
              python3 /tmp/convertir_sire.py "$T" "$RUTA_CSV" "$FACTURAS_CSV" "$RUC"
            done
          fi

          echo ""
          echo "=== facturas.csv ($RUC, modo $MODO) ==="
          cat "$FACTURAS_CSV" 2>/dev/null || echo "(vacio)"

      - name: Crear script de decodificacion (PDF/XML de la API moderna)
        run: |
          cat > /tmp/decode_api.py << 'PYEOF'
          import sys, json, base64, zipfile, io, os, re
          d = json.load(open(sys.argv[1]))
          destdir = sys.argv[2]
          modo = sys.argv[3]  # "raw" (deja el .zip tal cual) o "extract" (saca el archivo de adentro)
          raw = base64.b64decode(d['valArchivo'])
          nom_zip = d.get('nomArchivo', 'archivo.zip')

          if modo == 'raw':
              nombre = nom_zip
              open(os.path.join(destdir, nombre), 'wb').write(raw)
              print(nombre)
          else:
              zf = zipfile.ZipFile(io.BytesIO(raw))
              names = zf.namelist()
              if names:
                  interno = names[0]
                  ext = os.path.splitext(interno)[1]
                  base = re.sub(r'-(PDF|XML)\.zip$', '', nom_zip, flags=re.IGNORECASE)
                  nombre = base + ext
                  open(os.path.join(destdir, nombre), 'wb').write(zf.read(interno))
                  print(nombre)
          PYEOF

          cat > /tmp/migrar_estructura.py << 'PYEOF'
          # Migra facturas_descargadas/<RUC>/oficial|representacion/... (estructura
          # plana de antes) a facturas_descargadas/<RUC>/<anio>/compra-o-venta/
          # <periodo>/oficial|representacion/..., para no perder ni duplicar lo
          # que ya se habia descargado al pasar a la estructura ordenada.
          import csv, os, shutil, sys

          dir_descargas, ruta_facturas_csv = sys.argv[1:3]

          TIPO_A_CODCPE = {"10": "01", "11": "01", "13": "F7", "14": "F7", "15": "F8", "16": "F8"}
          TIPO_A_CATEGORIA = {"10": "venta", "13": "venta", "15": "venta"}

          def carpeta_de(tipo, fecha_desde):
              categoria = TIPO_A_CATEGORIA.get(tipo, "compra")
              if len(fecha_desde) == 10:
                  anio, periodo = fecha_desde[6:10], fecha_desde[6:10] + fecha_desde[3:5]
              else:
                  anio, periodo = "sin-fecha", "sin-periodo"
              return os.path.join(dir_descargas, anio, categoria, periodo)

          filas = []
          if os.path.exists(ruta_facturas_csv):
              with open(ruta_facturas_csv, encoding="utf-8") as f:
                  filas = list(csv.DictReader(f))

          movidos = 0
          dir_oficial_viejo = os.path.join(dir_descargas, "oficial")
          dir_repr_viejo = os.path.join(dir_descargas, "representacion")

          if os.path.isdir(dir_oficial_viejo):
              for nombre in os.listdir(dir_oficial_viejo):
                  destino_carpeta = None
                  for fila in filas:
                      codcpe = TIPO_A_CODCPE.get(fila["tipo"], "")
                      id_base = f"{fila['ruc_emisor']}-{codcpe}-{fila['serie']}-{fila['numero']}"
                      if nombre.startswith(id_base):
                          destino_carpeta = os.path.join(carpeta_de(fila["tipo"], fila["fecha_desde"]), "oficial")
                          break
                  if destino_carpeta is None:
                      destino_carpeta = os.path.join(dir_descargas, "sin-fecha", "compra", "sin-periodo", "oficial")
                  os.makedirs(destino_carpeta, exist_ok=True)
                  shutil.move(os.path.join(dir_oficial_viejo, nombre), os.path.join(destino_carpeta, nombre))
                  movidos += 1
              shutil.rmtree(dir_oficial_viejo, ignore_errors=True)

          if os.path.isdir(dir_repr_viejo):
              for nombre in os.listdir(dir_repr_viejo):
                  base = nombre[:-4] if nombre.lower().endswith(".pdf") else nombre
                  destino_carpeta = None
                  for fila in filas:
                      if f"{fila['serie']}-{fila['numero']}" == base:
                          destino_carpeta = os.path.join(carpeta_de(fila["tipo"], fila["fecha_desde"]), "representacion")
                          break
                  if destino_carpeta is None:
                      destino_carpeta = os.path.join(dir_descargas, "sin-fecha", "compra", "sin-periodo", "representacion")
                  os.makedirs(destino_carpeta, exist_ok=True)
                  shutil.move(os.path.join(dir_repr_viejo, nombre), os.path.join(destino_carpeta, nombre))
                  movidos += 1
              shutil.rmtree(dir_repr_viejo, ignore_errors=True)

          ruta_resumen_vieja = os.path.join(dir_descargas, "resumen.txt")
          if os.path.exists(ruta_resumen_vieja):
              os.remove(ruta_resumen_vieja)  # se vuelve a generar de cero mas abajo, ya con las rutas nuevas

          print(f"OK: {movidos} archivo(s) migrado(s) a la estructura por año/compra-venta/periodo.")
          PYEOF

      - name: Login + procesar lista de facturas (generadas del SIRE)
        if: matrix.empresa.modalidad_descarga != 'sire'
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          CID="4f3b88b3-d9d6-402a-b85d-6a0bc857746a"
          SEC="https://api-seguridad.sunat.gob.pe/v1/clientessol/$CID/oauth2"
          ORIG="https://e-menu.sunat.gob.pe/cl-ti-itmenu/AutenticaMenuInternet.htm"
          MENU="https://e-menu.sunat.gob.pe/cl-ti-itmenu/MenuInternet.htm"
          CD="https://ww1.sunat.gob.pe/ol-ti-itconscpegem/consultar.do"
          API="https://api-cpe.sunat.gob.pe/v1/contribuyente/consultacpe/comprobantes"
          STATE='rO0ABXNyABFqYXZhLnV0aWwuSGFzaE1hcAUH2sHDFmDRAwACRgAKbG9hZEZhY3RvckkACXRocmVzaG9sZHhwP0AAAAAAAAx3CAAAABAAAAADdAADZXhlcHQABnBhcmFtc3QASyomKiYvY2wtdGktaXRtZW51L01lbnVJbnRlcm5ldC5odG0mYjY0ZDI2YThiNWFmMDkxOTIzYjIzYjY0MDdhMWMxZGI0MWU3MzNhNnQABGV4ZWNweA=='
          JAR=jar.txt
          set -e

          echo "=== LOGIN ==="
          curl -sS -c "$JAR" -b "$JAR" --max-time 20 -A "$UA" \
            "$SEC/loginMenuSol?lang=es-PE&showDni=true&showLanguages=false&originalUrl=$ORIG&state=$STATE" -o /dev/null
          curl -sS -c "$JAR" -b "$JAR" --max-time 25 -A "$UA" -L \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "tipo=2" --data-urlencode "dni=" \
            --data-urlencode "custom_ruc=$SUNAT_RUC" --data-urlencode "j_username=$SUNAT_USUARIO" \
            --data-urlencode "j_password=$SUNAT_CLAVE" --data-urlencode "captcha=" \
            --data-urlencode "originalUrl=$ORIG" --data-urlencode "state=$STATE" \
            "$SEC/j_security_check" -o login.html
          if ! grep -q "Men" login.html; then
            echo "!! LOGIN FALLIDO"; exit 1
          fi
          echo "Login OK."

          echo "=== Obteniendo token de la API moderna (XML/PDF oficiales) ==="
          curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o /dev/null
          EXEC_LOC=$(curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D - -o /dev/null \
            "$MENU?action=execute&code=11.38.1.1.1" | grep -i "^location:" | sed 's/[Ll]ocation: //' | tr -d '\r')
          API_TOKEN=$(echo "$EXEC_LOC" | grep -oE 'token=[^&]*' | cut -d= -f2)
          if [ -z "$API_TOKEN" ]; then
            echo "AVISO: no se pudo obtener el token de la API moderna. Solo se usara el metodo clasico."
          else
            echo "Token moderno obtenido (${#API_TOKEN} caracteres)."
          fi

          if [ ! -s "$FACTURAS_CSV" ] || [ $(wc -l < "$FACTURAS_CSV") -le 1 ]; then
            echo "$FACTURAS_CSV esta vacio (nada soportado en este periodo). Nada que descargar."
            exit 0
          fi

          set +e
          mkdir -p "$DIR_DESCARGAS"
          # Limpia los restos de la estructura plana anterior (antes de
          # ordenar por año/compra-venta/periodo), para no dejar duplicados
          # ni volver a descargar de SUNAT lo que ya estaba: se migran al
          # lugar que les toca en la estructura nueva antes de continuar.
          if [ -d "$DIR_DESCARGAS/oficial" ] || [ -d "$DIR_DESCARGAS/representacion" ]; then
            echo "Migrando estructura plana anterior de $DIR_DESCARGAS a año/compra-venta/periodo..."
            python3 /tmp/migrar_estructura.py "$DIR_DESCARGAS" "$FACTURAS_CSV"
          fi
          rm -rf /tmp/estado; mkdir -p /tmp/estado
          # CHROMIUM_BIN lo deja el paso "Ubicar Chromium" (normalmente el
          # Chrome que ya viene en el runner). El find es solo por si acaso.
          CHROMIUM="${CHROMIUM_BIN:-$(find ~/.cache/ms-playwright -name "chrome" -path "*chrome-linux*" 2>/dev/null | head -1)}"

          mapear_codcpe() {
            case "$1" in
              10) echo "01 1" ;;
              11) echo "01 2" ;;
              13) echo "F7 1" ;;
              14) echo "F7 2" ;;
              15) echo "F8 1" ;;
              16) echo "F8 2" ;;
              *) echo "" ;;
            esac
          }
          export -f mapear_codcpe

          # Carpeta destino ordenada por RUC (ya la da $DIR_DESCARGAS) / año /
          # compra-o-venta / periodo (AAAAMM), usando el mismo tipo legacy
          # (10/13/15=venta, 11/14/16=compra) y la fecha_desde ya calculada
          # en convertir_sire.py (01/MM/AAAA -> AAAAMM).
          computar_carpeta_destino() {
            local tipo="$1" fec_desde="$2" categoria anio periodo
            case "$tipo" in
              10|13|15) categoria="venta" ;;
              *) categoria="compra" ;;
            esac
            if [ ${#fec_desde} -eq 10 ]; then
              periodo="${fec_desde:6:4}${fec_desde:3:2}"
              anio="${fec_desde:6:4}"
            else
              anio="sin-fecha"
              periodo="sin-periodo"
            fi
            echo "$categoria $anio $periodo"
          }
          export -f computar_carpeta_destino

          descargar_api_moderna() {
            id="$1"; accion="$2"; destdir="$3"; modo="$4"; resp_file="$5"
            for intento in 1 2 3 4 5; do
              curl -sS -H "Authorization: Bearer $API_TOKEN" \
                -H "Accept: application/json, text/plain, */*" \
                -H "Origin: https://e-factura.sunat.gob.pe" \
                -H "Referer: https://e-factura.sunat.gob.pe/" \
                -A "$UA" "$API/$id/$accion?formato=x" -o "$resp_file"
              if grep -q '"valArchivo"' "$resp_file"; then
                nombre=$(python3 /tmp/decode_api.py "$resp_file" "$destdir" "$modo" 2>/dev/null)
                if [ -n "$nombre" ] && [ -f "$destdir/$nombre" ]; then
                  echo "$nombre"
                  return 0
                fi
              fi
              sleep 4
            done
            return 1
          }
          export -f descargar_api_moderna
          export API_TOKEN UA API

          procesar_linea() {
            linea="$1"
            IFS=',' read -r tipo ruc_emisor serie numero fec_desde fec_hasta <<< "$linea"
            tipo=$(echo "$tipo" | tr -d '\r' | xargs)
            ruc_emisor=$(echo "$ruc_emisor" | tr -d '\r' | xargs)
            serie=$(echo "$serie" | tr -d '\r' | xargs)
            numero=$(echo "$numero" | tr -d '\r' | xargs)
            fec_desde=$(echo "$fec_desde" | tr -d '\r' | xargs)
            fec_hasta=$(echo "$fec_hasta" | tr -d '\r' | xargs)
            [ -z "$tipo" ] && return

            base="${serie}-${numero}"
            base_safe=$(echo "$base" | tr '/' '_')
            estado_file="/tmp/estado/${base_safe}.csv"

            read -r categoria anio periodo_carpeta <<< "$(computar_carpeta_destino "$tipo" "$fec_desde")"
            carpeta_rel="$anio/$categoria/$periodo_carpeta"
            carpeta_base="$DIR_DESCARGAS/$carpeta_rel"
            mkdir -p "$carpeta_base/oficial" "$carpeta_base/representacion"

            echo "=== Procesando $base (tipo=$tipo, emisor=$ruc_emisor, carpeta=$carpeta_rel) ==="

            estado_pdf="pendiente"
            estado_xml="no-disponible"
            archivo_pdf=""
            archivo_xml=""

            read -r codcpe direccion <<< "$(mapear_codcpe "$tipo")"

            if [ -n "$codcpe" ]; then
              id="${ruc_emisor}-${codcpe}-${serie}-${numero}"

              if [ -f "$carpeta_base/oficial/${id}.pdf" ]; then
                estado_pdf="YA-DESCARGADO"; archivo_pdf="$carpeta_rel/oficial/${id}.pdf"
              elif [ -f "$carpeta_base/representacion/${base}.pdf" ]; then
                estado_pdf="YA-DESCARGADO"; archivo_pdf="$carpeta_rel/representacion/${base}.pdf"
              fi
              if [ -f "$carpeta_base/oficial/${id}-XML.zip" ]; then
                estado_xml="YA-DESCARGADO"; archivo_xml="$carpeta_rel/oficial/${id}-XML.zip"
              fi

              id_api="${id}-${direccion}"

              if [ "$METODO_PDF" != "clasico" ] && [ -z "$archivo_xml" ] && [ -n "$API_TOKEN" ]; then
                nombre_xml=$(descargar_api_moderna "$id_api" "02" "$carpeta_base/oficial" "raw" "/tmp/api_resp_${base_safe}_xml.json")
                if [ -n "$nombre_xml" ]; then
                  estado_xml="OK"; archivo_xml="$carpeta_rel/oficial/$nombre_xml"
                fi
              fi

              if [ "$METODO_PDF" != "clasico" ] && [ -z "$archivo_pdf" ] && [ -n "$API_TOKEN" ]; then
                nombre_pdf=$(descargar_api_moderna "$id_api" "01" "$carpeta_base/oficial" "extract" "/tmp/api_resp_${base_safe}_pdf.json")
                if [ -n "$nombre_pdf" ]; then
                  estado_pdf="OK-oficial"; archivo_pdf="$carpeta_rel/oficial/$nombre_pdf"
                fi
              fi
            else
              if [ -f "$carpeta_base/representacion/${base}.pdf" ]; then
                estado_pdf="YA-DESCARGADO"; archivo_pdf="$carpeta_rel/representacion/${base}.pdf"
              fi
            fi

            if [ -n "$archivo_pdf" ]; then necesita_fallback=0; else necesita_fallback=1; fi
            echo "$estado_pdf,$estado_xml,$archivo_pdf,$archivo_xml,$necesita_fallback" > "$estado_file"
          }
          export -f procesar_linea

          tail -n +2 "$FACTURAS_CSV" | xargs -P 5 -I {} bash -c 'procesar_linea "$1"' _ {}

          echo ""
          echo "=== Fallback clasico (representacion impresa) para lo que quedo pendiente ==="
          tail -n +2 "$FACTURAS_CSV" | while IFS=',' read -r tipo ruc_emisor serie numero fec_desde fec_hasta; do
            tipo=$(echo "$tipo" | tr -d '\r' | xargs)
            ruc_emisor=$(echo "$ruc_emisor" | tr -d '\r' | xargs)
            serie=$(echo "$serie" | tr -d '\r' | xargs)
            numero=$(echo "$numero" | tr -d '\r' | xargs)
            fec_desde=$(echo "$fec_desde" | tr -d '\r' | xargs)
            fec_hasta=$(echo "$fec_hasta" | tr -d '\r' | xargs)
            [ -z "$tipo" ] && continue
            base="${serie}-${numero}"
            base_safe=$(echo "$base" | tr '/' '_')
            estado_file="/tmp/estado/${base_safe}.csv"
            [ -f "$estado_file" ] || continue
            IFS=',' read -r estado_pdf estado_xml archivo_pdf archivo_xml necesita_fallback < "$estado_file"
            [ "$necesita_fallback" != "1" ] && continue
            [ "$METODO_PDF" = "moderna" ] && continue  # forzado solo-moderna: no usar el respaldo clasico

            read -r categoria anio periodo_carpeta <<< "$(computar_carpeta_destino "$tipo" "$fec_desde")"
            carpeta_rel="$anio/$categoria/$periodo_carpeta"
            carpeta_base="$DIR_DESCARGAS/$carpeta_rel"
            mkdir -p "$carpeta_base/representacion"

            echo "  Fallback clasico para $base ($carpeta_rel)..."
            curl -sS -A "$UA" -c "$JAR" -b "$JAR" --data "action=prevApp" "$MENU" -o /dev/null
            LOC=$(curl -sS -A "$UA" -c "$JAR" -b "$JAR" -D - -o /dev/null \
              "$MENU?action=execute&code=11.9.5.1.1" | grep -i "^location:" | sed 's/[Ll]ocation: //' | tr -d '\r')
            if [ -n "$LOC" ]; then
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" "$LOC" -o /dev/null
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                --data "action=realizarConsulta" --data "buscarPor=porDoc" --data "tipoConsulta=$tipo" \
                --data "rucEmisor=$ruc_emisor" --data "serie=$serie" --data "numero=$numero" --data "numDocideRecep=" \
                --data-urlencode "fecDesde=$fec_desde" --data-urlencode "fecHasta=$fec_hasta" \
                "$CD" -o query.txt
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                "$CD?action=mostrarListado&tipoConsulta=$tipo" -o /dev/null
              curl -sS -A "$UA" -c "$JAR" -b "$JAR" -H "Referer: $CD" \
                "$CD?action=verImprimirFactura&rowIndex=0" -o "factura_${base_safe}.html"

              if grep -qi "COMPROBANTE" "factura_${base_safe}.html"; then
                sed -i '/no tiene la validez de una/d' "factura_${base_safe}.html"
                "$CHROMIUM" --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
                  --print-to-pdf="$carpeta_base/representacion/${base}.pdf" "file://$(realpath "factura_${base_safe}.html")" 2>/dev/null
                if [ -f "$carpeta_base/representacion/${base}.pdf" ]; then
                  estado_pdf="OK-representacion"; archivo_pdf="$carpeta_rel/representacion/${base}.pdf"
                fi
              fi
            fi
            [ "$estado_pdf" == "pendiente" ] && estado_pdf="FALLO"
            echo "$estado_pdf,$estado_xml,$archivo_pdf,$archivo_xml,0" > "$estado_file"
          done

          echo "factura,estado_pdf,estado_xml,archivo_pdf,archivo_xml" > "$DIR_DESCARGAS/resumen.txt"
          tail -n +2 "$FACTURAS_CSV" | while IFS=',' read -r tipo ruc_emisor serie numero fec_desde fec_hasta; do
            tipo=$(echo "$tipo" | tr -d '\r' | xargs)
            serie=$(echo "$serie" | tr -d '\r' | xargs)
            numero=$(echo "$numero" | tr -d '\r' | xargs)
            [ -z "$tipo" ] && continue
            base="${serie}-${numero}"
            base_safe=$(echo "$base" | tr '/' '_')
            estado_file="/tmp/estado/${base_safe}.csv"
            [ -f "$estado_file" ] || continue
            IFS=',' read -r estado_pdf estado_xml archivo_pdf archivo_xml necesita_fallback < "$estado_file"
            [ "$estado_pdf" == "pendiente" ] && estado_pdf="FALLO"
            echo "$base,$estado_pdf,$estado_xml,$archivo_pdf,$archivo_xml" >> "$DIR_DESCARGAS/resumen.txt"
          done

          echo ""
          echo "=== RESUMEN ==="
          cat "$DIR_DESCARGAS/resumen.txt"
          # (ya se escribe directo en $DIR_DESCARGAS/resumen.txt, no hace falta copiar)

      - name: Subir PDF/XML a Cloudflare R2 (opcional, solo si la empresa lo activa)
        # 100% opcional -- si "subir_pdf_r2" no esta en true para esta empresa
        # en empresas.json, este paso ni se ejecuta. Y si esta en true pero
        # todavia no se configuraron los secrets de R2, se omite solo con un
        # aviso (no rompe el resto del run) -- el proyecto sigue funcionando
        # normal sin esto, es un extra para poder compartir el link de cada
        # PDF/XML sin abrir el repo privado de GitHub.
        #
        # Sube cada archivo a la MISMA ruta relativa que ya tiene en el repo
        # (bajo un prefijo con el RUC), asi Google Sheets puede armar el link
        # publico sin tener que preguntarle nada a este workflow -- solo
        # necesita saber la URL base del bucket (se configura una sola vez en
        # la hoja, ver GitHubSync.gs / Config.gs).
        if: always() && matrix.empresa.subir_pdf_r2 == true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "AVISO: subir_pdf_r2 esta en true para $RUC, pero faltan uno o mas secrets de R2"
            echo "(R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET en Settings > Secrets)."
            echo "Se omite la subida -- el resto del pipeline sigue normal."
            exit 0
          fi
          if [ ! -s "$DIR_DESCARGAS/resumen.txt" ]; then
            echo "No hay resumen.txt (nada se descargo en esta corrida) -- nada que subir a R2."
            exit 0
          fi

          pip install --quiet boto3

          cat > /tmp/subir_r2.py << 'PYEOF'
          import boto3, csv, os, sys

          ruc, dir_descargas = sys.argv[1:3]
          resumen_path = os.path.join(dir_descargas, "resumen.txt")

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
          )
          bucket = os.environ["R2_BUCKET"]

          def content_type(nombre):
              n = nombre.lower()
              if n.endswith(".pdf"):
                  return "application/pdf"
              if n.endswith(".zip"):
                  return "application/zip"
              if n.endswith(".xml"):
                  return "application/xml"
              return "application/octet-stream"

          subidos = errores = 0
          with open(resumen_path, newline="", encoding="utf-8") as f:
              for fila in csv.DictReader(f):
                  for campo in ("archivo_pdf", "archivo_xml"):
                      rel = (fila.get(campo) or "").strip()
                      if not rel:
                          continue
                      local = os.path.join(dir_descargas, rel)
                      if not os.path.isfile(local):
                          continue
                      key = f"{ruc}/{rel}"
                      try:
                          s3.upload_file(local, bucket, key, ExtraArgs={"ContentType": content_type(rel)})
                          subidos += 1
                      except Exception as e:
                          print(f"  ERROR subiendo {rel}: {e}")
                          errores += 1

          print(f"OK: {subidos} archivo(s) subido(s) a R2 (bucket {bucket}, prefijo {ruc}/)."
                + (f" {errores} error(es)." if errores else ""))
          PYEOF
          python3 /tmp/subir_r2.py "$RUC" "$DIR_DESCARGAS"

      - name: Generar tablas completas (markdown) de compras y ventas
        if: always() && matrix.empresa.generar_markdown == true
        run: |
          cat > /tmp/generar_md.py << 'PYEOF'
          import csv, os, sys, textwrap

          # argv: ruc  ruta_compras_csv  doc_compras_md  ruta_ventas_csv  doc_ventas_md
          RUC, RUTA_COMPRAS_CSV, DOC_COMPRAS_MD, RUTA_VENTAS_CSV, DOC_VENTAS_MD = sys.argv[1:6]

          RAMA = os.environ.get("GITHUB_REF_NAME", "claude/python-codes-izve18")
          BASE_GH = f"https://github.com/Aquivan/Claude/blob/{RAMA}/facturas_descargadas/{RUC}/"
          RUTA_RESUMEN = f"facturas_descargadas/{RUC}/resumen.txt"

          # Compras (RCE): el .txt de SUNAT SI trae cabecera con nombres
          # reales. Se omiten las columnas que siempre llegan vacias (Año,
          # Nro Final Rango, COD. DAM O DSI, Clasif de Bss y Sss,
          # ID Proyecto Operadores, PorcPart, CAR Orig/Ind E o I, CLU1..CLU39).
          COLUMNAS_COMPRAS = [
              "RUC", "Apellidos y Nombres o Razón social", "Periodo", "CAR SUNAT",
              "Fecha de emisión", "Fecha Vcto/Pago", "Tipo CP/Doc.", "Serie del CDP",
              "Nro CP o Doc. Nro Inicial (Rango)", "Tipo Doc Identidad", "Nro Doc Identidad",
              "Apellidos Nombres/ Razón  Social", "BI Gravado DG", "IGV / IPM DG",
              "BI Gravado DGNG", "IGV / IPM DGNG", "BI Gravado DNG", "IGV / IPM DNG",
              "Valor Adq. NG", "ISC", "ICBPER", "Otros Trib/ Cargos", "Total CP", "Moneda",
              "Tipo de Cambio", "Fecha Emisión Doc Modificado", "Tipo CP Modificado",
              "Serie CP Modificado", "Nro CP Modificado", "IMB", "Detracción",
              "Tipo de Nota", "Est. Comp.", "Incal",
          ]

          # Ventas (RVIE): el .txt de SUNAT NO trae cabecera (verificado
          # 2026-08-18) - se le puso una cabecera sintetica por posicion en
          # convertir_sire.py. Los campos "Campo N (SUNAT)" son posiciones
          # cuyo nombre oficial no se pudo confirmar (siempre 0 en los datos
          # vistos); se muestran igual para no ocultar montos por si algun
          # periodo si los usa. Se omite solo "Nro Final (Rango)", confirmado
          # siempre vacio igual que en compras.
          COLUMNAS_VENTAS = [
              "RUC", "Apellidos y Nombres o Razón social", "Periodo", "CAR SUNAT",
              "Fecha de emisión", "Fecha Vcto/Pago", "Tipo CP/Doc.", "Serie del CDP",
              "Nro CP o Doc. Nro Inicial (Rango)", "Tipo Doc Identidad", "Nro Doc Identidad",
              "Apellidos Nombres/ Razón  Social",
              "Campo 14 (SUNAT)", "BI Gravada", "Campo 16 (SUNAT)", "IGV / IPM",
              "Campo 18 (SUNAT)", "Monto Exonerado", "Campo 20 (SUNAT)", "Campo 21 (SUNAT)",
              "Campo 22 (SUNAT)", "Campo 23 (SUNAT)", "Campo 24 (SUNAT)",
              "Total CP", "Moneda", "Tipo de Cambio",
              "Fecha Emisión Doc Modificado", "Tipo CP Modificado",
              "Serie CP Modificado", "Nro CP Modificado",
          ]

          def esc(v):
              return (v or "").replace("|", "\\|").replace("\n", " ").strip()

          def significados(contraparte):
              base = "Campo de SUNAT del reporte de ventas cuyo nombre oficial no se pudo confirmar contra el manual (siempre 0 en los datos vistos hasta ahora; se muestra tal cual, sin interpretar, por si algun periodo lo usa)."
              d = {
                  "RUC": "RUC de la empresa que descarga el reporte",
                  "Apellidos y Nombres o Razón social": "Razón social de la empresa que descarga el reporte",
                  "Periodo": "Periodo tributario AAAAMM",
                  "CAR SUNAT": "Código Único de Registro del comprobante en el libro electrónico",
                  "Fecha de emisión": "Fecha de emisión del comprobante",
                  "Fecha Vcto/Pago": "Fecha de vencimiento o pago pactada (si aplica)",
                  "Tipo CP/Doc.": "Código de tipo de comprobante (Catálogo 01 SUNAT: `01`=Factura, `07`=Nota de Crédito, `08`=Nota de Débito)",
                  "Serie del CDP": "Serie del comprobante",
                  "Nro CP o Doc. Nro Inicial (Rango)": "Número del comprobante",
                  "Tipo Doc Identidad": f"Tipo de documento del {contraparte} (`6`=RUC)",
                  "Nro Doc Identidad": f"RUC del {contraparte}",
                  "Apellidos Nombres/ Razón  Social": f"Razón social o nombre del {contraparte}",
                  "Total CP": "Importe total del comprobante",
                  "Moneda": "Código de moneda (`PEN`=soles)",
                  "Tipo de Cambio": "Tipo de cambio aplicado",
                  "Fecha Emisión Doc Modificado": "Fecha de emisión del comprobante que la nota modifica (solo notas)",
                  "Tipo CP Modificado": "Tipo del comprobante modificado (solo notas)",
                  "Serie CP Modificado": "Serie del comprobante modificado (solo notas)",
                  "Nro CP Modificado": "Número del comprobante modificado (solo notas)",
                  # Compras (RCE)
                  "BI Gravado DG": "Base imponible gravada — Destino Gravado",
                  "IGV / IPM DG": "IGV de la base gravada DG",
                  "BI Gravado DGNG": "Base imponible — Destino Gravado y No Gravado (uso mixto)",
                  "IGV / IPM DGNG": "IGV de la base DGNG",
                  "BI Gravado DNG": "Base imponible — Destino No Gravado",
                  "IGV / IPM DNG": "IGV de la base DNG",
                  "Valor Adq. NG": "Valor de adquisición No Gravado (exonerado/inafecto)",
                  "ISC": "Impuesto Selectivo al Consumo",
                  "ICBPER": "Impuesto a las bolsas plásticas",
                  "Otros Trib/ Cargos": "Otros tributos o cargos del comprobante",
                  "IMB": "Campo de uso interno de SUNAT (siempre `0.00` en los reportes observados)",
                  "Detracción": "`D` = comprobante con detracción, vacío = sin detracción",
                  "Tipo de Nota": "Motivo de la nota de crédito/débito (Catálogo 09 SUNAT), solo en notas",
                  "Est. Comp.": "Estado del comprobante en el libro (`1` = vigente)",
                  "Incal": "Indicador de comprobante observado por SUNAT (`0` = sin observación)",
                  # Ventas (RVIE) - posiciones confirmadas algebraicamente
                  # (BI Gravada + IGV [+ Monto Exonerado] = Total CP)
                  "BI Gravada": "Base imponible gravada con IGV",
                  "IGV / IPM": "IGV/IPM de la base gravada",
                  "Monto Exonerado": "Monto de venta exonerada de IGV (confirmado: cuando BI/IGV estan en 0, este campo es igual al Total CP)",
                  # Resultado de la descarga
                  "Estado": "Resultado de la descarga automática del PDF/XML (`OK-oficial`, `OK-representacion`, `YA-DESCARGADO`, `FALLO`, `SIN-PROCESAR`)",
                  "Link PDF": "Link al PDF del comprobante, guardado en el repositorio de GitHub",
                  "Link XML": "Link al XML (ZIP) del comprobante, guardado en el repositorio de GitHub",
              }
              return d, base

          def generar_tabla(ruta_csv, ruta_md, titulo, contraparte, columnas, nota_omitidas):
              if not os.path.exists(ruta_csv) or os.path.getsize(ruta_csv) == 0:
                  print(f"No hay {ruta_csv} (o esta vacio), se omite {ruta_md}.")
                  return
              with open(ruta_csv, encoding="utf-8") as f:
                  filas = list(csv.reader(f))
              if len(filas) < 2:
                  print(f"{ruta_csv} no tiene filas de datos, se omite {ruta_md}.")
                  return
              headers = [h.strip() for h in filas[0]]
              datos = filas[1:]
              idx = {h: headers.index(h) for h in columnas if h in headers}

              resumen = {}
              if os.path.exists(RUTA_RESUMEN):
                  with open(RUTA_RESUMEN, encoding="utf-8") as f:
                      for r in csv.DictReader(f):
                          resumen[r["factura"]] = r

              filas_md = []
              for fila in datos:
                  def val(col):
                      i = idx.get(col)
                      return esc(fila[i]) if i is not None and i < len(fila) else ""

                  serie = val("Serie del CDP")
                  numero = val("Nro CP o Doc. Nro Inicial (Rango)")
                  r = resumen.get(f"{serie}-{numero}", {})
                  estado = (r.get("estado_pdf") or "SIN-PROCESAR").strip() or "SIN-PROCESAR"
                  archivo_pdf = (r.get("archivo_pdf") or "").strip()
                  archivo_xml = (r.get("archivo_xml") or "").strip()
                  link_pdf = f"[{archivo_pdf}]({BASE_GH}{archivo_pdf})" if archivo_pdf else "-"
                  link_xml = f"[{archivo_xml}]({BASE_GH}{archivo_xml})" if archivo_xml else "-"

                  celdas = [val(c) for c in columnas] + [estado, link_pdf, link_xml]
                  filas_md.append("| " + " | ".join(celdas) + " |")

              encabezado = "| " + " | ".join(columnas + ["Estado", "Link PDF", "Link XML"]) + " |"
              separador = "|" + "|".join(["---"] * (len(columnas) + 3)) + "|"
              periodo = datos[0][idx["Periodo"]].strip() if datos and "Periodo" in idx else "?"

              significado_map, significado_generico = significados(contraparte)
              filas_explicacion = "\n".join(
                  f"| `{c}` | {significado_map.get(c, significado_generico)} |"
                  for c in columnas + ["Estado", "Link PDF", "Link XML"]
              )
              explicacion = "## Qué significa cada columna\n\n| Columna | Significado |\n|---|---|\n" + filas_explicacion + "\n"

              os.makedirs(os.path.dirname(ruta_md) or ".", exist_ok=True)
              with open(ruta_md, "w", encoding="utf-8") as out:
                  out.write(f"# {titulo}\n\n")
                  out.write(
                      "Tabla generada automaticamente en cada ejecucion del workflow "
                      "`sire-cadena-completa.yml`, con TODOS los comprobantes del ultimo "
                      f"reporte descargado (periodo **{periodo}**, {len(datos)} "
                      "comprobante(s)). Se actualiza sola cada vez que se agregan mas "
                      f"comprobantes. {nota_omitidas}\n\n"
                  )
                  out.write(encabezado + "\n")
                  out.write(separador + "\n")
                  out.write("\n".join(filas_md) + "\n\n")
                  out.write(explicacion)
                  out.write(
                      "\n---\n\n*Generado automaticamente por el workflow "
                      f"`sire-cadena-completa.yml` a partir de `{ruta_csv}` "
                      "y `resumen.txt` en cada ejecucion.*\n"
                  )
              print(f"OK: {ruta_md} generado con {len(datos)} comprobante(s).")

          generar_tabla(
              RUTA_COMPRAS_CSV, DOC_COMPRAS_MD,
              f"Registro de Compras SIRE ({RUC}) — todos los comprobantes", "proveedor",
              COLUMNAS_COMPRAS,
              "Se omiten las columnas que SUNAT siempre trae vacias (`Año`, "
              "`Nro Final (Rango)`, `COD. DAM O DSI`, `Clasif de Bss y Sss`, "
              "`ID Proyecto Operadores`, `PorcPart`, `CAR Orig/ Ind E o I`, y "
              "`CLU1`...`CLU39`)."
          )
          generar_tabla(
              RUTA_VENTAS_CSV, DOC_VENTAS_MD,
              f"Registro de Ventas SIRE ({RUC}) — todos los comprobantes", "cliente",
              COLUMNAS_VENTAS,
              "El .txt de ventas de SUNAT no trae fila de cabecera (a diferencia "
              "de compras); se le puso una cabecera por posicion. Se omite solo "
              "`Nro Final (Rango)` (siempre vacio)."
          )
          PYEOF
          python3 /tmp/generar_md.py "$RUC" "$RUTA_COMPRAS_CSV" "$DOC_COMPRAS_MD" "$RUTA_VENTAS_CSV" "$DOC_VENTAS_MD"

      - name: Guardar copia historica del periodo (no se pisa entre corridas)
        # RUTA_COMPRAS_CSV/RUTA_VENTAS_CSV se SOBREESCRIBEN en cada corrida (son
        # "el ultimo periodo procesado"), asi que un rango de varios periodos, o
        # simplemente correr el workflow mes a mes, va perdiendo los meses
        # anteriores en esas rutas -- solo quedan en el HISTORIAL de git (cada
        # commit), no en un archivo facil de encontrar. Esta copia guarda cada
        # periodo en su propia ruta fija sire/<RUC>/historico/<periodo>/..., para
        # que Google Sheets (u otra cosa) pueda leer un periodo especifico sin
        # tener que andar buscando en el historial de commits.
        run: |
          PERIODO="${{ steps.periodo.outputs.valor }}"
          mkdir -p "$DIR_HISTORICO/$PERIODO"
          [ -s "$RUTA_COMPRAS_CSV" ] && cp "$RUTA_COMPRAS_CSV" "$DIR_HISTORICO/$PERIODO/reporte_parseado.csv"
          [ -s "$RUTA_VENTAS_CSV" ] && cp "$RUTA_VENTAS_CSV" "$DIR_HISTORICO/$PERIODO/reporte_parseado_ventas.csv"
          # resumen.txt (que factura -> que PDF/XML) tambien se sobreescribe en
          # cada corrida -- se guarda igual una copia fija por periodo, para que
          # Google Sheets pueda armar los links de un periodo especifico (ver
          # "Subir PDF/XML a Cloudflare R2" y GitHubSync.gs) sin depender de cual
          # fue la ULTIMA corrida.
          [ -s "$DIR_DESCARGAS/resumen.txt" ] && cp "$DIR_DESCARGAS/resumen.txt" "$DIR_HISTORICO/$PERIODO/resumen.txt"
          true

      - name: Guardar todo en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$RUTA_COMPRAS_CSV" "$RUTA_VENTAS_CSV" \
                  "$FACTURAS_CSV" "$DIR_DESCARGAS/" "$DIR_HISTORICO/" \
                  "$DOC_COMPRAS_MD" "$DOC_VENTAS_MD" \
                  2>/dev/null || true
          git diff --cached --quiet || git commit -m "SIRE + facturas ($RUC, ${{ inputs.tipo || matrix.empresa.tipo || 'ambos' }}, ${{ steps.periodo.outputs.valor }}) $(date -u +'%Y-%m-%d %H:%M UTC')"
          logrado=0
          for intento in 1 2 3 4 5 6 7 8; do
            if git push; then logrado=1; break; fi
            echo "Push rechazado, reintentando con rebase (intento $intento)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            # Jitter (no todas las empresas reintentan al mismo segundo si
            # varias chocan a la vez, con max-parallel:3 esto puede pasar de
            # verdad y no solo por rareza).
            sleep $((3 + RANDOM % 5))
          done
          if [ "$logrado" -ne 1 ]; then
            echo "ERROR: no se pudo subir los resultados despues de 8 intentos."
            exit 1
          fi

      - name: Avisar a la Sheet (webhook instantaneo, opcional)
        # 100% opcional -- si no configuraste SHEET_WEBHOOK_URL/SHEET_WEBHOOK_SECRET
        # como Repository secrets, este paso se omite solo con un aviso, sin
        # romper nada. Reemplaza la ESPERA de la importacion periodica/el
        # seguimiento de la Sheet (que igual siguen funcionando igual si no
        # configuras esto) por un aviso al toque apenas termina esta empresa
        # -- ver Webhook.gs del lado de Apps Script para los pasos de
        # configuracion completos (hay que desplegar una Web App).
        #
        # Solo tiene sentido en modo "completo": "solo-reintentar-fallidas"
        # no cambia el reporte SIRE (solo reintenta PDF/XML), asi que no hay
        # nada nuevo que la Sheet necesite reimportar.
        if: env.MODO == 'completo'
        env:
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_WEBHOOK_SECRET: ${{ secrets.SHEET_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SHEET_WEBHOOK_URL" ]; then
            echo "SHEET_WEBHOOK_URL no esta configurado; se omite el aviso instantaneo"
            echo "(la importacion periodica / el seguimiento de la Sheet siguen funcionando igual)."
            exit 0
          fi
          curl -sS -L "$SHEET_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"secreto\":\"$SHEET_WEBHOOK_SECRET\",\"ruc\":\"$RUC\",\"periodo\":\"${{ steps.periodo.outputs.valor }}\"}" \
            -o /tmp/webhook_resp.txt -w "HTTP %{http_code}\n"
          cat /tmp/webhook_resp.txt

      - name: Subir tambien como artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sire-y-facturas-${{ matrix.empresa.ruc }}
          path: |
            ${{ env.RUTA_COMPRAS_CSV }}
            ${{ env.RUTA_VENTAS_CSV }}
            ${{ env.FACTURAS_CSV }}
            ${{ env.DIR_DESCARGAS }}/
            sire/${{ matrix.empresa.ruc }}/extraido_venta/
            sire/${{ matrix.empresa.ruc }}/extraido_compra/
          retention-days: 7
          if-no-files-found: ignore
