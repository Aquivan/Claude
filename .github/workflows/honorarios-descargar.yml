# Proyecto "Honorarios · Grupo" (carpeta honorarios/). Descarga de SUNAT SOL los
# Recibos por Honorarios Electrónicos RECIBIDOS (y sus N/C), con su PDF y XML si se
# pide, de una empresa o de todas las empresas activas de empresas.json (las mismas
# de SIRE). Solo escribe en honorarios/datos/. Si un mes falla, igual se guarda
# lo que sí se bajó. No toca ningún otro proyecto. Nunca imprime claves.

name: Honorarios - descargar RHE recibidos (SUNAT SOL)
# La corrida diaria la pide la hoja (puntual); el cron de GitHub es solo respaldo
# (se atrasa horas o se salta dias). Ambas se llaman igual para no repetirlas.
run-name: ${{ (github.event_name == 'schedule' || inputs.diario) && 'Honorarios · diario' || 'Honorarios - descargar RHE recibidos (SUNAT SOL)' }}

on:
  # Todos los días ~6:22 a. m. de Lima: mes anterior y mes actual de todas las empresas (con PDF).
  schedule:
    - cron: '22 11 * * *'
    - cron: '52 17 * * *'   # respaldo 2 (12:52 p. m. Lima)
  workflow_dispatch:
    inputs:
      empresa:
        description: "RUC de una empresa, o 'todas' (las activas de empresas.json)"
        required: true
        default: "todas"
      periodo:
        description: "Primer mes AAAAMM"
        required: true
        default: "202601"
      hasta:
        description: "Último mes AAAAMM (vacío = mes actual)"
        required: false
        default: ""
      pdf:
        description: "Bajar también el PDF (y XML) de cada recibo"
        type: boolean
        default: true
      guardar:
        description: "Guardar en el repositorio (honorarios/datos/)"
        type: boolean
        default: true
      diario:
        description: "Corrida diaria automatica (la pide la hoja a su hora). No hace falta marcarlo a mano."
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Las corridas diarias (hoja o respaldo) van en fila, nunca a la vez: la
# segunda ve que la primera ya termino y no repite la descarga.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.diario) && 'honorarios-diario' || format('honorarios-descargar-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  empresas:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.e.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: empresas.json
          sparse-checkout-cone-mode: false
      - name: ¿Ya corrio la descarga diaria? (para no repetirla)
        id: hoy
        if: github.event_name == 'schedule' || inputs.diario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(date -u -d "$(TZ=America/Lima date +%Y-%m-%d) 05:00" +%Y-%m-%dT%H:%M:%SZ)  # desde las 0:00 de hoy (Lima)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow honorarios-descargar.yml --limit 30 \
                --json databaseId,displayTitle,createdAt,conclusion \
                --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt >= \"$desde\" and (.conclusion == \"success\" or .conclusion == \"\") and .displayTitle == \"Honorarios · diario\")] | length" || echo 0)
          echo "Corridas diarias recientes antes de esta: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "saltar=true" >> "$GITHUB_OUTPUT"; else echo "saltar=false" >> "$GITHUB_OUTPUT"; fi
      - id: e
        env:
          SALTAR: ${{ steps.hoy.outputs.saltar }}
          EMPRESA: ${{ inputs.empresa || 'todas' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          sel = os.environ["EMPRESA"].strip()
          if os.environ.get("SALTAR") == "true":
              print("lista=[]")  # la descarga diaria ya corrio: no se repite
              raise SystemExit
          emp = [e for e in json.load(open("empresas.json"))["empresas"] if e.get("activo")]
          rucs = [e["ruc"] for e in emp] if sel.lower() == "todas" else [sel]
          print("lista=" + json.dumps(rucs))
          PY
          cat "$GITHUB_OUTPUT"

  descargar:
    needs: empresas
    if: needs.empresas.outputs.lista != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ruc: ${{ fromJson(needs.empresas.outputs.lista) }}
    environment: ${{ matrix.ruc }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar recibos por honorarios recibidos
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
          PERIODO: ${{ inputs.periodo }}
          HASTA: ${{ inputs.hasta }}
          PDF: ${{ inputs.pdf }}
        run: |
          extra=""
          if [ "$PDF" = "false" ]; then extra="--sin-pdf"; fi
          # Corrida automática (sin datos de entrada): desde el mes anterior.
          if [ -z "$PERIODO" ]; then PERIODO=$(TZ=America/Lima date -d "$(TZ=America/Lima date +%Y-%m-01) -1 month" +%Y%m); fi
          python3 honorarios/scripts/descargar_rhe.py --periodo "$PERIODO" --hasta "$HASTA" --salida honorarios/datos $extra

      - name: Guardar en el repositorio
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.diario || inputs.guardar) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d honorarios/datos ] || { echo "Sin recibos para guardar."; exit 0; }
          git add honorarios/datos
          git diff --cached --quiet && { echo "Sin cambios."; exit 0; }
          git commit -m "Honorarios RHE ${{ matrix.ruc }} ${{ inputs.periodo || 'automatico' }}-${{ inputs.hasta || 'actual' }} [skip ci]"
          logrado=0
          for intento in 1 2 3 4 5; do
            if git push; then logrado=1; break; fi
            echo "Push rechazado, reintentando con rebase (intento $intento)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((intento * 3))
          done
          [ "$logrado" -eq 1 ] || { echo "ERROR: no se pudo subir honorarios/datos"; exit 1; }
