# Proyecto "Retenciones · Grupo" (carpeta retenciones/). Descarga de SUNAT SOL
# los comprobantes de retencion (CRE) EMITIDOS y RECIBIDOS, con su PDF y XML,
# de una empresa o de todas las empresas activas de empresas.json (las mismas
# de SIRE). Solo escribe en retenciones/datos/ (si guardar=true o en la corrida
# automatica diaria). Si un mes falla, igual se guarda lo que si se bajo.
# No toca ningun otro proyecto. Nunca imprime claves ni tokens.

name: Retenciones - descargar CRE (SUNAT SOL)
# La corrida diaria la pide la hoja (puntual); el cron de GitHub es solo respaldo
# (se atrasa horas o se salta dias). Ambas se llaman igual para no repetirlas.
run-name: ${{ (github.event_name == 'schedule' || inputs.diario) && 'Retenciones · diario' || 'Retenciones - descargar CRE (SUNAT SOL)' }}

on:
  # Todos los dias ~6:07 a. m. de Lima: mes anterior y mes actual de todas las empresas.
  schedule:
    - cron: '37 9 * * *'   # respaldo: 4:37 a.m. Perú (el bot la pide a las 2 a.m.; si ya corrió, no se repite)
  workflow_dispatch:
    inputs:
      empresa:
        description: "RUC de una empresa, o 'todas' (las activas de empresas.json)"
        required: true
        default: "todas"
      periodo:
        description: "Primer mes AAAAMM"
        required: true
        default: "202601"
      hasta:
        description: "Ultimo mes AAAAMM (vacio = mes actual; maximo 24 meses)"
        required: false
        default: ""
      archivos:
        description: "Archivos de cada comprobante: ambos (PDF y XML), pdf, xml o ninguno (solo la lista)"
        type: choice
        options: [ambos, pdf, xml, ninguno]
        default: ambos
      diagnostico:
        description: "Mostrar detalle tecnico en el log (sin claves)"
        type: boolean
        default: false
      guardar:
        description: "Guardar en el repositorio (retenciones/datos/)"
        type: boolean
        default: true
      diario:
        description: "Corrida diaria automatica (la pide la hoja a su hora). No hace falta marcarlo a mano."
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Las corridas diarias (hoja o respaldo) van en fila, nunca a la vez: la
# segunda ve que la primera ya termino y no repite la descarga.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.diario) && 'retenciones-diario' || format('retenciones-descargar-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  empresas:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.e.outputs.lista }}
      una: ${{ steps.una.outputs.una }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: empresas.json
          sparse-checkout-cone-mode: false
      - name: ¿Ya corrio la descarga diaria? (para no repetirla)
        id: hoy
        if: github.event_name == 'schedule' || inputs.diario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(date -u -d "$(TZ=America/Lima date +%Y-%m-%d) 05:00" +%Y-%m-%dT%H:%M:%SZ)  # desde las 0:00 de hoy (Lima)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow retenciones-descargar.yml --limit 30 \
                --json databaseId,displayTitle,createdAt,conclusion \
                --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt >= \"$desde\" and (.conclusion == \"success\" or .conclusion == \"\") and .displayTitle == \"Retenciones · diario\")] | length" || echo 0)
          echo "Corridas diarias recientes antes de esta: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "saltar=true" >> "$GITHUB_OUTPUT"; else echo "saltar=false" >> "$GITHUB_OUTPUT"; fi
      - name: ¿Una sola máquina para todas las empresas? (si existe el secreto SUNAT_CLAVES)
        id: una
        env:
          CLAVES: ${{ secrets.SUNAT_CLAVES }}
        run: if [ -n "$CLAVES" ]; then echo "una=true" >> "$GITHUB_OUTPUT"; else echo "una=false" >> "$GITHUB_OUTPUT"; fi
      - id: e
        env:
          SALTAR: ${{ steps.hoy.outputs.saltar }}
          EMPRESA: ${{ inputs.empresa || 'todas' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          sel = os.environ["EMPRESA"].strip()
          if os.environ.get("SALTAR") == "true":
              print("lista=[]")  # la descarga diaria ya corrio: no se repite
              raise SystemExit
          emp = [e for e in json.load(open("empresas.json"))["empresas"] if e.get("activo")]
          rucs = [e["ruc"] for e in emp] if sel.lower() == "todas" else [sel]
          print("lista=" + json.dumps(rucs))
          PY
          cat "$GITHUB_OUTPUT"

  descargar:
    needs: empresas
    if: needs.empresas.outputs.lista != '[]' && needs.empresas.outputs.una != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8   # todas las empresas a la vez (cada una escribe solo en su carpeta <RUC>)
      matrix:
        ruc: ${{ fromJson(needs.empresas.outputs.lista) }}
    environment: ${{ matrix.ruc }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar lector de PDF
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Descargar CRE emitidos y recibidos
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
          PERIODO: ${{ inputs.periodo }}
          HASTA: ${{ inputs.hasta }}
          ARCHIVOS: ${{ inputs.archivos }}
          DIAG: ${{ inputs.diagnostico }}
        run: |
          extra=""
          # ambos | pdf | xml | ninguno (la hoja manda lo que diga su Config; vacío = ambos;
          # true/false de versiones anteriores = ambos/ninguno)
          case "$ARCHIVOS" in
            pdf|xml|ninguno|ambos) ;;
            false) ARCHIVOS=ninguno ;;
            *) ARCHIVOS=ambos ;;
          esac
          extra="$extra --archivos $ARCHIVOS"
          # Corrida automatica (sin datos de entrada): desde el mes anterior.
          if [ -z "$PERIODO" ]; then PERIODO=$(TZ=America/Lima date -d "$(TZ=America/Lima date +%Y-%m-01) -1 month" +%Y%m); fi
          echo "Meses: $PERIODO a ${HASTA:-actual}"
          if [ "$DIAG" = "true" ]; then extra="$extra --diagnostico"; fi
          python3 retenciones/scripts/descargar_cre.py --periodo "$PERIODO" --hasta "$HASTA" --salida retenciones/datos $extra

      - name: Guardar en el repositorio
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.diario || inputs.guardar) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d retenciones/datos ] || { echo "Sin comprobantes para guardar."; exit 0; }
          git add retenciones/datos
          git diff --cached --quiet && { echo "Sin cambios."; exit 0; }
          git commit -m "Retenciones CRE ${{ matrix.ruc }} ${{ inputs.periodo || 'automatico' }}-${{ inputs.hasta || 'actual' }} [skip ci]"
          logrado=0
          for intento in 1 2 3 4 5 6 7 8; do
            if git push; then logrado=1; break; fi
            echo "Push rechazado, reintentando con rebase (intento $intento)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((intento * 2 + RANDOM % 5))
          done
          [ "$logrado" -eq 1 ] || { echo "ERROR: no se pudo subir retenciones/datos"; exit 1; }

  # Todas las empresas una tras otra en UNA máquina (GitHub cobra cada máquina aparte, mínimo 1 min).
  # Se usa cuando existe el secreto del repositorio SUNAT_CLAVES (una línea por empresa: RUC USUARIO CLAVE);
  # si no existe, corre "descargar" de arriba (una máquina por empresa, como antes).
  descargar-todas:
    name: descargar (todas)
    needs: empresas
    if: needs.empresas.outputs.lista != '[]' && needs.empresas.outputs.una == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Preparar lector de PDF
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Descargar CRE emitidos y recibidos de todas las empresas
        env:
          SUNAT_CLAVES: ${{ secrets.SUNAT_CLAVES }}
          LISTA: ${{ needs.empresas.outputs.lista }}
          PERIODO: ${{ inputs.periodo }}
          HASTA: ${{ inputs.hasta }}
          ARCHIVOS: ${{ inputs.archivos }}
          DIAG: ${{ inputs.diagnostico }}
        run: |
          case "$ARCHIVOS" in
            pdf|xml|ninguno|ambos) ;;
            false) ARCHIVOS=ninguno ;;
            *) ARCHIVOS=ambos ;;
          esac
          extra="--archivos $ARCHIVOS"
          if [ -z "$PERIODO" ]; then PERIODO=$(TZ=America/Lima date -d "$(TZ=America/Lima date +%Y-%m-01) -1 month" +%Y%m); fi
          echo "Meses: $PERIODO a ${HASTA:-actual}"
          if [ "$DIAG" = "true" ]; then extra="$extra --diagnostico"; fi
          python3 scripts/por_empresa.py --rucs "$LISTA" --minutos 30 -- python3 retenciones/scripts/descargar_cre.py --periodo "$PERIODO" --hasta "$HASTA" --salida retenciones/datos $extra

      - name: Guardar en el repositorio
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.diario || inputs.guardar) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d retenciones/datos ] || { echo "Sin datos para guardar."; exit 0; }
          git add retenciones/datos
          git diff --cached --quiet && { echo "Sin cambios."; exit 0; }
          git commit -m "Retenciones CRE todas ${{ inputs.periodo || 'automatico' }}-${{ inputs.hasta || 'actual' }} [skip ci]"
          logrado=0
          for intento in 1 2 3 4 5 6 7 8; do
            if git push; then logrado=1; break; fi
            echo "Push rechazado, reintentando con rebase (intento $intento)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((intento * 2 + RANDOM % 5))
          done
          [ "$logrado" -eq 1 ] || { echo "ERROR: no se pudo subir retenciones/datos"; exit 1; }
