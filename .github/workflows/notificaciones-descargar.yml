# Proyecto "Notificaciones · Grupo" (carpeta notificaciones/). Descarga del Buzón
# Electrónico de SUNAT SOL la lista de NOTIFICACIONES y MENSAJES, y los PDF de las
# notificaciones si se pide, de una empresa o de todas las activas de empresas.json.
# Lo bajado va DIRECTO a la hoja «Notificaciones · Grupo» (su aplicación web, con la llave de un solo uso que la
# hoja manda en «destino» y «llave»): en el repositorio (público) NO se guarda nada. Por eso solo la pide la hoja
# (o el bot de Cobranzas a través de la hoja). No toca ningún otro proyecto.
# Nunca imprime claves. Bajar el PDF marca la notificación como "leída" en SOL.

name: Notificaciones - descargar Buzón Electrónico (SUNAT SOL)
# La corrida diaria la pide la hoja (puntual); el cron de GitHub es solo respaldo
# (se atrasa horas o se salta dias). Ambas se llaman igual para no repetirlas.
run-name: ${{ (github.event_name == 'schedule' || inputs.diario) && 'Notificaciones · diario' || 'Notificaciones - descargar Buzón Electrónico (SUNAT SOL)' }}

on:
  # Ya no hay corrida programada de GitHub: sin la llave de la hoja no tendría a dónde mandar lo bajado.
  # La hoja la pide sola a las 8 y a las 17 (⏰ Activar actualización diaria), y el bot cuando se le pide.
  workflow_dispatch:
    inputs:
      empresa:
        description: "RUC de una empresa, o 'todas' (las activas de empresas.json)"
        required: true
        default: "todas"
      desde:
        description: "Desde qué mes (AAAAMM) o fecha (dd/mm/aaaa). Vacío = todo el buzón"
        required: false
        default: ""
      solo_nuevas:
        description: "Solo lo nuevo: deja de revisar el buzón donde empieza lo ya descargado (rápido). Se ignora si se pone 'desde'."
        type: boolean
        default: true
      pdf:
        description: "Bajar el PDF de cada notificación (la marca como leída en SOL)"
        type: boolean
        default: true
      pdf_mensajes:
        description: "Bajar también los adjuntos de los MENSAJES"
        type: boolean
        default: false
      destino:
        description: "Lo pone la hoja (dirección de su aplicación web). No lo escriba a mano."
        required: false
        default: ""
      llave:
        description: "Lo pone la hoja (llave de un solo uso). No lo escriba a mano."
        required: false
        default: ""
      diario:
        description: "Corrida diaria automatica (la pide la hoja a su hora). No hace falta marcarlo a mano."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Las corridas diarias (hoja o respaldo) van en fila, nunca a la vez: la
# segunda ve que la primera ya termino y no repite la descarga.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.diario) && 'notificaciones-diario' || format('notificaciones-descargar-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  empresas:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # tope de seguridad: si se cuelga no gasta 6 horas de minutos
    outputs:
      lista: ${{ steps.e.outputs.lista }}
      una: ${{ steps.una.outputs.una }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: empresas.json
          sparse-checkout-cone-mode: false
      - name: ¿Ya corrio la descarga diaria? (para no repetirla)
        id: hoy
        if: github.event_name == 'schedule' || inputs.diario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(date -u -d "5 hours ago" +%Y-%m-%dT%H:%M:%SZ)  # ultimas 5 horas
          # Solo cuenta una corrida que DE VERDAD descargó (sus trabajos "descargar" no se saltaron).
          # Antes contaba también las corridas que se habían saltado, y así se saltaban unas a otras en cadena.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow notificaciones-descargar.yml --limit 30 \
                --json databaseId,displayTitle,createdAt,conclusion \
                --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt >= \"$desde\" and (.conclusion == \"success\" or .conclusion == \"\") and .displayTitle == \"Notificaciones · diario\")] | .[].databaseId" || true)
          n=0
          for id in $ids; do
            k=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                  --jq '[.jobs[] | select((.name | startswith("descargar")) and (.conclusion == "success" or .conclusion == null or .status != "completed"))] | length' || echo 0)
            if [ "${k:-0}" -gt 0 ]; then n=$((n+1)); fi
          done
          echo "Corridas diarias recientes antes de esta: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "saltar=true" >> "$GITHUB_OUTPUT"; else echo "saltar=false" >> "$GITHUB_OUTPUT"; fi
      - name: ¿Una sola máquina para todas las empresas? (si existe el secreto SUNAT_CLAVES)
        id: una
        env:
          CLAVES: ${{ secrets.SUNAT_CLAVES }}
        run: if [ -n "$CLAVES" ]; then echo "una=true" >> "$GITHUB_OUTPUT"; else echo "una=false" >> "$GITHUB_OUTPUT"; fi
      - id: e
        env:
          SALTAR: ${{ steps.hoy.outputs.saltar }}
          EMPRESA: ${{ inputs.empresa || 'todas' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          sel = os.environ["EMPRESA"].strip()
          if os.environ.get("SALTAR") == "true":
              print("lista=[]")  # la descarga diaria ya corrio: no se repite
              raise SystemExit
          emp = [e for e in json.load(open("empresas.json"))["empresas"] if e.get("activo")]
          rucs = [e["ruc"] for e in emp] if sel.lower() == "todas" else [sel]
          print("lista=" + json.dumps(rucs))
          PY
          cat "$GITHUB_OUTPUT"

  descargar:
    needs: empresas
    if: needs.empresas.outputs.lista != '[]' && needs.empresas.outputs.una != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8   # todas las empresas a la vez (cada una escribe solo en su carpeta <RUC>)
      matrix:
        ruc: ${{ fromJson(needs.empresas.outputs.lista) }}
    environment: ${{ matrix.ruc }}
    steps:
      - name: Tapar la dirección y la llave de la hoja (antes de todo)
        run: |
          D=$(jq -r '.inputs.destino // ""' "$GITHUB_EVENT_PATH"); L=$(jq -r '.inputs.llave // ""' "$GITHUB_EVENT_PATH")
          [ -n "$D" ] && echo "::add-mask::$D"; [ -n "$L" ] && echo "::add-mask::$L"
          [ -n "$D" ] && [ -n "$L" ] || { echo "::error::Falta la llave de la hoja: pida la descarga desde la hoja «Notificaciones · Grupo» (menú 📬) o desde el bot."; exit 1; }
          { echo "DESTINO=$D"; echo "LLAVE=$L"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            notificaciones/scripts
            retenciones/scripts
            scripts/por_empresa.py
            empresas.json
          sparse-checkout-cone-mode: false

      - name: Descargar buzón (notificaciones y mensajes)
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
          PDF: ${{ inputs.pdf }}
          PDF_MENSAJES: ${{ inputs.pdf_mensajes }}
          DESDE: ${{ inputs.desde }}
          SOLO_NUEVAS: ${{ inputs.solo_nuevas }}
        run: |
          # Corrida automática: los últimos 3 meses (lo anterior ya quedó guardado).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.diario }}" = "true" ]; then DESDE=$(TZ=America/Lima date -d "$(TZ=America/Lima date +%Y-%m-01) -2 month" +%Y%m); fi
          extra=""
          if [ "$PDF" = "false" ]; then extra="$extra --sin-pdf"; fi
          if [ "$PDF_MENSAJES" = "true" ]; then extra="$extra --pdf-mensajes"; fi
          if [ -z "$DESDE" ] && [ "$SOLO_NUEVAS" = "true" ]; then extra="$extra --solo-nuevas"; fi
          python3 notificaciones/scripts/descargar_buzon.py --desde "$DESDE" $extra


  # Todas las empresas una tras otra en UNA máquina (GitHub cobra cada máquina aparte, mínimo 1 min).
  # Se usa cuando existe el secreto del repositorio SUNAT_CLAVES (una línea por empresa: RUC USUARIO CLAVE);
  # si no existe, corre "descargar" de arriba (una máquina por empresa, como antes).
  descargar-todas:
    name: descargar (todas)
    needs: empresas
    if: needs.empresas.outputs.lista != '[]' && needs.empresas.outputs.una == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Tapar la dirección y la llave de la hoja (antes de todo)
        run: |
          D=$(jq -r '.inputs.destino // ""' "$GITHUB_EVENT_PATH"); L=$(jq -r '.inputs.llave // ""' "$GITHUB_EVENT_PATH")
          [ -n "$D" ] && echo "::add-mask::$D"; [ -n "$L" ] && echo "::add-mask::$L"
          [ -n "$D" ] && [ -n "$L" ] || { echo "::error::Falta la llave de la hoja: pida la descarga desde la hoja «Notificaciones · Grupo» (menú 📬) o desde el bot."; exit 1; }
          { echo "DESTINO=$D"; echo "LLAVE=$L"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            notificaciones/scripts
            retenciones/scripts
            scripts/por_empresa.py
            empresas.json
          sparse-checkout-cone-mode: false

      - name: Descargar buzón (notificaciones y mensajes) de todas las empresas
        env:
          SUNAT_CLAVES: ${{ secrets.SUNAT_CLAVES }}
          LISTA: ${{ needs.empresas.outputs.lista }}
          PDF: ${{ inputs.pdf }}
          PDF_MENSAJES: ${{ inputs.pdf_mensajes }}
          DESDE: ${{ inputs.desde }}
          SOLO_NUEVAS: ${{ inputs.solo_nuevas }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.diario }}" = "true" ]; then DESDE=$(TZ=America/Lima date -d "$(TZ=America/Lima date +%Y-%m-01) -2 month" +%Y%m); fi
          extra=""
          if [ "$PDF" = "false" ]; then extra="$extra --sin-pdf"; fi
          if [ "$PDF_MENSAJES" = "true" ]; then extra="$extra --pdf-mensajes"; fi
          if [ -z "$DESDE" ] && [ "$SOLO_NUEVAS" = "true" ]; then extra="$extra --solo-nuevas"; fi
          python3 scripts/por_empresa.py --rucs "$LISTA" --minutos 30 -- python3 notificaciones/scripts/descargar_buzon.py --desde "$DESDE" $extra

