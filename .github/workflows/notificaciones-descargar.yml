# Proyecto "Notificaciones · Grupo" (carpeta notificaciones/). Descarga del Buzón
# Electrónico de SUNAT SOL la lista de NOTIFICACIONES y MENSAJES, y los PDF de las
# notificaciones si se pide, de una empresa o de todas las activas de empresas.json.
# Solo escribe en notificaciones/datos/. No toca ningún otro proyecto.
# Nunca imprime claves. Bajar el PDF marca la notificación como "leída" en SOL.

name: Notificaciones - descargar Buzón Electrónico (SUNAT SOL)
# La corrida diaria la pide la hoja (puntual); el cron de GitHub es solo respaldo
# (se atrasa horas o se salta dias). Ambas se llaman igual para no repetirlas.
run-name: ${{ (github.event_name == 'schedule' || inputs.diario) && 'Notificaciones · diario' || 'Notificaciones - descargar Buzón Electrónico (SUNAT SOL)' }}

on:
  # Todos los días ~7:07 a. m. y ~4:07 p. m. de Lima, todas las empresas (con PDF de notificaciones).
  schedule:
    - cron: '7 12,21 * * *'
    - cron: '41 16 * * *'   # respaldo (11:41 a. m. Lima)
    - cron: '41 1 * * *'    # respaldo (8:41 p. m. Lima)
  workflow_dispatch:
    inputs:
      empresa:
        description: "RUC de una empresa, o 'todas' (las activas de empresas.json)"
        required: true
        default: "todas"
      desde:
        description: "Desde qué mes (AAAAMM) o fecha (dd/mm/aaaa). Vacío = todo el buzón"
        required: false
        default: ""
      pdf:
        description: "Bajar el PDF de cada notificación (la marca como leída en SOL)"
        type: boolean
        default: true
      pdf_mensajes:
        description: "Bajar también los adjuntos de los MENSAJES"
        type: boolean
        default: false
      guardar:
        description: "Guardar en el repositorio (notificaciones/datos/)"
        type: boolean
        default: true
      diario:
        description: "Corrida diaria automatica (la pide la hoja a su hora). No hace falta marcarlo a mano."
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Las corridas diarias (hoja o respaldo) van en fila, nunca a la vez: la
# segunda ve que la primera ya termino y no repite la descarga.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.diario) && 'notificaciones-diario' || format('notificaciones-descargar-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  empresas:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.e.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: empresas.json
          sparse-checkout-cone-mode: false
      - name: ¿Ya corrio la descarga diaria? (para no repetirla)
        id: hoy
        if: github.event_name == 'schedule' || inputs.diario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(date -u -d "5 hours ago" +%Y-%m-%dT%H:%M:%SZ)  # ultimas 5 horas
          # Solo cuenta una corrida que DE VERDAD descargó (sus trabajos "descargar" no se saltaron).
          # Antes contaba también las corridas que se habían saltado, y así se saltaban unas a otras en cadena.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow notificaciones-descargar.yml --limit 30 \
                --json databaseId,displayTitle,createdAt,conclusion \
                --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt >= \"$desde\" and (.conclusion == \"success\" or .conclusion == \"\") and .displayTitle == \"Notificaciones · diario\")] | .[].databaseId" || true)
          n=0
          for id in $ids; do
            k=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                  --jq '[.jobs[] | select((.name | startswith("descargar")) and (.conclusion == "success" or .conclusion == null or .status != "completed"))] | length' || echo 0)
            if [ "${k:-0}" -gt 0 ]; then n=$((n+1)); fi
          done
          echo "Corridas diarias recientes antes de esta: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "saltar=true" >> "$GITHUB_OUTPUT"; else echo "saltar=false" >> "$GITHUB_OUTPUT"; fi
      - id: e
        env:
          SALTAR: ${{ steps.hoy.outputs.saltar }}
          EMPRESA: ${{ inputs.empresa || 'todas' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          sel = os.environ["EMPRESA"].strip()
          if os.environ.get("SALTAR") == "true":
              print("lista=[]")  # la descarga diaria ya corrio: no se repite
              raise SystemExit
          emp = [e for e in json.load(open("empresas.json"))["empresas"] if e.get("activo")]
          rucs = [e["ruc"] for e in emp] if sel.lower() == "todas" else [sel]
          print("lista=" + json.dumps(rucs))
          PY
          cat "$GITHUB_OUTPUT"

  descargar:
    needs: empresas
    if: needs.empresas.outputs.lista != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ruc: ${{ fromJson(needs.empresas.outputs.lista) }}
    environment: ${{ matrix.ruc }}
    steps:
      - uses: actions/checkout@v4

      - name: Descargar buzón (notificaciones y mensajes)
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
          PDF: ${{ inputs.pdf }}
          PDF_MENSAJES: ${{ inputs.pdf_mensajes }}
          DESDE: ${{ inputs.desde }}
        run: |
          # Corrida automática: los últimos 3 meses (lo anterior ya quedó guardado).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.diario }}" = "true" ]; then DESDE=$(TZ=America/Lima date -d "$(TZ=America/Lima date +%Y-%m-01) -2 month" +%Y%m); fi
          extra=""
          if [ "$PDF" = "false" ]; then extra="$extra --sin-pdf"; fi
          if [ "$PDF_MENSAJES" = "true" ]; then extra="$extra --pdf-mensajes"; fi
          python3 notificaciones/scripts/descargar_buzon.py --salida notificaciones/datos --desde "$DESDE" $extra

      - name: Guardar en el repositorio
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.diario || inputs.guardar) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d notificaciones/datos ] || { echo "Sin datos para guardar."; exit 0; }
          git add notificaciones/datos
          git diff --cached --quiet && { echo "Sin cambios."; exit 0; }
          git commit -m "Notificaciones buzon ${{ matrix.ruc }} [skip ci]"
          logrado=0
          for intento in 1 2 3 4 5; do
            if git push; then logrado=1; break; fi
            echo "Push rechazado, reintentando con rebase (intento $intento)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((intento * 3))
          done
          [ "$logrado" -eq 1 ] || { echo "ERROR: no se pudo subir notificaciones/datos"; exit 1; }
