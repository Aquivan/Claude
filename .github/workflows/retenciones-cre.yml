# Comprobante de Retención Electrónico (CRE) en SUNAT SEE-SOL, pedido por el bot (Telegram / WhatsApp).
#   modo vista  = llena todo y se detiene en la Vista preliminar (no emite).
#   modo emitir = emite, solo con la clave de confirmación de ESA solicitud (ver retenciones/emision/emitir_cre.py).
# Solo se lanza a pedido (workflow_dispatch); nunca al subir cambios. Una sola corrida a la vez por empresa.
name: Retenciones - CRE (SEE-SOL)
run-name: "CRE ${{ inputs.modo }} · ${{ inputs.ruc }}"
on:
  workflow_dispatch:
    inputs:
      ruc:
        description: "RUC de la empresa agente (su Environment con claves SOL)"
        required: true
      solicitud:
        description: 'JSON: {"proveedor_ruc":"…","documentos":[{"tipo":"01","serie":"F001","numero":"1","notas_credito":[],"fecha_pago":"dd/mm/aaaa","importe_pago":0,"retencion":0}]}'
        required: true
      modo:
        description: "vista (no emite) o emitir"
        required: true
        default: vista
        type: choice
        options: [vista, emitir]
      confirmar:
        description: "Clave de confirmación (la pone el bot cuando la persona aprueba). Obligatoria para emitir."
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: cre-${{ inputs.ruc }}
  cancel-in-progress: false
jobs:
  cre:
    name: "CRE ${{ inputs.modo }} (${{ inputs.ruc }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.ruc }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            retenciones/emision
            cobranzas/.clasp.json
          sparse-checkout-cone-mode: false
      - name: Dirección del bot (para mandarle el PDF; si falla, igual se emite)
        if: inputs.modo == 'emitir'
        continue-on-error: true
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          [ -n "$CLASPRC_JSON" ] || { echo "::warning::Falta CLASPRC_JSON: el PDF llegará con la próxima descarga de Retenciones."; exit 0; }
          npm install -g @google/clasp@3.3.0 >/dev/null 2>&1
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"; chmod 600 "$HOME/.clasprc.json"
          cd cobranzas
          ID=$(clasp --json list-deployments 2>/dev/null | python3 -c "
          import json,sys
          t=sys.stdin.read()
          try: d=json.loads(t[t.index('['):])
          except Exception: d=[]
          b=[x for x in d if (x.get('description') or '').startswith('Asistente Telegram')]
          print(b[0]['deploymentId'] if b else '')")
          rm -f "$HOME/.clasprc.json"
          [ -n "$ID" ] || { echo "::warning::No encontré la aplicación web del bot."; exit 0; }
          echo "::add-mask::$ID"
          echo "BOT_URL=https://script.google.com/macros/s/$ID/exec" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5   # Python fijo: el servidor ya trae 3.14 y playwright 1.47 no instala ahí
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install -q playwright==1.47.0
          python -m playwright install --with-deps chromium >/dev/null
      - name: CRE ${{ inputs.modo }}
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
          SOLICITUD: ${{ inputs.solicitud }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          cd retenciones/emision
          if [ "${{ inputs.modo }}" = "emitir" ]; then python emitir_cre.py; else python vista_cre.py; fi
