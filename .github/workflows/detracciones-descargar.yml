# Proyecto "Detracciones · Grupo" (carpeta detracciones/). Descarga de SUNAT SOL
# (Mis declaraciones y pagos → Consulta de Pago de Detracciones) los depósitos de
# detracciones de una empresa o de todas las activas de empresas.json, mes a mes.
# Lo bajado va DIRECTO a la hoja (su aplicación web, con la llave de un solo uso que la
# hoja manda en «destino» y «llave»): en el repositorio (público) NO se guarda nada y el
# registro no muestra montos. Por eso solo la pide la hoja (o el bot a través de la hoja).
# Nunca imprime claves. Solo LEE en SUNAT (no paga nada).

name: Detracciones - descargar depósitos (SUNAT SOL)
# La corrida diaria la pide la hoja (o el bot, a través de la hoja).
run-name: ${{ (inputs.diario) && 'Detracciones · diario' || 'Detracciones - descargar depósitos (SUNAT SOL)' }}

on:
  # Ya no hay corrida programada de GitHub: sin la llave de la hoja no tendría a dónde mandar lo bajado.
  workflow_dispatch:
    inputs:
      empresa:
        description: "RUC de una empresa (o varios separados por comas), o 'todas' (las activas de empresas.json)"
        required: true
        default: "todas"
      desde:
        description: "Desde qué mes de pago (AAAAMM). Vacío = los últimos 3 meses"
        required: false
        default: ""
      hasta:
        description: "Hasta qué mes de pago (AAAAMM). Vacío = este mes"
        required: false
        default: ""
      ivap:
        description: "Consultar también la cuenta especial IVAP"
        type: boolean
        default: false
      constancias:
        description: "Bajar también la Constancia de Depósito de cada detracción (solo las que faltan, ~5 KB c/u)"
        type: boolean
        default: true
      destino:
        description: "Lo pone la hoja (dirección de su aplicación web). No lo escriba a mano."
        required: false
        default: ""
      llave:
        description: "Lo pone la hoja (llave de un solo uso). No lo escriba a mano."
        required: false
        default: ""
      diario:
        description: "Corrida diaria automática (la pide la hoja a su hora). No hace falta marcarlo a mano."
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ (inputs.diario) && 'detracciones-diario' || format('detracciones-descargar-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  empresas:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # tope de seguridad: si se cuelga no gasta 6 horas de minutos
    outputs:
      lista: ${{ steps.e.outputs.lista }}
      una: ${{ steps.una.outputs.una }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: empresas.json
          sparse-checkout-cone-mode: false
      - name: ¿Ya corrió la descarga diaria? (para no repetirla)
        id: hoy
        if: inputs.diario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desde=$(date -u -d "10 hours ago" +%Y-%m-%dT%H:%M:%SZ)
          # Solo cuenta una corrida que DE VERDAD descargó (sus trabajos "descargar" no se saltaron).
          # Antes contaba también las corridas que se habían saltado, y así se saltaban unas a otras en cadena.
          ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow detracciones-descargar.yml --limit 30 \
                --json databaseId,displayTitle,createdAt,conclusion \
                --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt >= \"$desde\" and (.conclusion == \"success\" or .conclusion == \"\") and .displayTitle == \"Detracciones · diario\")] | .[].databaseId" || true)
          n=0
          for id in $ids; do
            k=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                  --jq '[.jobs[] | select((.name | startswith("descargar")) and (.conclusion == "success" or .conclusion == null or .status != "completed"))] | length' || echo 0)
            if [ "${k:-0}" -gt 0 ]; then n=$((n+1)); fi
          done
          echo "Corridas diarias recientes antes de esta: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "saltar=true" >> "$GITHUB_OUTPUT"; else echo "saltar=false" >> "$GITHUB_OUTPUT"; fi
      - name: ¿Una sola máquina para todas las empresas? (si existe el secreto SUNAT_CLAVES)
        id: una
        env:
          CLAVES: ${{ secrets.SUNAT_CLAVES }}
        run: if [ -n "$CLAVES" ]; then echo "una=true" >> "$GITHUB_OUTPUT"; else echo "una=false" >> "$GITHUB_OUTPUT"; fi
      - id: e
        env:
          SALTAR: ${{ steps.hoy.outputs.saltar }}
          EMPRESA: ${{ inputs.empresa || 'todas' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          sel = os.environ["EMPRESA"].strip()
          if os.environ.get("SALTAR") == "true":
              print("lista=[]")
              raise SystemExit
          emp = [e for e in json.load(open("empresas.json"))["empresas"] if e.get("activo")]
          rucs = [e["ruc"] for e in emp] if sel.lower() == "todas" else [r.strip() for r in sel.split(",") if r.strip()]
          print("lista=" + json.dumps(rucs))
          PY
          cat "$GITHUB_OUTPUT"

  descargar:
    needs: empresas
    if: needs.empresas.outputs.lista != '[]' && needs.empresas.outputs.una != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8   # todas las empresas a la vez (cada una escribe solo en su carpeta <RUC>)
      matrix:
        ruc: ${{ fromJson(needs.empresas.outputs.lista) }}
    environment: ${{ matrix.ruc }}
    steps:
      - name: Tapar la dirección y la llave de la hoja (antes de todo)
        run: |
          D=$(jq -r '.inputs.destino // ""' "$GITHUB_EVENT_PATH"); L=$(jq -r '.inputs.llave // ""' "$GITHUB_EVENT_PATH")
          [ -n "$D" ] && echo "::add-mask::$D"; [ -n "$L" ] && echo "::add-mask::$L"
          { echo "DESTINO=$D"; echo "LLAVE=$L"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            detracciones/scripts
            scripts/por_empresa.py
            empresas.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5   # Python fijo: el servidor ya trae 3.14 y playwright 1.47 no instala ahí
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Descargar depósitos de detracciones
        env:
          SUNAT_RUC: ${{ secrets.SUNAT_RUC }}
          SUNAT_USUARIO: ${{ secrets.SUNAT_USUARIO }}
          SUNAT_CLAVE: ${{ secrets.SUNAT_CLAVE }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          IVAP: ${{ inputs.ivap }}
          # El cron de respaldo no trae inputs: baja constancias. La hoja manda SI/NO según su Config.
          CONSTANCIAS: ${{ inputs.constancias }}
        run: |
          # Corrida automática: los últimos 3 meses (lo anterior ya está en la hoja).
          if [ "${{ inputs.diario }}" = "true" ]; then DESDE=""; HASTA=""; fi
          extra=""
          if [ "$IVAP" = "true" ]; then extra="--ivap"; fi
          if [ "$CONSTANCIAS" = "true" ]; then extra="$extra --constancias"; fi
          python detracciones/scripts/descargar_detracciones.py --desde "$DESDE" --hasta "$HASTA" $extra


  # Todas las empresas una tras otra en UNA máquina (GitHub cobra cada máquina aparte, mínimo 1 min).
  # Se usa cuando existe el secreto del repositorio SUNAT_CLAVES (una línea por empresa: RUC USUARIO CLAVE);
  # si no existe, corre "descargar" de arriba (una máquina por empresa, como antes).
  descargar-todas:
    name: descargar (todas)
    needs: empresas
    if: needs.empresas.outputs.lista != '[]' && needs.empresas.outputs.una == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Tapar la dirección y la llave de la hoja (antes de todo)
        run: |
          D=$(jq -r '.inputs.destino // ""' "$GITHUB_EVENT_PATH"); L=$(jq -r '.inputs.llave // ""' "$GITHUB_EVENT_PATH")
          [ -n "$D" ] && echo "::add-mask::$D"; [ -n "$L" ] && echo "::add-mask::$L"
          { echo "DESTINO=$D"; echo "LLAVE=$L"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            detracciones/scripts
            scripts/por_empresa.py
            empresas.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5   # Python fijo: el servidor ya trae 3.14 y playwright 1.47 no instala ahí
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Descargar depósitos de detracciones de todas las empresas
        env:
          SUNAT_CLAVES: ${{ secrets.SUNAT_CLAVES }}
          LISTA: ${{ needs.empresas.outputs.lista }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          IVAP: ${{ inputs.ivap }}
          CONSTANCIAS: ${{ inputs.constancias }}
        run: |
          if [ "${{ inputs.diario }}" = "true" ]; then DESDE=""; HASTA=""; fi
          extra=""
          if [ "$IVAP" = "true" ]; then extra="--ivap"; fi
          if [ "$CONSTANCIAS" = "true" ]; then extra="$extra --constancias"; fi
          python scripts/por_empresa.py --rucs "$LISTA" --minutos 40 -- python detracciones/scripts/descargar_detracciones.py --desde "$DESDE" --hasta "$HASTA" $extra

